function toastNotify(msg){
  try{
    var img=new Image();
    img.src='http://127.0.0.1:1000/notify?msg='+encodeURIComponent(msg)+'&t='+Date.now();
  }catch(e){}
}

function showProgress(on){
  if(on){
    progWrap.className='show';
    progWrap.setAttribute('aria-hidden','false');
  }else{
    progWrap.className='';
    progWrap.setAttribute('aria-hidden','true');
    progBar.className='';
    progBar.style.width='0%';
  }
}

function setProgressPct(pct){
  progBar.className='';
  if(pct<0){
    progBar.className='indeterminate';
    progBar.style.width='40%';
  }else{
    if(pct>100)pct=100;
    if(pct<0)pct=0;
    progBar.style.width=pct+'%';
  }
}

function stopPoll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

var apiBase='';
function startPoll(){
  stopPoll();
  pollTimer=setInterval(function(){
    fetch(apiBase+'/progress').then(function(r){return r.json();}).then(function(j){
      if(!j)return;
      if(j.phase==='idle'){
        if(typeof j.pct==='number' && j.pct>=100)setProgressPct(100);
        return;
      }
      if(typeof j.pct==='number')setProgressPct(j.pct);
    }).catch(function(){});
  },250);
}

function folderLabel(id){ return t('f_'+id); }
function countIn(folder){
  var n=0,i;
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].folder===folder)n++;}
  return n;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function localMatchesEntry(meta, e){
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(e.checksum||'').toLowerCase();
  if(localSum.length===64 && catSum.length===64) return localSum===catSum;

    if(!map[m.path]){ map[m.path]={path:m.path, entries:[]}; out.push(map[m.path]); }
    map[m.path].entries.push(m);

function findDownloadedUpdates(list, done){

        localMeta(g.path).then(function(meta){
          var i, target=null;
          if(!meta || !meta.ok || !meta.exists) return;
          for(i=0;i<g.entries.length;i++){ if(localMatchesEntry(meta, g.entries[i])) return; }

          for(i=0;i<g.entries.length;i++){

    item=queue[n++];
    if(!isConsoleHost()){
      setStatus(t('skipNotConsole',{name:item.name}));
      setTimeout(step, 150);

    localMeta(item.path).then(function(meta){
      if(!(meta && meta.ok && meta.exists)){
        setStatus(t('skipMissing',{name:item.name}));

      sendPayload(item.name, item.path, (item.url||item.path), function(){
        setTimeout(step, 400);
      });
    }).catch(function(){
      setStatus(t('skipMissing',{name:item.name}));
      setTimeout(step, 200);
    });
  }

}

  if(p===base) return true;

function killPayload(name, sendBtn, path){
  var base=normBase(path||'');
  dbgKill('Kill pressed '+name+' path='+(path||''));
  if(!path || !base){
    dbgKill('Kill blocked no path '+name);
    return;
  }
  if(isProtectedKillName(name) || isProtectedKillName(base)){
    dbgKill('Kill blocked protected '+name);
    return;
  }
  /* Send uses <img> to :9021 (OK from HTTPS Pages). Kill/PID track need HTTP :1000 same-origin. */
  if(location.protocol==='https:'){
    dbgKill('Kill blocked HTTPS Pages - use HTTP launcher :1000');
    return;
  }
  /* Re-check /processes_list. A saved PID is not enough if that PID was reused. */
  pldmgrFetch('/processes_list').then(function(data){
    var procs=(data && data.processes) ? data.processes : [];
    var pr=findRunningProc(base, procs);
    if(!pr){
      clearPayloadPid(name);
      hideKillForName(name);
      dbgKill('Kill FAIL '+name+' not loaded');
      if(currentFolder==='kill') showKillFolder();
      return;
    }
    dbgKill('Kill confirmed '+name+' path='+path+' pid='+pr.pid+' ('+(pr.name||'')+')');
    killByPid(name, pr.pid, sendBtn, path);
  }).catch(function(err){
    var msg=(err && err.message) ? String(err.message) : String(err);
    if(msg.indexOf('HTTP')===0)
      dbgKill('Kill FAIL '+name+' pldmgr list '+msg);
    else
      dbgKill('Kill FAIL '+name+' fetch/CORS/pldmgr list: '+msg);
  });
}

function isLocalLauncherHost(){
  return isConsoleHost();
}
function canUseUpdateApi(){
  /* Update writes /data/elf-launcher - only console :1000, never GitHub Pages. */
  return isLocalLauncherHost();
}
function localMeta(path){
  return fetch('/file_meta?path='+encodeURIComponent(path)).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function needsUpdate(meta, catalog){
  /* Update only when local file already exists and differs from repo.
     Missing file = first install via Send (no Update button). */
  if(!catalog || !catalog.checksum) return false;
  if(!meta || !meta.ok || !meta.exists) return false;
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(catalog.checksum||'').toLowerCase();
  if(localSum && localSum.length===64 && catSum.length===64){
    return localSum !== catSum;
  }
  /* Size fallback when sidecar checksum is absent. */
  if(catalog.size && (meta.size|0)>0){
    return (meta.size|0) !== (catalog.size|0);
  }
  return false;
}
function runUpdate(path, catalog, btn, row, verEl){
  if(!catalog || !catalog.url || !catalog.checksum){
    setStatus(t('updMissing'));
    return;
  }
  btn.disabled=true;
  btn.setAttribute('data-state','busy');
  btn.textContent=t('updating');
  setStatus(t('updatingName',{name:catalog.name}));
  showProgress(true);
  setProgressPct(-1);
  var q='/update?path='+encodeURIComponent(path)+
    '&url='+encodeURIComponent(catalog.url)+
    '&sha256='+encodeURIComponent(catalog.checksum);
  if(catalog.size) q+='&size='+encodeURIComponent(String(catalog.size|0));
  fetch(q).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); }).then(function(res){
    showProgress(false);
    if(!res.ok || !res.j || !res.j.ok){
      var msg=(res.j && res.j.message) ? res.j.message : 'update failed';
      setStatus(t('updateFailed',{msg:msg}));
      btn.disabled=false;
      btn.setAttribute('data-state','idle');
      btn.textContent=t('update');
      return;
    }
    setProgressPct(100);
    setStatus(t('updatedName',{name:catalog.name}));
    pendingUpdates=(pendingUpdates||[]).filter(function(u){ return u.path!==path; });
    paintSideUpdate();
    if(btn.parentNode) btn.parentNode.removeChild(btn);
    if(verEl && verEl.parentNode) verEl.parentNode.removeChild(verEl);
    /* File is still local, so the main button stays Load. */
    if(row){
      var primary=primaryRun(row);
      if(primary) finishPrimary(primary, 'load');
    }
  }).catch(function(e){
    showProgress(false);
    btn.disabled=false;
    btn.setAttribute('data-state','idle');
    btn.textContent=t('update');
    setStatus(t('updateFailed',{msg:(e&&e.message)?e.message:String(e)}));
  });
}


function rowByName(name){
  var rows=document.querySelectorAll ? document.querySelectorAll('[data-name]') : [];
  var i;
  for(i=0;i<rows.length;i++){
    if(rows[i].getAttribute('data-name')===name) return rows[i];
  }
  return null;
}
function hideKillBtn(tr){
  var b=tr && tr.querySelector && tr.querySelector('button.run.kill');
  if(b && b.parentNode) b.parentNode.removeChild(b);
}
function hideKillForName(name){
  hideKillBtn(rowByName(name));
}
function rowFileBase(tr){
  if(!tr || !tr.getAttribute) return '';
  return normBase(tr.getAttribute('data-path')||'');
}
function showKillBtn(tr){
  /* Close is removed from the row. Kill stays off the side menu. */
  return;
  if(!tr) return;
  var name=tr.getAttribute('data-name');
  var path=tr.getAttribute('data-path')||'';
  var base=normBase(path);
  if(!name || !path || !base || isProtectedKillName(name) || isProtectedKillName(base)){ hideKillBtn(tr); return; }
  if(tr.querySelector('button.run.kill')) return;
  var act=tr.querySelector('div.a');
  if(!act) return;
  var killBtn=document.createElement('button');
  killBtn.type='button';
  killBtn.className='run kill';
  killBtn.textContent=t('close');
  killBtn.addEventListener('click',function(){
    var sendBtn=tr.querySelector('button.run:not(.kill):not(.update)') || tr.querySelector('button.run');
    killPayload(name, sendBtn, path);
  });
  act.appendChild(killBtn);
}
var lastProcs=null;
function pidStillListed(pid, procs){
  var i;
  pid=pid|0;
  if(pid<=0 || !procs) return false;
  for(i=0;i<procs.length;i++){
    if(procs[i] && (procs[i].pid|0)===pid) return true;
  }
  return false;
}
function payloadIsRunning(name, procs){
  /* Not catalog presence, not a file in /data, not the Active flag.
     Only a /processes_list entry whose name matches this ELF, or whose PID
     is the one we stored at Send and whose name is still that ELF or payload.elf. */
  return !!findRunningProc(name, procs);
}
function paintPayloadButton(tr){
  var btn, base, on, st;
  if(!tr) return;
  btn=primaryRun(tr);
  if(!btn) return;
  st=btn.getAttribute('data-state')||'';
  if(st!=='load' && st!=='loaded') return;
  base=rowFileBase(tr);
  on=!!(lastProcs && base && payloadIsRunning(base, lastProcs));
  /* A load means it is running until that saved PID is gone. */
  if(!on && isActiveName(tr.getAttribute('data-name'))){
    var saved=getPayloadPid(base)|0;
    if(!(saved && lastProcs && !pidStillListed(saved, lastProcs))) on=true;
  }
  finishPrimary(btn, on?'loaded':'load');
}
var procWatch=0;
function watchRunning(){
  if(procWatch) return;
  procWatch=setInterval(function(){
    if(!document.querySelector('[data-name]')) return;
    refreshKillButtons();
  }, 2000);
}
function refreshKillButtons(){
  var rows=document.querySelectorAll ? document.querySelectorAll('[data-name]') : [];
  var i;
  if(!rows.length) return;
  /* No process list (HTTPS Pages, or not the console) => no Kill at all. */
  if(location.protocol==='https:' || !/PlayStation/i.test(navigator.userAgent)){
    for(i=0;i<rows.length;i++) hideKillBtn(rows[i]);
    return;
  }
  pldmgrFetch('/processes_list').then(function(data){
    var procs=(data && data.processes) ? data.processes : [];
    var i, tr, name;
    lastProcs=procs;
    for(i=0;i<rows.length;i++){
      tr=rows[i];
      name=rowFileBase(tr);
      if(name && payloadIsRunning(name, procs)) showKillBtn(tr);
      else {
        hideKillBtn(tr);
        /* Drop the PID only once it is gone. A name mismatch is not proof it stopped. */
        if(getPayloadPid(name) && !pidStillListed(getPayloadPid(name), procs)) clearPayloadPid(name);
      }
      paintPayloadButton(tr);
    }
  }).catch(function(){
    var i;
    for(i=0;i<rows.length;i++) hideKillBtn(rows[i]);
  });
}

function elfFileBase(p){
  var s='';
  if(p && p.path) s=p.path;
  else if(p && p.name) s=p.name;
  return normBase(s);
}
function listLoadedPayloads(procs){
  var raw=[], i, p, base, pr, byPid, k, group, keep, j, comm, out;
  if(!procs) return [];
  for(i=0;i<PAYLOADS.length;i++){
    p=PAYLOADS[i];
    base=elfFileBase(p);
    if(!base || isProtectedKillName(base) || isProtectedKillName(p.name)) continue;
    pr=findRunningProc(base, procs);
    if(!pr) continue;
    raw.push({p:p, pr:pr, base:base});
  }
  byPid={};
  for(i=0;i<raw.length;i++){
    k=String(raw[i].pr.pid|0);
    if(!byPid[k]) byPid[k]=[];
    byPid[k].push(raw[i]);
  }
  out=[];
  for(k in byPid){
    if(!Object.prototype.hasOwnProperty.call(byPid, k)) continue;
    group=byPid[k];
    if(group.length===1){ out.push(group[0]); continue; }
    comm=normBase(group[0].pr.name||'');
    keep=null;
    for(j=0;j<group.length;j++){ if(group[j].base===comm) keep=group[j]; }
    if(keep) out.push(keep);
  }
  return out;
}
function wrapListGrid(){
  var rows=viewEl.querySelectorAll ? viewEl.querySelectorAll('.elfwrap') : [];
  var heads=viewEl.querySelectorAll ? viewEl.querySelectorAll('.elfhead') : [];
  var i, grid, node;
  if(!rows.length) return;
  grid=document.createElement('div');
  grid.className='listgrid';
  node=rows[0].parentNode;
  node.insertBefore(grid, heads.length ? heads[0] : rows[0]);
  for(i=0;i<heads.length && i<2;i++) grid.appendChild(heads[i]);
  for(i=0;i<rows.length;i++) grid.appendChild(rows[i]);
}

/* Saved files are whatever /file_meta says exists under /data/elf-launcher/mirror.
   hbinstall exposes file_meta, update, and run. It has no file-delete route, so this list has no Delete button. */
function pendingFor(path){
  var i;
  for(i=0;i<(pendingUpdates||[]).length;i++){ if(pendingUpdates[i].path===path) return pendingUpdates[i]; }
  return null;
}
function paintDownloaded(found){
  var html, i, item, p, pend;
  noteDownloadedCount(found.length);
  if(currentFolder!=='downloaded') return;
  html=folderChipsHtml('downloaded');
  if(!found.length){
    syncSideActions('');
    viewEl.innerHTML=html+'<p class="empty">'+esc(t('noSaved'))+'</p>';
    bindSubfolds();
    return;
  }
  found.sort(function(a,b){
    var an=String((a.p&&a.p.name)||'').toLowerCase();
    var bn=String((b.p&&b.p.name)||'').toLowerCase();
    return an<bn?-1:(an>bn?1:0);
  });
  syncSideActions('<button type="button" id="loadsel">'+esc(t('multi'))+'</button>');
  html+=headHtml(true);
  for(i=0;i<found.length;i++){
    item=found[i];
    p=item.p;
    pend=pendingFor(p.path);
    html+='<div class="elfwrap" data-path="'+esc(p.path)+'" data-name="'+esc(p.name)+'"><div class="elf">';
    html+='<div class="m"><label class="pick"><input class="mark" type="checkbox" aria-label="'+esc(t('select'))+'"></label></div>';
    html+='<div class="n"><b>'+esc(p.name)+'</b></div>';
    html+='<div class="v">'+esc(p.version||'')+'</div>';
    html+='<div class="a">';
    html+='<label class="pick"><input class="auto" type="checkbox"'+(isAutoName(p.name)?' checked':'')+'><span>'+esc(t('auto'))+'</span></label>';
    if(pend) html+='<button type="button" class="run update" data-state="idle" title="'+esc(t('catalogVersion')+' '+updateVerLabel(pend.entry))+'">'+esc(t('update'))+'</button>';
    html+='<button type="button" class="run del">'+esc(t('del'))+'</button>';
    html+='</div>';
    html+='</div></div>';
  }
  viewEl.innerHTML=html;
  wrapListGrid();
  bindSubfolds();
  var dels=viewEl.querySelectorAll('button.run.del');
  var di;
  for(di=0;di<dels.length;di++){
    dels[di].addEventListener('click',function(ev){
      var node=ev.currentTarget;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(!node) return;
      deleteDownloaded(node.getAttribute('data-name'), node.getAttribute('data-path'), node);
    });
  }
  var ups=viewEl.querySelectorAll('button.run.update');
  for(di=0;di<ups.length;di++){
    ups[di].addEventListener('click',function(ev){
      var b=ev.currentTarget, node=b, pd;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(!node) return;
      pd=pendingFor(node.getAttribute('data-path'));
      if(pd) runUpdate(pd.path, pd.entry, b, null, null);
    });
  }
  var autoBoxes=viewEl.querySelectorAll('input.auto');
  var ai;
  for(ai=0;ai<autoBoxes.length;ai++){
    autoBoxes[ai].onchange=function(){
      var node=this.parentNode;
      while(node && (!node.getAttribute || !node.getAttribute('data-name'))) node=node.parentNode;
      if(!node) return;
      setAuto(node.getAttribute('data-name'), !!this.checked);
      renderNav(currentFolder);
    };
  }
  var loadBtn=document.getElementById('loadsel');
  if(loadBtn) loadBtn.onclick=function(){
    var marks=viewEl.querySelectorAll('input.mark'), queue=[], k, node;
    for(k=0;k<marks.length;k++){
      if(!marks[k].checked) continue;
      node=marks[k].parentNode;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(node) queue.push({name:node.getAttribute('data-name'), path:node.getAttribute('data-path')});
    }
    if(!queue.length){ setStatus(t('markFirst')); return; }
    var n=0, ok=0;
    loadBtn.disabled=true;
    function next(){
      if(n>=queue.length){ loadBtn.disabled=false; setStatus(t('loadedN',{n:ok})); return; }
      var it=queue[n++], cat=findPayload(it.path);
      sendPayload(it.name, it.path, (cat&&cat.url)||it.path, function(res){
        if(res!==false) ok++;
        setTimeout(next, 600);
      });
    }
    next();
  };
}
function showDownloadedFolderCount(){
  var queue, n, inflight, idx;
  if(!isConsoleHost() || !PAYLOADS || !PAYLOADS.length) return;
  queue=PAYLOADS.slice();
  n=0; inflight=0; idx=0;
  function pump(){
    var item;
    if(idx>=queue.length && inflight===0){ noteDownloadedCount(n); return; }
    while(inflight<4 && idx<queue.length){
      item=queue[idx++];
      inflight++;
      (function(it){
        localMeta(it.path).then(function(meta){
          if(meta && meta.ok && meta.exists) n++;
        }).catch(function(){}).then(function(){ inflight--; pump(); });
      })(item);
    }
  }
  pump();
}
function showDownloadedFolder(){
  var queue, found, inflight, idx;
  currentFolder='downloaded';
  homeEl.className='';
  homeEl.innerHTML='';
  hdrEl.className='show';
  titleEl.textContent=t('downloaded');
  titleEl.className='beam';
  viewEl.className='show';
  syncSideActions('');
  renderNav('downloaded');
  if(!isConsoleHost()){
    viewEl.innerHTML=folderChipsHtml('downloaded')+'<p class="empty">'+esc(t('savedOnConsole'))+'</p>';
    bindSubfolds();
    return;
  }
  viewEl.innerHTML=folderChipsHtml('downloaded')+'<p class="empty">'+esc(t('checkingSaved'))+'</p>';
  bindSubfolds();
  queue=PAYLOADS.slice();
  found=[];
  inflight=0;
  idx=0;
  function pump(){
    var p;
    if(currentFolder!=='downloaded') return;
    if(idx>=queue.length && inflight===0){
      paintDownloaded(found);
      return;
    }
    while(inflight<4 && idx<queue.length){
      p=queue[idx++];
      inflight++;
      (function(item){
        localMeta(item.path).then(function(meta){
          if(meta && meta.ok && meta.exists) found.push({p:item, size:(meta.size|0)});
        }).catch(function(){}).then(function(){
          inflight--;
          pump();
        });
      })(p);
    }
  }
  pump();
}

  pldmgrFetch('/processes_list').then(function(data){

function stripAutoChecks(){
  var boxes, i, box, lab;
  if(currentFolder==='downloaded' || !viewEl || !viewEl.getElementsByTagName) return;
  boxes=viewEl.getElementsByTagName('input');
  for(i=boxes.length-1;i>=0;i--){
    box=boxes[i];
    if(!box.className || box.className.indexOf('auto')<0) continue;
    lab=box.parentNode;
    if(lab && lab.className && lab.className.indexOf('pick')>=0 && lab.parentNode) lab.parentNode.removeChild(lab);
    else if(box.parentNode) box.parentNode.removeChild(box);
  }
}
function showFolder(id){
  var label,i,list=[],p,html,markOnly,catalogView;
  if(id==='elf') id=lastElfFolder||'loader';
  if(id==='kill'){ showKillFolder(); return; }
  if(id==='downloaded'){ showDownloadedFolder(); return; }
  label=(id==='auto') ? t('autoPayload') : (isCatalogId(id) ? folderLabel(id) : id);
  if(isCatalogId(id)) lastElfFolder=id;
  markOnly=(id==='auto');
  catalogView=isCatalogId(id);
  currentFolder=id;
  homeEl.className='';
  homeEl.innerHTML='';
  hdrEl.className='show';
  titleEl.textContent=label;
  titleEl.className='beam';
  viewEl.className='show';
  /* Multi/Select live only in Downloaded. */
  syncSideActions('');
  renderNav(id);
  for(i=0;i<PAYLOADS.length;i++){
    if(id==='auto'){ if(isAutoName(PAYLOADS[i].name)) list.push(PAYLOADS[i]); }
    else if(PAYLOADS[i].folder===id) list.push(PAYLOADS[i]);
  }
  if(!list.length){
    viewEl.innerHTML=(catalogView?folderChipsHtml(id):'')+'<p class="empty">'+esc(t('emptyFolder'))+'</p>';
    bindSubfolds();
    return;
  }
  var onPs5=/PlayStation/i.test(navigator.userAgent);
  html=(catalogView?folderChipsHtml(id):'')+headHtml(false);
  for(i=0;i<list.length;i++){
    p=list[i];
    html+='<div class="elfwrap" data-path="'+esc(p.path)+'" data-name="'+esc(p.name)+'"><div class="elf nom">';
    html+='<div class="n"><b>'+esc(p.name)+'</b></div>';
    html+='<div class="v">'+esc(p.version)+'</div>';
    if(p.info && p.info!==p.name) html+='<div class="d">'+esc(p.info)+'</div>';
    var on=isActiveName(p.name);
    var state;
    if(isConsoleHost()) state='unknown'; /* Disk check fills Download or Load. */
    else state=on?'loaded':(onPs5?'send':'download');
    if(markOnly) html+='<div class="a"></div>';
    else html+='<div class="a"><button type="button" class="run" data-state="'+state+'">\u2026</button></div>';
    html+='</div></div>';
  }
  viewEl.innerHTML=html;
  wrapListGrid();
  bindSubfolds();
  stripAutoChecks();
  var rows=viewEl.querySelectorAll('[data-path]');
  for(i=0;i<rows.length;i++){
    (function(tr){
      var btn=primaryRun(tr);
      if(!btn) return;
      finishPrimary(btn, btn.getAttribute('data-state')||'unknown');
      btn.addEventListener('click',function(){
        var path=tr.getAttribute('data-path');
        var name=tr.getAttribute('data-name');
        var meta=findPayload(path);
        var state=btn.getAttribute('data-state')||'';
        var fileUrl=(meta&&meta.url)?meta.url:path;
        if(state==='unknown' || state==='busy') return;
        btn.disabled=true;
        startBar(btn);

function cmpSemver(a,b){

    if(!m) return [0,0,0];

  }
  var A=parts(a), B=parts(b), i;
  for(i=0;i<3;i++){ if(A[i]>B[i]) return 1; if(A[i]<B[i]) return -1; }

function checkSelfUpdate(){

    var dismissed='';

    if(!best || cmpSemver(best.version, APP_VERSION)<=0){ hideSelfUpdateBanner(); return; }
    try{ dismissed=localStorage.getItem(SELFUPD_DISMISS_KEY)||''; }catch(e){}

    showSelfUpdateBanner(best);

    list=(j && j.payloads) ? j.payloads : (Array.isArray(j)?j:[]);
    ent=pickLauncherCatalogEntry(list);
    ver=String((ent && ent.version) || (j && (j.app_version||j.launcher_version)) || '').replace(/^\s+|\s+$/g,'');
    sum=String((ent && (ent.checksum||ent.sha256)) || '').toLowerCase();
    if(ver && cmpSemver(ver, APP_VERSION)>0){
      best=betterSelfInfo(best, {
        version:ver,
        url:SELFUPD_REPO_ELF,
        checksum:sum,
        size:(ent && ent.size)|0,
        path:'mirror/elf-launcher.elf',
        name:'elf-launcher.elf',

  }
  function takeGh(text){

    if(!j || j.draft){ doneOne(); return; }
    tag=String(j.tag_name||j.name||'').replace(/^[vV]/,'').replace(/^\s+|\s+$/g,'');

    for(i=0;i<assets.length;i++){

        url=a.browser_download_url||'';
        size=a.size|0;
        name=a.name||name;
        break;
      }
    }
    if(!url) url=SELFUPD_REPO_ELF;
    if(tag && cmpSemver(tag, APP_VERSION)>0){
      best=betterSelfInfo(best, {
        version:tag,
        url:url||SELFUPD_REPO_ELF,

        size:size,
        path:'mirror/'+name,
        name:name,

      });
    }

  }
  fetchCatalogText('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/payloads.json')
    .then(takeCatalog).catch(doneOne);

      writeCatalogCache(PAYLOADS);
      rerenderCatalogViews();
      setStatus(t('catalogN',{n:PAYLOADS.length,live:live}));
      checkDownloadedUpdates(PAYLOADS);
    }
    apply();
  });
}
(function bootCatalog(){
  var cached=readCatalogCache();
  if(cached){
    PAYLOADS=cached;
    bootAfterCatalog();
    setTimeout(function(){ backgroundCatalogRefresh(2); }, 400);
    return;
  }
  refreshCatalog(function(ok){
    if(ok && PAYLOADS && PAYLOADS.length) writeCatalogCache(PAYLOADS);
    bootAfterCatalog();
    if(ok) setTimeout(function(){ checkDownloadedUpdates(PAYLOADS); }, 1500);
    else setTimeout(function(){ backgroundCatalogRefresh(2); }, 8000);
  });
})();
})();
</script>
