  <g stroke="url(#g)" stroke-width="14" stroke-linecap="round">
    <path d="M196 92v34M256 92v34M316 92v34M196 326v34M256 326v34M316 326v34M106 166h34M106 226h34M106 286h34M372 166h34M372 226h34M372 286h34"/>
  </g>
