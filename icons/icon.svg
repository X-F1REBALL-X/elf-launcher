  <!-- play / launch mark -->
  <path d="M228 178 L304 226 L228 274 Z" fill="url(#g)" stroke="url(#g)" stroke-width="14" stroke-linejoin="round"/>
  <text x="256" y="440" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="6" fill="#eef0ff">ELF</text>
  <text x="256" y="478" text-anchor="middle" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="9" fill="url(#g)">LAUNCHER</text>
