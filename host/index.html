<title>ps5-elfs host</title>
<style>
html,body{margin:0;padding:0;background:#000;color:#2a9fff;font:22px/1.4 "Segoe UI",system-ui,sans-serif}
#wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
h1{margin:0 0 8px;font-size:34px;letter-spacing:.2em;text-transform:uppercase;color:#2a9fff;text-shadow:0 0 18px rgba(42,159,255,.45)}
#sub{margin:0 0 18px;color:#fff;font-size:22px;font-weight:600}
#status{min-height:1.4em;margin:0 0 8px;color:#5eb6ff;font-size:24px;font-weight:700}
#progwrap{display:none;margin:0 0 18px;background:rgba(0,30,55,.85);border:1px solid rgba(42,159,255,.35);border-radius:10px;height:18px;overflow:hidden}
#progwrap.show{display:block}
#progbar{height:100%;width:0%;background:linear-gradient(90deg,#1a6fb5,#2a9fff);box-shadow:0 0 12px rgba(42,159,255,.55);transition:width .2s linear}
#progbar.indeterminate{width:40% !important;animation:indeterminate 1.1s ease-in-out infinite}
@keyframes indeterminate{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
#hdr{display:none;align-items:center;gap:14px;margin:0 0 16px}
#hdr.show{display:flex}
#back{background:#1a6fb5;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:22px;font-weight:700;cursor:pointer;min-width:72px}
#back:active{background:#2a9fff;color:#001}
#ftitle{margin:0;color:#9ad2ff;font-size:28px;font-weight:700}
#folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.folder{display:block;background:rgba(0,30,55,.75);border:2px solid rgba(42,159,255,.4);border-radius:16px;padding:22px 18px;text-align:left;cursor:pointer;color:#2a9fff;min-height:96px;box-shadow:0 0 18px rgba(42,159,255,.12)}
.folder:active,.folder:focus{background:rgba(26,111,181,.55);border-color:#2a9fff;outline:0}
.folder .fname{display:block;color:#fff;font-size:24px;font-weight:700;margin-bottom:8px}
.folder .fcount{display:block;color:#5eb6ff;font-size:18px}
#view{display:none}
#view.show{display:block}
#home.show{display:block}
#home{display:block}
table{width:100%;border-collapse:collapse;background:rgba(0,20,40,.55);margin-bottom:8px}
th,td{padding:12px 12px;border-bottom:1px solid rgba(42,159,255,.25);text-align:left;vertical-align:middle}
th{color:#9ad2ff;font-size:18px}
td.n{color:#fff;font-weight:600;font-size:18px}
td.v{color:#5eb6ff;white-space:nowrap}
td.d{color:#cfe9ff;font-size:16px}
button.run{background:#1a6fb5;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:18px;font-weight:700;cursor:pointer}
button.run:active{background:#2a9fff;color:#001}
button.run[disabled]{opacity:.5}
#openhost{display:inline-block;background:#1a6fb5;color:#fff;text-decoration:none;border-radius:12px;padding:14px 22px;font-size:22px;font-weight:700}
.empty{color:#9ad2ff;padding:20px 0}
</style></head><body>

var statusEl=document.getElementById('status');
var homeEl=document.getElementById('home');
var viewEl=document.getElementById('view');
var hdrEl=document.getElementById('hdr');
var titleEl=document.getElementById('ftitle');
var backBtn=document.getElementById('back');
var progWrap=document.getElementById('progwrap');
var progBar=document.getElementById('progbar');
var currentFolder=null;
var pollTimer=null;

function setStatus(t){statusEl.textContent=t;}

function showProgress(on){
  if(on){
    progWrap.className='show';
    progWrap.setAttribute('aria-hidden','false');
  }else{
    progWrap.className='';
    progWrap.setAttribute('aria-hidden','true');
    progBar.className='';
    progBar.style.width='0%';
  }
}

function setProgressPct(pct){
  progBar.className='';
  if(pct<0){
    progBar.className='indeterminate';
    progBar.style.width='40%';
  }else{
    if(pct>100)pct=100;
    if(pct<0)pct=0;
    progBar.style.width=pct+'%';
  }
}

function stopPoll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

var apiBase='';
function startPoll(){
  stopPoll();
  pollTimer=setInterval(function(){
    fetch(apiBase+'/progress').then(function(r){return r.json();}).then(function(j){
      if(!j)return;
      if(j.phase==='idle'){
        if(typeof j.pct==='number' && j.pct>=100)setProgressPct(100);
        return;
      }
      if(typeof j.pct==='number')setProgressPct(j.pct);
    }).catch(function(){});
  },250);
}

function countIn(folder){
  var n=0,i;
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].folder===folder)n++;}
  return n;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getHashFolder(){
  var h=location.hash||'';
  var m=h.match(/folder=([a-z0-9\-]+)/i);
  return m?m[1]:null;
}

function setHashFolder(id){
  if(id){location.hash='folder='+id;}
  else if(location.hash){location.hash='';}
}

function showHome(){
  currentFolder=null;
  hdrEl.className='';
  viewEl.className='';
  viewEl.innerHTML='';
  homeEl.className='show';
  var html='<div id="folders">';
  var i,f,n;
  for(i=0;i<FOLDERS.length;i++){
    f=FOLDERS[i];
    n=countIn(f.id);
    html+='<button type="button" class="folder" data-folder="'+esc(f.id)+'">';
    html+='<span class="fname">'+esc(f.label)+'</span>';
    html+='<span class="fcount">'+n+' item'+(n===1?'':'s')+'</span>';
    html+='</button>';
  }
  html+='</div>';
  homeEl.innerHTML=html;
  var cards=homeEl.querySelectorAll('.folder');
  for(i=0;i<cards.length;i++){
    cards[i].addEventListener('click',function(ev){
      var id=ev.currentTarget.getAttribute('data-folder');
      setHashFolder(id);
      showFolder(id);
    });
  }
}

function findPayload(path){
  var i;
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].path===path)return PAYLOADS[i];}
  return null;
}

function showFolder(id){
  var label=id,i,f,list=[],p,html;
  for(i=0;i<FOLDERS.length;i++){if(FOLDERS[i].id===id){label=FOLDERS[i].label;break;}}
  currentFolder=id;
  homeEl.className='';
  homeEl.innerHTML='';
  hdrEl.className='show';
  titleEl.textContent=label;
  viewEl.className='show';
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].folder===id)list.push(PAYLOADS[i]);}
  if(!list.length){
    viewEl.innerHTML='<p class="empty">No payloads in this folder.</p>';
    return;
  }
  html='<table><thead><tr><th>Payload</th><th>Version</th><th>Info</th><th></th></tr></thead><tbody>';
  for(i=0;i<list.length;i++){
    p=list[i];
    html+='<tr data-path="'+esc(p.path)+'" data-name="'+esc(p.name)+'">';
    html+='<td class="n">'+esc(p.name)+'</td>';
    html+='<td class="v">'+esc(p.version)+'</td>';
    html+='<td class="d">'+esc(p.info)+'</td>';
    html+='<td class="a"><button type="button" class="run">Send</button></td>';
    html+='</tr>';
  }
  html+='</tbody></table>';
  viewEl.innerHTML=html;
  var rows=viewEl.querySelectorAll('tr[data-path]');
  for(i=0;i<rows.length;i++){
    (function(tr){
      var btn=tr.querySelector('button.run');
      btn.addEventListener('click',function(){
        var path=tr.getAttribute('data-path');
        var name=tr.getAttribute('data-name');
        var meta=findPayload(path);
        var onConsole=(location.hostname==='127.0.0.1'||location.hostname==='localhost');
        btn.disabled=true;
        if(!onConsole){
          var fileUrl=(meta&&meta.url)?meta.url:path;
          var onPs5=/PlayStation/i.test(navigator.userAgent);
          showProgress(true);
          setProgressPct(-1);
          if(onPs5){
            setStatus('Sending '+name+' to the launcher...');
            askLauncher(fileUrl);
            setProgressPct(100);
            showProgress(false);
            setStatus('Sent '+name+' to the launcher.');
            btn.disabled=false;
            return;
          }
          setStatus('Downloading '+name+'...');
          fetch(fileUrl).then(function(r){
            if(!r.ok)throw new Error('HTTP '+r.status);
            return r.blob();
          }).then(function(blob){
            var u=URL.createObjectURL(blob);
            var a=document.createElement('a');
            a.href=u;
            a.download=name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function(){URL.revokeObjectURL(u);},1500);
            setProgressPct(100);
            showProgress(false);
            setStatus('Downloaded '+name+'. Upload it by FTP to /data');
          }).catch(function(e){
            showProgress(false);
            setStatus('Download failed: '+e);
          }).then(function(){btn.disabled=false;});
          return;
        }
        apiBase='';
        showProgress(true);
        setProgressPct(-1);
        setStatus('Preparing '+name+'...');
        startPoll();
        fetch(apiBase+'/ensure?path='+encodeURIComponent(path),{method:'POST'})
          .then(function(r){return r.text().then(function(t){return {ok:r.ok,t:t,status:r.status};});})
          .then(function(ens){
            if(!ens.ok){
              stopPoll();
              showProgress(false);
              setStatus(ens.t||'Ensure failed');
              btn.disabled=false;
              return null;
            }
            var source='cache';
            try{
              var j=JSON.parse(ens.t);
              if(j && j.source)source=j.source;
            }catch(e){}
            if(source==='download'){
              setStatus('Downloaded '+name+' - sending...');
              setProgressPct(100);
            }else{
              setStatus('Cached '+name+' - sending...');
              setProgressPct(100);
            }
            return fetch(apiBase+'/run?path='+encodeURIComponent(path),{method:'POST'})
              .then(function(r){return r.text().then(function(t){return {ok:r.ok,t:t,source:source};});});
          })
          .then(function(res){
            if(!res)return;
            stopPoll();
            showProgress(false);
            if(res.ok){
              if(res.source==='download')setStatus('Downloaded and sent '+name);
              else setStatus('Sent '+name);
            }else{
              setStatus(res.t||'Failed');
            }
          })
          .catch(function(e){
            stopPoll();
            showProgress(false);
            if(apiBase)setStatus('Launcher is off. Send ps5-elfs-host.elf to elfldr on port 9021.');
            else setStatus('Error: '+e);
          })
          .then(function(){btn.disabled=false;});
      });
    })(rows[i]);
  }
}

backBtn.addEventListener('click',function(){
  setHashFolder(null);
  showHome();
});

window.addEventListener('hashchange',function(){
  var id=getHashFolder();
  if(id)showFolder(id); else showHome();
});

function askLauncher(fileUrl){
  var img=new Image();
  img.src='http://127.0.0.1:9021/?uri='+encodeURIComponent(fileUrl);
}
if(/PlayStation/i.test(navigator.userAgent)){
  setStatus('Loading elfldr...');
  askLauncher('https://raw.githubusercontent.com/X-F1REBALL-X/ps5-elfs/main/loader/elfldr-ps5.elf');
}
var start=getHashFolder();
if(start)showFolder(start); else showHome();
})();
</script>
</body></html>
