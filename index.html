<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ELF Launcher 1.1.4</title>
<link rel="icon" type="image/jpeg" href="icons/launcher-home.jpg?v=8">
<link rel="apple-touch-icon" href="icons/launcher-home.jpg?v=8">
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#1b2233;--void:#161c2a;--deck:#252e44;--card:#2f3953;--card2:#39445f;--edge:#45516f;--edge2:#56638a;
--ink:#f4f6fc;--ink2:#d7ddeb;--mute:#aab3c9;
--pri:#7c8cff;--pri2:#a78bfa;--rose:#f472b6;--mint:#34d399;--amber:#fbbf24;--sky:#60a5fa;--teal:#2dd4bf;--bad:#fb5a7a;
--lime:var(--pri);--ember:var(--rose);--cyan:var(--sky);--violet:var(--pri2);--blue:var(--sky);--warn:var(--amber);
--r:16px;--r2:11px;--ring:0 0 0 3px var(--bg),0 0 0 6px var(--pri);
--s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--gap:var(--s4)}
*{box-sizing:border-box}
html{background:var(--bg);font-size:15px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:1rem/1.4 "Inter","Segoe UI","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
background:radial-gradient(70vw 60vh at 85% -10%,rgba(124,140,255,.16),transparent 60%),radial-gradient(60vw 50vh at -10% 110%,rgba(244,114,182,.10),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{display:flex;flex-direction:column;min-height:100vh;padding:var(--s4) var(--s5) var(--s5)}
a{color:inherit}
/* header */
.bar{display:flex;align-items:center;flex-wrap:nowrap;margin-bottom:var(--gap);padding:var(--s2) var(--s3);background:rgba(37,46,68,.92);border:1px solid var(--edge);border-radius:calc(var(--r) + 4px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;flex:0 0 auto;min-width:0}
.brand>div{direction:ltr;text-align:left}
.logo{flex:0 0 auto;width:2.9rem;height:2.9rem;margin-inline-end:var(--s3);display:flex;align-items:center;justify-content:center;color:#fff;border-radius:14px;overflow:hidden;background:#252e44;box-shadow:0 6px 18px rgba(124,140,255,.35)}
.logo svg{width:1.65rem;height:1.65rem}
.logo img{display:block;width:100%;height:100%;border-radius:inherit;object-fit:cover}
.logo svg circle{fill:#0b0d14}
.brand h1{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:.01em;line-height:1.05;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.brand h1 b{background:linear-gradient(90deg,var(--pri),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{display:flex;align-items:center;margin-top:.25rem}
.ver{font-size:.72rem;font-weight:800;padding:.05rem .5rem;margin-inline-end:.6rem;border-radius:999px;color:var(--ink2);background:var(--card2);border:1px solid var(--edge2);direction:ltr;unicode-bidi:isolate}
.by{font-size:.92rem;font-weight:800;color:var(--ink);text-decoration:none;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.by:after{content:"";display:inline-block;width:.45rem;height:.45rem;margin-inline-start:.4rem;border-radius:50%;background:var(--rose);vertical-align:.12em}
.search{position:relative;flex:1 1 auto;min-width:8rem;max-width:34rem;margin:0 var(--s4)}
.search svg{position:absolute;top:50%;left:.9rem;width:1.15rem;height:1.15rem;margin-top:-.575rem;color:var(--mute);pointer-events:none}
#q{width:100%;min-height:2.8rem;padding:.4rem 1rem;padding-inline-start:2.6rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--edge2);border-radius:999px;outline:none;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--mute)}
#q:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,140,255,.35)}
#q::-webkit-search-cancel-button{-webkit-appearance:none}
.live{display:flex;align-items:center;min-width:0;max-width:22rem;flex:0 1 auto;padding:.35rem .9rem;border-radius:999px;background:var(--card);border:1px solid var(--edge);font-size:.86rem;font-weight:700;color:var(--ink2);white-space:nowrap}
.live i{flex:0 0 auto;width:.55rem;height:.55rem;margin-inline-end:.55rem;border-radius:50%;background:var(--mint);box-shadow:0 0 .6rem var(--mint)}
#status{display:block;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis}
#runchip{display:flex;align-items:center;flex:0 0 auto;margin-inline-start:var(--s3);min-height:2.6rem;padding:.2rem .9rem;font-size:.9rem}
#runchip i{display:inline-block;width:.55rem;height:.55rem;margin-inline-end:.5rem;border-radius:50%;background:var(--mute)}
#runchip[data-n]:not([data-n="0"]) i{background:var(--mint);box-shadow:0 0 .55rem var(--mint)}
#runchip .ncount{margin-inline-start:.5rem}
.sys{display:flex;align-items:center;flex:0 0 auto}
.sys>*{margin-inline-start:var(--s4)}
#corner{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;text-align:end}
#deviceinfo{font-size:.92rem;font-weight:800;color:var(--ink);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
#deviceinfo.ps5mark{color:var(--pri)}
#deviceip{font-size:.74rem;font-weight:600;color:var(--mute);white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
#deviceip[data-state=ip]{color:var(--ink2)}
#clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
#clock b{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
#clock span{font-size:.74rem;font-weight:600;color:var(--mute);white-space:nowrap}
[dir=rtl] #corner,[dir=rtl] #clock{align-items:flex-start}
/* buttons: plate in ::before (keeps the busy-progress fill) */
button{position:relative;z-index:0;min-height:2.6rem;padding:.3rem 1.05rem;font:inherit;font-size:.95rem;font-weight:700;color:var(--ink);background:none;border:0;border-radius:var(--r2);cursor:pointer;white-space:nowrap;outline:none;-webkit-tap-highlight-color:transparent}
button:before{content:"";position:absolute;z-index:-1;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:var(--card2);border:1px solid var(--edge2);transition:background-color .12s,border-color .12s,box-shadow .12s}
button:focus{z-index:2}
button:focus:before,button:focus-visible:before{box-shadow:var(--ring)}
button:active:before{filter:brightness(1.15)}
button[disabled]{cursor:default;opacity:.45}
.ncount{flex:0 0 auto;display:inline-block;min-width:1.7rem;padding:0 .45em;font-size:.76rem;font-weight:800;line-height:1.55;text-align:center;color:var(--ink2);background:rgba(255,255,255,.06);border-radius:999px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.ncount:empty{display:none}
/* language */
#langbox{position:relative;z-index:40}
#langbtn{display:flex;align-items:center;min-height:2.6rem;font-size:.85rem}
#langbtn .flag{margin-inline-end:.55rem}
#langlist{display:none;position:absolute;right:0;top:calc(100% + .5rem);z-index:60;width:28rem;max-width:calc(100vw - 2rem);padding:.6rem;grid-template-columns:1fr 1fr;grid-gap:.35rem;background:var(--deck);border:1px solid var(--edge2);border-radius:var(--r);box-shadow:0 1.2rem 2.5rem rgba(0,0,0,.7)}
[dir=rtl] #langlist{right:auto;left:0}
#langlist.show{display:grid}
.langopt{display:flex;align-items:center;width:100%;min-height:2.6rem;font-size:.95rem;font-weight:600;text-align:start}
.langopt:before{background:transparent;border-color:transparent}
.langopt .flag{margin-inline-end:.6rem}
.langopt[data-state=on]{color:#0b0d14}.langopt[data-state=on]:before{background:var(--pri);border-color:var(--pri)}
.flag{display:inline-block;width:1.5rem;height:1rem;flex:0 0 1.5rem;overflow:hidden;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.flag svg{display:block;width:100%;height:100%}
/* layout */
#shell{flex:1;display:grid;grid-template-columns:15.5rem minmax(0,1fr);grid-gap:var(--gap);align-items:start}
.panel{position:relative;display:flex;flex-direction:column;min-width:0;padding:var(--s4) var(--s5) var(--s5);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 7rem),var(--deck);border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.label,#ftitle{display:flex;align-items:center;margin:0 0 var(--s3);font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);line-height:1.2}
.label:before,#ftitle:before{content:"";flex:0 0 auto;width:.6rem;height:.6rem;margin-inline-end:.55rem;border-radius:3px;background:var(--acc,var(--pri))}
#ftitle{font-size:1.25rem;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:800}
#ftitle:before{width:.75rem;height:.75rem;border-radius:4px}
[dir=rtl] .label,html[lang=ja] .label,html[lang=zh] .label{letter-spacing:0}
.sub{margin:var(--s4) 0 var(--s2);font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.k{color:var(--mute)}
/* sidebar */
#sidebar{position:sticky;top:var(--s4);padding:var(--s3)}
#sidebar>.label{display:none}
#nav{display:grid;grid-template-columns:minmax(0,1fr);grid-gap:.3rem}
.navgrp{margin:var(--s3) .55rem .2rem;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.navgrp:first-child{margin-top:.2rem}
[dir=rtl] .navgrp{letter-spacing:0}
.navbtn{display:flex;align-items:center;width:100%;min-height:2.75rem;padding:.2rem .7rem;text-align:start;font-size:.98rem;font-weight:600;color:var(--ink2)}
.navbtn:before{background:transparent;border-color:transparent}
.navbtn svg{flex:0 0 auto;width:1.2rem;height:1.2rem;margin-inline-end:.7rem;color:var(--c,var(--pri))}
.navbtn>span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.navbtn.active{color:var(--ink)}
.navbtn.active:before{background:linear-gradient(90deg,rgba(124,140,255,.24),rgba(124,140,255,.06));border-color:rgba(124,140,255,.45)}
[dir=rtl] .navbtn.active:before{background:linear-gradient(270deg,rgba(124,140,255,.24),rgba(124,140,255,.06))}
.navbtn.active .ncount{background:var(--pri);color:#0b0d14}
.navbtn[data-folder=mine]{--c:var(--rose)}.navbtn[data-folder=elf]{--c:var(--sky)}.navbtn[data-folder=downloaded]{--c:var(--mint)}.navbtn[data-folder=auto]{--c:var(--pri2)}
.navbtn[data-folder=run]{--c:var(--mint)}.navbtn[data-folder=load]{--c:var(--amber)}.navbtn[data-folder=ps5]{--c:var(--teal)}
#sideActions{display:grid;grid-gap:var(--s2);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--edge)}
#sideActions:empty{display:none}
#loadsel{width:100%;color:#0b0d14}#loadsel:before{background:var(--rose);border-color:var(--rose)}
#sideupd{display:flex;align-items:center;justify-content:center;width:100%;margin-top:var(--s3)}
#sideupd .ncount{margin-inline-start:.6rem}
#sideupd[data-state=has]{color:#0b0d14}#sideupd[data-state=has]:before{background:var(--amber);border-color:var(--amber)}
#sideupd[data-state=has] .ncount{background:#0b0d14;color:var(--amber)}
#sideupd[data-state=busy]{color:var(--mute)}
#sideupd[disabled]{opacity:.6}
.menufoot{margin-top:var(--s3);padding:var(--s3) .55rem 0;border-top:1px solid var(--edge);font-size:.74rem;line-height:1.4;color:var(--mute)}
.menufoot b{display:block;color:var(--ink2);font-weight:700;direction:ltr;unicode-bidi:isolate}
[dir=rtl] .menufoot b{text-align:right}
/* main */
#main{min-width:0;display:flex;flex-direction:column}
#home{display:none}#home.show{display:grid}
#home.show~#viewpanel{display:none}
#hdr{display:none}#hdr.show{display:flex;align-items:center;margin-bottom:var(--s3)}
#hdr #ftitle{flex:1;margin:0}
#hdrx{display:flex;align-items:center}#hdrx>*{margin-inline-start:var(--s2)}
#view{display:none}#view.show{display:block}
#viewpanel{--acc:var(--sky)}
#main[data-view=mine] #viewpanel{--acc:var(--rose)}#main[data-view=downloaded] #viewpanel{--acc:var(--mint)}#main[data-view=auto] #viewpanel{--acc:var(--pri2)}
#main[data-view=run] #viewpanel,#main[data-view=kill] #viewpanel{--acc:var(--mint)}#main[data-view=load] #viewpanel{--acc:var(--amber)}#main[data-view=ps5] #viewpanel{--acc:var(--teal)}
#progwrap{display:none;position:relative;height:.4rem;margin:0 0 var(--s3);overflow:hidden;background:var(--bg);border-radius:999px}
#progwrap.show{display:block}
#progbar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pri),var(--rose));transition:width .2s linear}
#progbar.indeterminate{width:40%!important;animation:indeterminate 1.1s ease-in-out infinite}
@keyframes indeterminate{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
/* category chips */
.foldgrid,.catchips{display:flex;flex-wrap:wrap;margin:0 0 var(--s4)}
.foldgrid button,.catchips button{display:flex;align-items:center;min-height:2.4rem;padding:.15rem .5rem .15rem .85rem;margin:0 .45rem .45rem 0;font-size:.9rem;font-weight:700;border-radius:999px}
[dir=rtl] .foldgrid button,[dir=rtl] .catchips button{margin:0 0 .45rem .45rem;padding:.15rem .85rem .15rem .5rem}
.foldgrid button:before,.catchips button:before{background:var(--card);border-color:var(--edge2)}
.foldgrid button>span:first-child:before,.catchips button>span:first-child:before{content:"";display:inline-block;width:.6rem;height:.6rem;margin-inline-end:.5rem;border-radius:50%;vertical-align:.05em;background:var(--c,var(--sky))}
.foldgrid button .ncount,.catchips button .ncount{margin-inline-start:.5rem}
.foldgrid button.active{color:#0b0d14}.foldgrid button.active:before{background:var(--c,var(--sky));border-color:var(--c,var(--sky))}
.foldgrid button.active>span:first-child:before{background:#0b0d14}
.foldgrid button.active .ncount{background:rgba(11,13,20,.25);color:#0b0d14}
.subfold[data-sub=loader]{--c:var(--pri)}.subfold[data-sub=hen]{--c:var(--rose)}.subfold[data-sub=mods]{--c:var(--mint)}.subfold[data-sub=files]{--c:var(--amber)}.subfold[data-sub=net]{--c:#fb923c}
.subfold[data-sub=storage]{--c:var(--pri2)}.subfold[data-sub=media]{--c:var(--sky)}.subfold[data-sub=system]{--c:#94a3b8}.subfold[data-sub=tools]{--c:var(--teal)}
/* payload rows */
.listgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:.55rem var(--s3);align-items:stretch}
.elfwrap{min-width:0}
.elf{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"m n v a" "m d d a";grid-template-rows:1fr auto;align-items:center;grid-column-gap:var(--s3);grid-row-gap:.1rem;height:100%;min-height:3.5rem;padding:.45rem .55rem .45rem .75rem;background:var(--card);border:1px solid var(--edge);border-radius:var(--r2);transition:border-color .12s,background-color .12s}
[dir=rtl] .elf{padding:.45rem .75rem .45rem .55rem}
.elf.nom{grid-template-areas:"i n v a" "i d d a"}
.elf.nom:before{content:"ELF";grid-area:i;display:flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;font-size:.62rem;font-weight:800;letter-spacing:.06em;color:var(--pri);background:rgba(124,140,255,.12);border-radius:9px}
.elf:focus-within{border-color:var(--pri);background:var(--card2)}
.elf .m{grid-area:m}.elf .n{grid-area:n}.elf .v{grid-area:v}.elf .a{grid-area:a}.elf .d{grid-area:d}
.elf .n{min-width:0;font-size:1.02rem;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
[dir=rtl] .elf .n,[dir=rtl] .elf .d{direction:ltr;text-align:right}
.elf .n b{font-weight:700}
.elf .v{justify-self:end;max-width:7.5rem;padding:0 .5em;font-size:.72rem;font-weight:700;line-height:1.6;color:var(--ink2);background:rgba(255,255,255,.06);border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.elf .v:empty{display:none}
.elf .d{min-width:0;font-size:.78rem;line-height:1.3;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elf .a{display:flex;align-items:center;justify-content:flex-end}
.elf .a>*{margin-inline-start:var(--s1)}
.elfhead{display:none}
.empty{margin:var(--s2) 0;padding:var(--s4);font-size:.95rem;color:var(--ink2);text-align:center;background:rgba(255,255,255,.02);border:1px dashed var(--edge2);border-radius:var(--r2)}
/* row buttons */
button.run{min-width:6.2rem;min-height:2.3rem;padding:.15rem .9rem;font-size:.88rem}
button.run.download{color:var(--pri)}button.run.download:before{background:rgba(124,140,255,.1);border-color:rgba(124,140,255,.55)}
button.run.load{color:#0b0d14}button.run.load:before{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent}
button.run.load.loaded{color:#0b0d14}button.run.load.loaded:before{background:var(--mint)}
button.run.sent{color:var(--mint)}button.run.sent:before{background:rgba(52,211,153,.12);border-color:var(--mint)}
button.run.update{color:#0b0d14}button.run.update:before{background:var(--amber);border-color:var(--amber)}
button.run.del,button.run.kill{min-width:0;color:var(--bad)}button.run.del:before,button.run.kill:before{background:rgba(251,90,122,.08);border-color:rgba(251,90,122,.55)}
button.run.busy{color:var(--ink)}
button.run.busy:before{background-color:var(--card2);background-image:linear-gradient(rgba(124,140,255,.6),rgba(124,140,255,.6));background-repeat:no-repeat;background-position:left center;background-size:inherit;border-color:var(--pri)}
button.run[disabled]{opacity:.5}button.run.busy[disabled]{opacity:1}
button.ghost:before{background:transparent}
button.pri{color:#0b0d14}button.pri:before{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent}
.pick{display:flex;align-items:center;font-size:.85rem;font-weight:700;color:var(--ink2);cursor:pointer}
.pick span{margin-inline-start:.45rem}
input.mark,input.auto{width:1.35rem;height:1.35rem;margin:0;accent-color:var(--pri);cursor:pointer}
/* home */
#home{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"mine run" "quick run" "cats set";grid-gap:var(--gap);align-items:start}
.hMine{grid-area:mine;--acc:var(--rose);background:linear-gradient(135deg,rgba(244,114,182,.12),rgba(124,140,255,.08) 60%,transparent),var(--deck)}
.hQuick{grid-area:quick;--acc:var(--pri)}.hRun{grid-area:run;--acc:var(--mint)}.hCats{grid-area:cats;--acc:var(--sky)}.hSet{grid-area:set;--acc:var(--pri2)}
.mineHead{display:flex;align-items:center;margin-bottom:var(--s3)}
.mineHead img{flex:0 0 auto;width:3.4rem;height:3.4rem;margin-inline-end:var(--s3);border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.mineHead b{display:block;font-size:1.35rem;font-weight:800;direction:ltr;unicode-bidi:isolate}
[dir=rtl] .mineHead b{text-align:right}
.mineHead span{display:block;margin-top:.15rem;font-size:.88rem;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:.55rem}
.cards .elf{min-height:3.3rem}
.cards button.run.del{display:none}
.cards button.run{min-width:5.4rem;padding:.15rem .75rem}
.hRun .proc{display:flex;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--edge);font-size:.92rem}
.hRun .proc:last-of-type{border:0}
.proc .pn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
[dir=rtl] .proc .pn{text-align:right}
.proc .pp{margin:0 var(--s3);font-size:.76rem;color:var(--mute);font-variant-numeric:tabular-nums;direction:ltr}
.hRun .more{margin-top:var(--s3);width:100%}
.catchips{margin:0}
.homeChoices{display:grid;grid-template-columns:1fr 1fr;grid-gap:var(--s2)}
.homeChoices button{min-height:2.7rem;font-size:.92rem;overflow:hidden;text-overflow:ellipsis}
.homeChoices button.selected{color:#0b0d14}.homeChoices button.selected:before{background:var(--pri2);border-color:var(--pri2)}
.homeOpt .sub:first-child{margin-top:0}
.homeHint{margin:var(--s3) 0 0;font-size:.82rem;line-height:1.45;color:var(--mute)}
.tag{display:inline-block;padding:0 .5em;margin-inline-start:.4rem;font-size:.68rem;font-weight:800;line-height:1.6;border-radius:999px;vertical-align:.1em}
.tag.self{color:#0b0d14;background:var(--pri)}.tag.prot{color:var(--ink2);background:rgba(255,255,255,.08)}
/* running view */
.runbar{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:var(--s3)}
.runbar>*{margin-inline-end:var(--s2)}
.runbar .pick{margin-inline-start:auto}
.proclist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:.55rem var(--s3)}
.proclist .elf.nom:before{content:"PID";color:var(--mint);background:rgba(52,211,153,.12)}
/* file browser: places | contents */
#fb{display:grid;grid-template-columns:14rem minmax(0,1fr);grid-gap:var(--gap);align-items:start}
.places{display:grid;grid-gap:.35rem}
.places button{display:flex;align-items:center;justify-content:flex-start;width:100%;min-height:2.75rem;text-align:start;font-weight:600}
.places button svg{width:1.15rem;height:1.15rem;margin-inline-end:.6rem;color:var(--teal);flex:0 0 auto}
.places button.selected{color:#0b0d14}.places button.selected:before{background:var(--teal);border-color:var(--teal)}
.places button.selected svg{color:#0b0d14}
.places button.off{opacity:.45}
.places small{display:block;margin:.6rem .4rem 0;font-size:.76rem;line-height:1.4;color:var(--mute)}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:var(--s3);direction:ltr}
.crumbs button{min-height:2.3rem;padding:.1rem .7rem;font-size:.88rem;margin:0 .15rem .3rem 0}
.crumbs button:before{background:transparent;border-color:transparent}
.crumbs button:last-child{color:var(--teal)}
.crumbs i{color:var(--mute);font-style:normal;margin:0 .1rem .3rem}
.fbtop{display:flex;align-items:center;margin-bottom:var(--s2)}
.fbtop>button{margin-inline-end:var(--s2)}
.fbtop .mlin{flex:1;margin:0}
.plist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:.5rem var(--s3)}
.plist .empty{grid-column:1/-1;margin:0}
.plist .elf.dir:before{content:"DIR";color:var(--teal);background:rgba(45,212,191,.12)}
.plist .elf.bad:before{content:"?";color:var(--bad);background:rgba(251,90,122,.12)}
/* load file */
#ml{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-gap:var(--gap);align-items:start}
#ml .panel{--acc:var(--amber)}#ml .mlLog{--acc:var(--pri2)}
.mlhide{display:none!important}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--s5);min-height:9rem;border:2px dashed var(--edge2);border-radius:var(--r);background:rgba(255,255,255,.02);text-align:center}
.drop b{font-size:1.05rem}.drop span{margin-top:.35rem;font-size:.82rem;color:var(--mute);direction:ltr;unicode-bidi:isolate}
.drop button{margin-top:var(--s3);padding:.2rem 1.6rem;color:#0b0d14}.drop button:before{background:linear-gradient(135deg,var(--pri),var(--pri2));border-color:transparent}
.fcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-gap:.15rem var(--s3);align-items:center;padding:var(--s2) var(--s3);background:var(--card);border:1px solid var(--edge2);border-radius:var(--r2)}
.fcard i{grid-row:1/3;display:flex;align-items:center;justify-content:center;width:2.6rem;height:2.6rem;font-style:normal;font-size:.66rem;font-weight:800;color:#0b0d14;background:var(--pri);border-radius:9px}
.fcard b{grid-column:2;grid-row:1;min-width:0;font-size:1.02rem;direction:ltr;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[dir=rtl] .fcard b,[dir=rtl] .fcard small{text-align:right}
.fcard small{grid-column:2;grid-row:2;min-width:0;color:var(--mute);font-size:.78rem;direction:ltr;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard em{grid-column:3;grid-row:1/3;white-space:nowrap;font-style:normal;font-size:.72rem;font-weight:800;color:var(--mint);background:rgba(52,211,153,.12);border-radius:999px;padding:.1rem .55rem;direction:ltr}
.fcard.bad i{background:var(--bad);color:#fff}.fcard.bad em{color:var(--bad);background:rgba(251,90,122,.12)}
.mlopts{display:flex;flex-wrap:wrap;margin:var(--s3) 0 0}.mlopts .pick{margin-inline-end:var(--s4);margin-bottom:var(--s2);min-height:2.2rem}
.pick input[disabled]+span{opacity:.45}
.mlf{display:block;margin-top:var(--s3);font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
[dir=rtl] .mlf{letter-spacing:0}
.mlin{width:100%;min-height:2.6rem;margin-top:.35rem;padding:.5rem .8rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--edge2);border-radius:var(--r2);direction:ltr;outline:none;-webkit-appearance:none}
[dir=rtl] .mlin{text-align:right}
.mlin:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,140,255,.3)}
.mlgo{display:flex;align-items:center;margin-top:var(--s2)}.mlgo button.run{min-height:2.8rem;font-size:1rem}.mlgo #mlsend{flex:1}
.mlgo>*+*{margin-inline-start:var(--s2)}
.mlnote{margin:var(--s3) 0 0;font-size:.84rem;line-height:1.45;color:var(--mute)}
.mlnote:empty{display:none}.mlnote.good{color:var(--mint)}.mlnote.bad{color:var(--bad)}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-gap:var(--s3);align-items:center;padding:.5rem 0;border-bottom:1px solid var(--edge);font-size:.88rem}
.lg:last-child{border:0}.lg s{text-decoration:none;font-weight:800;font-size:.7rem;padding:.1rem .5rem;border-radius:999px}
.lg s.ok{color:#0b0d14;background:var(--mint)}.lg s.bad{color:#fff;background:var(--bad)}
.lg span{min-width:0;color:var(--ink2);direction:ltr;unicode-bidi:isolate;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[dir=rtl] .lg span{text-align:right}
.lg span b{color:var(--ink)}.lg time{color:var(--mute);font-size:.78rem;font-variant-numeric:tabular-nums}
#mlrecent .empty{margin:0}
.ps5hint{padding:var(--s4);border:1px solid var(--edge2);border-radius:var(--r2);background:rgba(255,255,255,.02);font-size:1rem;line-height:1.5}
.ps5hint b{display:block;margin-top:.45rem;font-size:1.55rem;color:var(--pri);direction:ltr;unicode-bidi:isolate}
[dir=rtl] .ps5hint b{text-align:right}
.mlgoto{margin-top:var(--s3);width:100%}
/* banners and dialogs */
#selfupd,#wkupd{display:none;position:fixed;left:50%;top:5.2rem;transform:translateX(-50%);z-index:90;max-width:min(46rem,92vw);padding:.55rem .7rem .55rem 1.1rem;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--deck);border:1px solid var(--amber);border-radius:var(--r);box-shadow:0 .8rem 2rem rgba(0,0,0,.7)}
#selfupd.show,#wkupd.show{display:flex}
#selfupd.show~#wkupd.show,#wkupd.show~#selfupd.show{top:9rem}
#selfupd p,#wkupd p{margin:0;margin-inline-end:var(--s4);font-size:.95rem;font-weight:700;color:var(--amber)}
#selfupd .acts,#wkupd .acts{display:flex}#selfupd .acts>*+*,#wkupd .acts>*+*{margin-inline-start:var(--s2)}
#selfupd button,#wkupd button{min-height:2.3rem;font-size:.88rem}
#selfupddl,#wkupddl{color:#0b0d14}#selfupddl:before,#wkupddl:before{background:var(--amber);border-color:var(--amber)}
#selfupddl:disabled,#wkupddl:disabled{opacity:.6}
#autobanner,#modal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:100;width:min(34rem,90vw);padding:var(--s5);flex-direction:column;align-items:center;text-align:center;background:var(--deck);border:1px solid var(--edge2);border-radius:calc(var(--r) + 4px);box-shadow:0 0 0 9999px rgba(5,6,10,.72),0 1.2rem 3rem rgba(0,0,0,.8)}
#autobanner.show,#modal.show{display:flex}
#autobanner p,#modal p{margin:0;font-size:1.35rem;font-weight:800;line-height:1.3;color:var(--ink)}
#autobanner small,#modal small{display:block;margin-top:var(--s2);font-size:.9rem;color:var(--mute)}
#autobannercancel{margin-top:var(--s5);min-width:12rem;min-height:3rem;font-size:1.1rem;color:var(--bad)}
#autobannercancel:before{background:rgba(251,90,122,.08);border-color:rgba(251,90,122,.7)}
#modal .acts{display:flex;margin-top:var(--s5)}#modal .acts button{min-width:9rem;min-height:2.9rem;margin:0 var(--s2)}
#modalok{color:#fff}#modalok:before{background:var(--bad);border-color:var(--bad)}
#catupdate{display:none!important}
@media (hover:hover){
button:hover:before{border-color:var(--pri)}
.navbtn:hover:before{background:rgba(255,255,255,.04)}
.elf:hover{border-color:var(--edge2)}
}
@media (pointer:coarse){
button{min-height:2.9rem}button.run{min-height:2.75rem}
.langopt{min-height:3rem}
input.mark,input.auto{width:1.6rem;height:1.6rem}
.mlopts .pick{min-height:2.75rem}
.mlin,#q{min-height:2.9rem;font-size:16px}
}
/* TV: rem follows the viewport, the page scrolls as a whole (no inner scroll boxes) */
@media(min-width:1180px) and (min-height:600px){
html{font-size:13px;font-size:clamp(12px,min(1.02vw,1.85vh),26px)}
}
@media(max-width:1179px){
#home{grid-template-columns:minmax(0,1fr);grid-template-areas:"mine" "quick" "run" "cats" "set"}
#ml,#fb{grid-template-columns:minmax(0,1fr)}
.listgrid,.proclist,.plist{grid-template-columns:minmax(0,1fr)}
.places{grid-template-columns:repeat(auto-fill,minmax(9rem,1fr))}
}
@media(max-width:860px){
.wrap{padding:var(--s2) var(--s2) var(--s4)}
.bar{flex-wrap:wrap;padding:var(--s2)}
.search{order:5;flex:1 1 100%;max-width:none;margin:var(--s2) 0 0}
.live{order:6;flex:1 1 auto;max-width:none;margin-top:var(--s2)}
#runchip{order:7;margin-top:var(--s2)}
.sys{margin-inline-start:auto}
#clock{display:none}
#shell{grid-template-columns:minmax(0,1fr)}
#sidebar{position:static}
#nav{grid-template-columns:repeat(2,minmax(0,1fr))}
.navgrp{grid-column:1/-1}
.cards{grid-template-columns:minmax(0,1fr)}
.elf{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"i n v" "i d d" "a a a"}
.elf .a{margin-top:var(--s2);justify-content:flex-end;flex-wrap:wrap}
.plist .elf.dir{grid-template-areas:"i n a" "i d a"}.plist .elf.dir .a{margin-top:0}
.brand h1{font-size:1.25rem}
#langlist{width:min(22rem,calc(100vw - 1rem))}
.lg{grid-template-columns:auto minmax(0,1fr)}.lg time{grid-column:2}
.fbtop{flex-wrap:wrap}.fbtop .mlin{flex:1 1 100%;margin-top:var(--s2);order:3}
}
:focus-visible{outline:none}

/* multi-select: the ELF badge is the checkbox */
.elf.nom.pk:before{display:none}
.pick{grid-area:i;position:relative;display:flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;min-height:0;padding:0;font-size:.62rem;font-weight:800;letter-spacing:.06em;color:var(--pri);background:rgba(124,140,255,.12);border:1px solid transparent;border-radius:9px;box-shadow:none}
.pick:after{content:"";position:absolute;top:-4px;right:-4px;width:.85rem;height:.85rem;border-radius:50%;background:var(--deck);border:2px solid var(--edge2)}
.pick:hover,.pick:focus{border-color:var(--pri)}
.pick.on{color:transparent;background:var(--pri);border-color:var(--pri)}
.pick.on:before{content:"";position:absolute;left:50%;top:46%;width:.5rem;height:.95rem;border:solid #0b0d14;border-width:0 .2rem .2rem 0;transform:translate(-50%,-50%) rotate(45deg)}
.pick.on:after{display:none}
body[data-sel] main{padding-bottom:6.5rem}
#selbar{display:none;position:fixed;left:50%;bottom:1rem;z-index:40;width:calc(100% - 2rem);max-width:58rem;transform:translateX(-50%);padding:.6rem .75rem;background:rgba(37,46,68,.98);border:1px solid var(--pri);border-radius:var(--r);box-shadow:0 18px 48px rgba(0,0,0,.55)}
#selbar.show{display:block}
.selrow{display:flex;flex-wrap:wrap;align-items:center;margin:-.25rem}
.selrow>*{margin:.25rem}
.selrow .seln{flex:1 1 auto;font-size:1rem}
.selrow button{min-width:7rem}
.selhint{flex:1 0 100%;color:var(--mute);font-size:.75rem}
.selq{list-style:none;margin:0 0 .55rem;padding:0;max-height:12.5rem;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));grid-gap:.35rem}
.selq li{display:flex;justify-content:space-between;align-items:center;padding:.35rem .6rem;background:var(--card);border-radius:9px;border-inline-start:3px solid var(--edge2);font-size:.85rem}
.selq li b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.selq li span{flex:0 0 auto;margin-inline-start:.5rem;color:var(--ink2);font-size:.78rem}
.selq li[data-st=busy]{border-color:var(--amber)}.selq li[data-st=busy] span{color:var(--amber)}
.selq li[data-st=ok],.selq li[data-st=added]{border-color:var(--mint)}.selq li[data-st=ok] span,.selq li[data-st=added] span{color:var(--mint)}
.selq li[data-st=fail]{border-color:var(--bad)}.selq li[data-st=fail] span{color:var(--bad)}
/* AutoPayload settings rows */
.optrow{display:flex;align-items:center;justify-content:space-between;padding:.55rem 0;border-top:1px solid var(--edge)}
.optrow:first-child{border-top:0;padding-top:0}
.optrow>div:first-child{min-width:0;flex:1 1 auto;margin-inline-end:var(--s3)}
.optrow b{display:block;font-size:.95rem}
.optrow small{display:block;margin-top:.15rem;color:var(--mute);font-size:.76rem;line-height:1.35}
.homeChoices.seg{display:flex;flex:0 0 auto;padding:3px;background:var(--deck);border:1px solid var(--edge);border-radius:999px}
.homeChoices.seg button{min-width:3.6rem;min-height:2.1rem;padding:.2rem .9rem;border:0;border-radius:999px;background:transparent;box-shadow:none}
.homeChoices.seg button.selected{background:var(--pri);color:#0b0d14}
@media (max-width:860px){#selbar{bottom:.5rem;width:calc(100% - 1rem)}.selrow .seln{flex:1 0 100%}.selrow button{flex:1 1 0;min-width:0;padding-left:.4rem;padding-right:.4rem;white-space:normal;font-size:.84rem;line-height:1.15}.optrow{flex-wrap:wrap}}
[dir=rtl] .pick:after{right:auto;left:-4px}
[dir=rtl] .search svg{left:auto;right:.9rem}
a:focus{outline:none;border-radius:6px;box-shadow:var(--ring)}
.pick:focus{box-shadow:var(--ring)}
#updov{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:120;align-items:center;justify-content:center;background:rgba(6,8,14,.82)}
#updov.show{display:flex}
#updov>div{max-width:34rem;margin:1rem;padding:1.6rem 1.8rem;text-align:center;background:var(--deck);border:1px solid var(--pri);border-radius:var(--r);box-shadow:0 24px 60px rgba(0,0,0,.6)}
#updov p{margin:.9rem 0 0;font-size:1.1rem;font-weight:700;line-height:1.4}
#updov.bad>div{border-color:var(--bad)}#updov.bad .spin{display:none}#updov.bad p{color:var(--bad);margin:0 0 1rem}
.spin{display:inline-block;width:2.6rem;height:2.6rem;border-radius:50%;border:4px solid rgba(124,140,255,.25);border-top-color:var(--pri);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* AutoPayload: the whole row is the switch, marked rows stand out */
.elf.pk{cursor:pointer}
.elf.autorow{cursor:pointer;-webkit-user-select:none;user-select:none;min-height:3.9rem}
.elf.autorow:before{display:none}
.ack{grid-area:i;position:relative;display:block;width:2.4rem;height:2.4rem;border-radius:9px;border:2px solid var(--edge2);background:var(--deck)}
.elf.autorow.ison{background:rgba(167,139,250,.17);border-color:var(--pri2)}
.elf.autorow.ison .n b{color:#fff}
.elf.autorow.ison .ack{background:var(--pri2);border-color:var(--pri2)}
.elf.autorow.ison .ack:before{content:"";position:absolute;left:50%;top:44%;width:.5rem;height:.95rem;border:solid #0b0d14;border-width:0 .22rem .22rem 0;-webkit-transform:translate(-50%,-50%) rotate(45deg);transform:translate(-50%,-50%) rotate(45deg)}
.atag{display:inline-block;padding:.32rem .75rem;border-radius:999px;font-size:.8rem;font-weight:800;color:var(--ink2);background:rgba(255,255,255,.05);border:1px solid var(--edge2);white-space:nowrap}
.elf.autorow.ison .atag{color:#0b0d14;background:var(--pri2);border-color:var(--pri2)}
.elf.autorow:focus{outline:none;border-color:var(--pri);box-shadow:var(--ring)}
.elf.autorow:hover{border-color:var(--pri)}
.autohint{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 0 var(--s3);color:var(--mute);font-size:.85rem}
.autohint b{color:var(--pri2);font-size:.9rem}

/* PS5 files: file manager */
.fmbar{display:flex;flex-wrap:wrap;margin:0 -.2rem var(--s2)}
.fmbar button{margin:.2rem;min-width:0;padding-left:.9rem;padding-right:.9rem}
.fmbar button.danger{color:var(--bad)}
.fmbar button.danger:before{border-color:rgba(251,90,122,.5)}
.pick.isdir{color:var(--teal);background:rgba(45,212,191,.12)}
.pick.isfile{color:var(--ink2);background:rgba(255,255,255,.06)}
.pick.on.isdir,.pick.on.isfile{color:transparent;background:var(--pri)}
.plist .elf .d:empty{display:none}
#modalin{display:block;width:100%;margin:.6rem 0 0;box-sizing:border-box}
.pick:before{display:none}
.pick.on:before{display:block;right:auto;bottom:auto;z-index:1;border-radius:0;background:none;transition:none}

/* PS5 files: bigger rows for TV, controller and touch */
.plist .elf{min-height:4.9rem;padding:.7rem .8rem .7rem .9rem;grid-column-gap:var(--s4,1rem)}
.plist .pick{width:3.3rem;height:3.3rem;font-size:.78rem;border-radius:12px}
.plist .pick:after{width:1.05rem;height:1.05rem;top:-5px;right:-5px}
.plist .pick.on:before{width:.65rem;height:1.25rem;border-width:0 .26rem .26rem 0}
.plist .elf .n{font-size:1.18rem}
.plist .elf .d{font-size:.9rem;margin-top:.15rem}
.plist .elf .v{font-size:.82rem;max-width:9rem}
.plist button.run{min-height:3.1rem;min-width:6.5rem;font-size:1rem}
.fmbar button{min-height:3rem;font-size:1rem}
.fmro{display:flex;align-items:center;margin:.2rem .5rem;padding:0 .8rem;border-radius:999px;font-size:.88rem;font-weight:800;color:var(--amber);background:rgba(251,191,36,.12)}
.places button{min-height:3.1rem;font-size:1rem}
.plist .elf.vw{cursor:pointer}
/* text viewer */
#tvov{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;padding:2rem;background:rgba(12,16,26,.6)}
#tvov.show{display:block}
.tvbox{display:flex;flex-direction:column;height:100%;max-width:90rem;margin:0 auto;box-sizing:border-box;padding:1rem 1.1rem;background:var(--deck);border:1px solid var(--edge2);border-radius:var(--r);box-shadow:0 24px 64px rgba(0,0,0,.6)}
.tvhead{display:flex;flex-wrap:wrap;align-items:center;margin:-.25rem}
.tvhead>*{margin:.25rem}
.tvhead b{flex:1 1 auto;min-width:0;font-size:1.2rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
#tvmeta{color:var(--mute);font-size:.9rem;white-space:nowrap}
#tvwrap[aria-pressed=true]{color:#0b0d14}#tvwrap[aria-pressed=true]:before{background:var(--pri);border-color:var(--pri)}
#tvnote{margin:.4rem 0 0;color:var(--amber);font-size:.88rem}
#tvnote:empty{display:none}
#tvbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:.6rem}
#tvpre{flex:1 1 auto;min-height:0;margin:0;padding:.9rem 1rem;overflow:auto;-webkit-overflow-scrolling:touch;background:#161c2a;border:1px solid var(--edge);border-radius:var(--r2);color:#e6e9f5;font:0.95rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre;direction:ltr;text-align:left;tab-size:4}
#tvpre.wrap{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
#tvpre:focus{outline:none;border-color:var(--pri)}
.tvinfo{display:grid;grid-template-columns:auto minmax(0,1fr);grid-gap:.5rem 1.2rem;margin:.4rem 0;font-size:1rem}
.tvinfo dt{color:var(--mute);font-weight:700}.tvinfo dd{margin:0;word-break:break-all;direction:ltr;unicode-bidi:isolate}
@media (max-width:700px){#tvov{padding:.5rem}.plist .elf{min-height:4.4rem}.plist button.run{min-width:5.2rem}}

/* payload icons on the badge (lazy, ELF badge stays as fallback) */
.pick img.picon{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .15s}
.pick.iconok img.picon{opacity:1}
.pick.iconok>span{visibility:hidden}
.pick.iconok{background:#161c2a}
.pick.on.iconok img.picon{opacity:.3}
.pick:after{z-index:2}

  pldmgrFetch('/processes_list').then(function(data){
    var procs=(data && data.processes) ? data.processes : [];
    var matched=[], placeholders=[], i, pr, pname, pick;
    for(i=0;i<procs.length;i++){
      pr=procs[i];
      if(!pr || before[pr.pid]) continue;
      if((pr.pid|0)<=0) continue;
      pname=pr.name||'';
      /* Empty comm is not this ELF. Do not attach a random new PID. */
      if(!normBase(pname)) continue;
      if(isProtectedKillName(pname)) continue;
      if(processNameMatches(pname, name)) matched.push(pr);
      else if(isElfldrPlaceholder(pname)) placeholders.push(pr);
    }
    /* Name match wins. payload.elf is only the elfldr stand-in for this send. */
    pick=matched.length ? matched : placeholders;
    if(pick.length){
      pick.sort(function(a,b){ return (b.pid|0)-(a.pid|0); });
      savePayloadPid(name, pick[0].pid);
      dbgInstall('Install OK '+name+' pid='+pick[0].pid+' ('+(pick[0].name||'')+')');
      refreshKillButtons();
      return;
    }
    if(triesLeft>0) setTimeout(function(){ trackNewPid(name, before, triesLeft-1); }, 350);
  }).catch(function(){});
}
function sendWithPidTrack(name, fileUrl, done){
  snapshotPidSet(function(before){
    askLauncher(fileUrl, function(){
      rememberActive(name);
      if(before) trackNewPid(name, before, 12);
      if(done) done();
    });
  });
}
/* On :1000 push local ELF bytes via /run (reliable). Pages keeps elfldr ?uri=. */
function isConsoleHost(){
  /* Launcher HTTP :1000 (loopback or LAN). GitHub Pages is https and stays remote. */
  var h=location.hostname||'';
  if(location.protocol!=='http:') return false;
  return h==='127.0.0.1'||h==='localhost'||location.port==='1000';
}

/* Exact category names used by our payloads.json (and older ones). */
var CATEGORY_FOLDER={'loader':'loader','hen':'hen','jailbreak':'hen','jailbreak & hen':'hen',
 'game storage':'storage','game library':'storage','storage':'storage','mods & saves':'mods','mods':'mods',
 'files':'files','files & transfer':'files','network':'net','network & remote':'net','media':'media','media & audio':'media',
 'system':'system','dev tools':'tools','tools':'tools'};
function mapUpstreamFolder(cat, name){
  cat=String(cat||'').toLowerCase().trim();
  name=String(name||'').toLowerCase();
  if(CATEGORY_FOLDER.hasOwnProperty(cat)) return CATEGORY_FOLDER[cat];
  /* Other catalogs use broad groups, so look at the payload name first. */
  if(/linux|power|reboot|suspend|fan[-_ ]|syslang|date[-_ ]?time|state[-_ ]?manager/.test(name)) return 'system';
  if(/etahen|onionhen|kstuff|jb[-_ ]?daemon|jailbreak/.test(name)) return 'hen';
  if(/elfldr|autoload|pldmgr|payload[-_ ]?manager|launcher|launchpad|hostpayloads/.test(name)) return 'loader';
  if(/cheat|fps|patch|backpork|save/.test(name)) return 'mods';
  if(/shadowmount|smplus|dump|mounter|compress|pkg/.test(name)) return 'storage';
  if(/gdb|klog|shsrv|debug|pager|notify/.test(name)) return 'tools';
  if(/ftp|file|upload|kura|bfpilot|unrar|7zip/.test(name)) return 'files';
  if(/websrv|dns|remote|rp[-_]|linkdev|offact|tailscale/.test(name)) return 'net';
  if(/player|plutotv|svtplay|tv4play|hearbridge|media|audio|vlc/.test(name)) return 'media';
  if(cat.indexOf('load')>=0) return 'loader';
  if(cat.indexOf('jail')>=0 || cat.indexOf('hen')>=0) return 'hen';
  if(cat.indexOf('system')>=0 || cat.indexOf('power')>=0) return 'system';
  if(cat.indexOf('network')>=0 || cat.indexOf('server')>=0 || cat.indexOf('remote')>=0) return 'net';
  if(cat.indexOf('file')>=0 || cat.indexOf('ftp')>=0) return 'files';
  if(cat.indexOf('stor')>=0 || cat.indexOf('dump')>=0 || cat.indexOf('mount')>=0 || cat.indexOf('game')>=0) return 'storage';
  if(cat.indexOf('save')>=0 || cat.indexOf('cheat')>=0 || cat.indexOf('mod')>=0) return 'mods';
  if(cat.indexOf('media')>=0 || cat.indexOf('player')>=0 || cat.indexOf('stream')>=0) return 'media';
  return 'tools';
}
function isItsplkMirrorUrl(url){
  url=String(url||'').toLowerCase();
  if(!url) return false;
  if(url.indexOf('itsplk.github.io')>=0) return true;
  if(url.indexOf('raw.githubusercontent.com/itsplk/')>=0) return true;
  if(url.indexOf('github.com/itsplk/ps5-payloads-mirror')>=0) return true;
  if(url.indexOf('itsplk')>=0 && url.indexOf('ps5-payloads-mirror')>=0) return true;
  return false;
}
function isGithubElfLauncherMirror(url){
  url=String(url||'').toLowerCase();
  return url.indexOf('github.com/X-F1REBALL-X/elf-launcher')>=0 ||
    url.indexOf('x-f1reball-x.github.io/elf-launcher')>=0;
}
/* Author/dev download URL beats the itsPLK mirror copy. */
function pickPayloadUrl(item){
  var mirror=item.url||'';
  var author=item.source_direct||'';
  if(author && !isItsplkMirrorUrl(author)) return author;
  if(mirror && !isItsplkMirrorUrl(mirror)) return mirror;
  return author||mirror;
}
function mapRemotePayload(item, srcName){
  var fn=item.filename||item.name||'';
  var url=pickPayloadUrl(item);
  var sum=item.checksum||item.sha256||'';
  if(!fn || !url || !sum || String(sum).length!==64) return null;
  /* Temporarily skip WK Autoloader from live catalogs. */
  if(/webkit[-_ ]?autoloader|wk[-_ ]?autoloader/i.test(fn) || /webkit[-_ ]?autoloader|wk[-_ ]?autoloader/i.test(item.name||'')) return null;
  /* Keep author hint from source page / author field. Download URL prefers the author repo. */
  var by=item.author||srcName||'upstream';
  if(item.source){
    try{ by=String(item.source).replace(/^https?:\/\//,'').split('/')[2]||by; }catch(e){}
    if(item.source.indexOf('github.com/')>=0){
      var parts=item.source.split('github.com/')[1];
      if(parts) by=parts.split('/')[0]||by;
    }
  }
  /* Always /data/elf-launcher/mirror/<filename>. Never zip folders from item.path. */
  var base=String(fn).split('/').pop().split('\\').pop();
  if(!base || base.indexOf('..')>=0) return null;
  var path='mirror/'+base;
  return {
    folder:mapUpstreamFolder(item.folder||item.category, fn),
    path:path,
    name:fn,
    version:item.version||'',
    info:item.description||item.name||fn,
    url:url,
    by:by,
    checksum:String(sum).toLowerCase(),
    size:(item.size|0),
    sourceName:srcName||'',
    authorUrl:(item.source_direct && !isItsplkMirrorUrl(item.source_direct))?item.source_direct:'',
    icon:(typeof item.icon==='string' && /^https:\/\//.test(item.icon))?item.icon:'',
    latest:(item.github_latest && item.github_latest.repo && item.github_latest.asset)?item.github_latest:null
  };
}
function parseCatalogBody(text){
  var d=JSON.parse(text);
  if(Array.isArray(d)) return d;
  if(d && Array.isArray(d.payloads)) return d.payloads;
  return [];
}
function fetchCatalogText(url){
  if(isConsoleHost()){
    return fetch('/catalog_fetch?url='+encodeURIComponent(url)).then(function(r){
      return r.text().then(function(t){
        if(!r.ok) throw new Error(t||('HTTP '+r.status));
        return t;
      });
    });
  }
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  });
}
/* Same product (version-stripped base) + channel (beta|stable) is one row.
   Beta and stable stay as separate channels. */
function productChannel(m){
  var blob=(String(m&&m.version||'')+' '+String(m&&m.name||'')+' '+String(m&&m.path||'')).toLowerCase();
  return /beta/.test(blob) ? 'beta' : 'stable';
}
function dedupeKey(m){
  var base=normBase(m.name||m.path||'');
  if(!base) return '';
  return 'f:'+base+'|ch:'+productChannel(m);
}
/* 0 = author/dev URL, 1 = GitHub catalog mirror, 2 = itsPLK mirror. Lower wins. */
function entryRank(m){
  var url;
  if(m && m.sourceName==='pinned') return -1;
  url=String(m && m.url || '');
  if(m && m.source_direct && !isItsplkMirrorUrl(m.source_direct)) return 0;
  if(!isItsplkMirrorUrl(url) && !isGithubElfLauncherMirror(url)) return 0;
  if(m.sourceName==='X-F1REBALL-X' || isGithubElfLauncherMirror(url)) return 1;
  return 2;
}
/* Parse version-ish tokens for comparison. Higher tuple wins. */
function parseVerParts(v){
  v=String(v==null?'':v).toLowerCase().replace(/^\s+|\s+$/g,'');
  if(!v) return null;
  var m=v.match(/v?(\d+(?:\.\d+)*)([a-z]+)?(\d*)/i);
  if(!m) return null;
  var nums=m[1].split('.').map(function(x){ return parseInt(x,10)||0; });
  var tag=(m[2]||'').toLowerCase();
  var tagN=parseInt(m[3],10)||0;
  var tagRank=0;
  if(tag==='alpha') tagRank=-30;
  else if(tag==='beta' || tag==='b') tagRank=-20;
  else if(tag==='rc') tagRank=-10;
  else if(tag) tagRank=-5;
  return {nums:nums, tagRank:tagRank, tagN:tagN, raw:v};
}
function cmpVerParts(a, b){
  if(!a && !b) return 0;
  if(!a) return -1;
  if(!b) return 1;
  var n=Math.max(a.nums.length, b.nums.length), i, av, bv;
  for(i=0;i<n;i++){
    av=a.nums[i]|0; bv=b.nums[i]|0;
    if(av!==bv) return av>bv ? 1 : -1;
  }
  if(a.tagRank!==b.tagRank) return a.tagRank>b.tagRank ? 1 : -1;
  if(a.tagN!==b.tagN) return a.tagN>b.tagN ? 1 : -1;
  return 0;
}
function betterEntry(a, b){
  var va=parseVerParts(a&&a.version), vb=parseVerParts(b&&b.version);
  var cv=cmpVerParts(va, vb);
  if(cv) return cv>0 ? a : b;
  var ra=entryRank(a), rb=entryRank(b);
  if(ra!==rb) return ra<rb ? a : b;
  if((a.sourceName==='X-F1REBALL-X')!==(b.sourceName==='X-F1REBALL-X'))
    return a.sourceName==='X-F1REBALL-X' ? a : b;
  /* Prefer our ideal folder/category path when otherwise tied. */
  var fa=String(a.folder||a.category||'').toLowerCase();
  var fb=String(b.folder||b.category||'').toLowerCase();
  var our=['loader','hen','storage','mods','files','net','media','system','tools','launcher'];
  var ia=our.indexOf(fa), ib=our.indexOf(fb);
  if(ia>=0 && ib<0) return a;
  if(ib>=0 && ia<0) return b;
  return a;
}
/* Our catalog decides the folder, even when another catalog has the newer copy. */
function keepOurFolder(w, a, b){
  var cur=(a && a.sourceName==='X-F1REBALL-X') ? a : ((b && b.sourceName==='X-F1REBALL-X') ? b : null), c, k;
  if(!cur || cur===w || !w || w.folder===cur.folder) return w;
  c={}; for(k in w) if(w.hasOwnProperty(k)) c[k]=w[k];
  c.folder=cur.folder;
  return c;
}
function dedupePayloads(list){
  var map={}, order=[], i, m, k, prev;
  for(i=0;i<list.length;i++){
    m=list[i];
    if(!m) continue;
    k=dedupeKey(m);
    if(!k){ order.push('raw:'+i); map['raw:'+i]=m; continue; }
    prev=map[k];
    if(!prev){ map[k]=m; order.push(k); }
    else map[k]=keepOurFolder(betterEntry(prev, m), prev, m);
  }
  var out=[], j;
  for(j=0;j<order.length;j++) out.push(map[order[j]]);
  return out;
}
/* Fetch every source and build the merged list. Does not touch PAYLOADS. */
function fetchRemoteCatalog(done){
  var sources=CATALOG_SOURCES && CATALOG_SOURCES.length ? CATALOG_SOURCES : [{name:'catalog',url:CATALOG_SOURCE}];
  var jobs=[];
  var si;
  for(si=0;si<sources.length;si++){
    (function(src){
      jobs.push(fetchCatalogText(src.url).then(function(text){
        return {ok:true, src:src, arr:parseCatalogBody(text)};
      }).catch(function(){
        return {ok:false, src:src, arr:[]};
      }));
    })(sources[si]);
  }
  Promise.all(jobs).then(function(results){
    var out=[], i, m, p, r, live=0, names=[];
    for(i=0;i<PINNED_PAYLOADS.length;i++){
      p=PINNED_PAYLOADS[i];
      if(p && !p.sourceName) p.sourceName='pinned';
      out.push(p);
    }
    for(i=0;i<results.length;i++){
      r=results[i];
      if(!r.ok) continue;
      live++;
      names.push(r.src.name||('src'+i));
      var j;
      for(j=0;j<r.arr.length;j++){
        m=mapRemotePayload(r.arr[j], r.src.name||'');
        if(!m) continue;
        out.push(m);
      }
    }
    done(live ? dedupePayloads(out) : null, live, names);
  }, function(){ done(null, 0, []); });
}

function catalogEntryKey(m){
  if(!m) return '';
  return String(m.name||'')+'|'+String(m.checksum||m.sha256||'')+'|'+String(m.version||'')+'|'+String(m.url||'');
}
function catalogFingerprint(list){
  var keys=[], i;
  for(i=0;i<(list||[]).length;i++) keys.push(catalogEntryKey(list[i]));
  keys.sort();
  return keys.join('\n');
}
function catalogChangedNames(before, after){
  var prev={}, i, k, names=[], seen={};
  for(i=0;i<(before||[]).length;i++){ k=catalogEntryKey(before[i]); if(k) prev[k]=before[i]; }
  for(i=0;i<(after||[]).length;i++){
    k=catalogEntryKey(after[i]);
    if(!k) continue;
    if(!prev[k]){
      var n=String(after[i].name||after[i].filename||'item');
      if(!seen[n]){ seen[n]=1; names.push(n); }
    }
  }
  return names;
}
var lastCatalogStatus='';
function setCatalogStatus(msg){
  if(!msg) return;
  lastCatalogStatus=msg;
  setStatus(msg);
}
function statusAfterCatalogRefresh(before, after, live, names){
  if(!after || !after.length){ setCatalogStatus(t('catalogOffline')); return; }
  var changed=catalogChangedNames(before, after);
  if(!changed.length){
    setCatalogStatus(t('catalogNoNew'));
    return;
  }
  var shown=changed.slice(0,8).join(', ');
  if(changed.length>8) shown+=', +'+(changed.length-8);
  setCatalogStatus(t('catalogChanged',{names:shown}));
}

function refreshCatalog(done){
  lastCatalogStatus='';
  setStatus(t('refreshing'));
  var before=PAYLOADS ? PAYLOADS.slice() : [];
  fetchRemoteCatalog(function(list, live, names){
    if(list){
      PAYLOADS=list;
      statusAfterCatalogRefresh(before, PAYLOADS, live, names);
      if(done) done(true);
    }else{
      PAYLOADS=PINNED_PAYLOADS.slice();
      setCatalogStatus(t('catalogOffline'));
      if(done) done(false);
    }
  });
}
/* First open fetches every repo once. Later opens show this cache right away and
   check saved files against the repos in the background (Update banner).
   Update and manual Refresh clear it. Disk Download/Load checks are separate. */
var CATALOG_CACHE_KEY='ps5elfs-catalog-'+APP_VERSION;
function readCatalogCache(){
  var raw='';
  try{ raw=localStorage.getItem(CATALOG_CACHE_KEY)||''; }catch(e){}
  if(!raw){ try{ raw=sessionStorage.getItem(CATALOG_CACHE_KEY)||''; }catch(e2){} }
  if(!raw) return null;
  try{
    var o=JSON.parse(raw);
    if(o && o.payloads && o.payloads.length) return o.payloads;
  }catch(e3){}
  return null;
}
function writeCatalogCache(list){
  var s;
  try{ s=JSON.stringify({payloads:list}); }catch(e0){ return; }
  try{ localStorage.setItem(CATALOG_CACHE_KEY, s); }catch(e){}
  try{ sessionStorage.setItem(CATALOG_CACHE_KEY, s); }catch(e2){}
}
function clearCatalogCache(){
  try{ localStorage.removeItem(CATALOG_CACHE_KEY); }catch(e){}
  try{ sessionStorage.removeItem(CATALOG_CACHE_KEY); }catch(e2){}
}
/* Downloaded-file update check (console only).
   The cached list is shown right away. In the background the repos are fetched
   and every file already saved on the console disk is compared (sha256 sidecar,
   else size) with the fresh catalog. Only when a saved file is out of date does
   the Update banner appear. New catalog entries alone do not show it.
   Update = refresh the list + re-download just those saved files (/update). */
var CATALOG_RECHECK_MS=30*60*1000;
var catalogCheckBusy=false;
var catalogUpdating=false;
var catalogRecheckTimer=null;
var pendingUpdates=[];
/* Small caption shown beside an Update button: catalog version, else short sha. */
function updateVerLabel(e){
  var v=String(e && e.version || '').replace(/^\s+|\s+$/g,'');
  if(v) return (/^v/i.test(v) ? v : 'v'+v);
  var sum=String(e && e.checksum || '');
  return sum ? sum.slice(0,7) : '';
}
function localMatchesEntry(meta, e){
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(e.checksum||'').toLowerCase();
  if(localSum.length===64 && catSum.length===64) return localSum===catSum;
  if(e.size && (meta.size|0)>0) return (meta.size|0)===(e.size|0);
  return true; /* nothing to compare: treat as current */
}
/* list -> [{path, entries:[...]}] grouped by disk path, catalog order kept. */
function groupByPath(list){
  var map={}, out=[], i, m;
  for(i=0;i<list.length;i++){
    m=list[i];
    if(!m || !m.path) continue;
    if(!map[m.path]){ map[m.path]={path:m.path, entries:[]}; out.push(map[m.path]); }
    map[m.path].entries.push(m);
  }
  return out;
}
function findDownloadedUpdates(list, done){
  var groups=groupByPath(list||[]), found=[], idx=0, inflight=0;
  function pump(){
    if(idx>=groups.length && inflight===0){ done(found); return; }
    while(inflight<4 && idx<groups.length){
      inflight++;
      (function(g){
        localMeta(g.path).then(function(meta){
          var i, target=null;
          if(!meta || !meta.ok || !meta.exists) return;
          for(i=0;i<g.entries.length;i++){ if(localMatchesEntry(meta, g.entries[i])) return; }
          /* Saved file matches no catalog row for that path: it is out of date. */
          for(i=0;i<g.entries.length;i++){
            if(g.entries[i].url && g.entries[i].checksum){ target=g.entries[i]; break; }
          }
          if(target) found.push({path:g.path, entry:target, localSize:(meta.size|0)});
        }).catch(function(){}).then(function(){ inflight--; pump(); });
      })(groups[idx++]);
    }
  }
  pump();
}
/* #catupdate global banner is gone. Pending updates show on the sidebar Update
   button (badge + data-state="has") and as per-row Update buttons. */
function paintSideUpdate(){
  var b=document.getElementById('sideupd'), n=document.getElementById('sideupdn');
  var k=pendingUpdates ? pendingUpdates.length : 0;
  if(!b) return;
  if(catalogUpdating){ b.setAttribute('data-state','busy'); b.disabled=true; }
  else{ b.setAttribute('data-state', k ? 'has' : 'idle'); b.disabled=false; }
  if(n) n.textContent=k ? String(k) : '';
  b.title=k ? t('updatesAvail',{n:k}) : t('upToDate');
  paintUpdDots();
}
function showUpdateBanner(list){ pendingUpdates=list||[]; paintSideUpdate(); }
function hideUpdateBanner(){ pendingUpdates=[]; paintSideUpdate(); }
function scheduleCatalogRecheck(){
  if(!isConsoleHost()) return;
  if(catalogRecheckTimer) clearTimeout(catalogRecheckTimer);
  catalogRecheckTimer=setTimeout(function(){ checkDownloadedUpdates(null); }, CATALOG_RECHECK_MS);
}
/* fresh: a list just fetched from the repos, or null to fetch now. */
function checkDownloadedUpdates(fresh){
  if(!isConsoleHost() || catalogCheckBusy || catalogUpdating) return;
  catalogCheckBusy=true;
  function withList(list){
    if(!list || !list.length){ catalogCheckBusy=false; scheduleCatalogRecheck(); return; }
    findDownloadedUpdates(list, function(found){
      catalogCheckBusy=false;
      scheduleCatalogRecheck();
      if(catalogUpdating) return;
      if(found.length) showUpdateBanner(found); else hideUpdateBanner();
      if(currentFolder==='downloaded') showDownloadedFolder();
    });
  }
  if(fresh) withList(fresh);
  else fetchRemoteCatalog(function(list){ withList(list); });
}

/* Something is mid-action (download/load/update): do not swap the list under it. */
function uiBusy(){

}
function updateOneFile(u){
  var q='/update?path='+encodeURIComponent(u.path)+
    '&url='+encodeURIComponent(u.entry.url)+
    '&sha256='+encodeURIComponent(u.entry.checksum);
  if(u.entry.size) q+='&size='+encodeURIComponent(String(u.entry.size|0));
  return fetch(q).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok,j:j}; });
  }).then(function(res){
    if(!res.ok || !res.j || !res.j.ok) throw new Error((res.j && res.j.message)||'update failed');
    return true;
  });

function applyCatalogUpdate(){
  if(catalogUpdating) return;
  catalogUpdating=true;
  paintSideUpdate();
  clearCatalogCache();
  var before=PAYLOADS;
  refreshCatalog(function(ok){
    if(!ok || !PAYLOADS || !PAYLOADS.length){
      /* Repos unreachable: keep the old list and the button so the user can retry. */
      PAYLOADS=before;
      writeCatalogCache(PAYLOADS);
      catalogUpdating=false;
      paintSideUpdate();
      setStatus(t('updFailedOffline'));
      return;
    }
    writeCatalogCache(PAYLOADS);
    /* Re-check against the list just fetched, then re-download only saved files. */
    findDownloadedUpdates(PAYLOADS, function(todo){
      var i=0, done=0, failed=[];
      function next(){
        if(i>=todo.length){
          showProgress(false);
          catalogUpdating=false;
          if(failed.length){
            showUpdateBanner(failed);
            setStatus(t('updatedPartial',{done:done,total:todo.length,names:failed.map(function(f){return f.entry.name;}).join(', ')}));
          }else{

function killByPid(name, pid, sendBtn, path){
  crwForgetPid(pid);
  var q='/process_kill?pid='+encodeURIComponent(pid);
  if(path) q+='&path='+encodeURIComponent(path);
  dbgKill('Kill start '+name+' pid='+pid+' path='+(path||''));
  fetch(q).then(function(r){
    return r.json().catch(function(){ return {ok:false,message:'bad json'}; }).then(function(j){
      return {httpOk:r.ok, status:r.status, j:j};
    });
  }).then(function(res){
    var body=(res.j && res.j.message!=null) ? String(res.j.message) : JSON.stringify(res.j);
    if(res.j && res.j.ok){
      clearPayloadPid(name);
      forgetActive(name);
      resetSendBtn(sendBtn);
      hideKillForName(name);
      dbgKill('Kill OK '+name+' pid='+pid+' http='+res.status+' '+body);
      if(currentFolder==='kill') showKillFolder();
    } else {
      dbgKill('Kill FAIL '+name+' pid='+pid+' http='+res.status+' '+body);
    }
  }).catch(function(err){
    var msg=(err && err.message) ? String(err.message) : String(err);
    if(msg.indexOf('HTTP')===0)
      dbgKill('Kill FAIL '+name+' pid='+pid+' pldmgr '+msg);
    else
      dbgKill('Kill FAIL '+name+' pid='+pid+' fetch/CORS/pldmgr: '+msg);

function killPayloadNow(name, sendBtn, path){
  var base=normBase(path||'');

  if(!path || !base){
    dbgKill('Kill blocked no path '+name);
    return;
  }
  if(isProtectedKillName(name) || isProtectedKillName(base)){
    dbgKill('Kill blocked protected '+name);
    return;
  }
  /* Send uses <img> to :9021 (OK from HTTPS Pages). Kill/PID track need HTTP :1000 same-origin. */
  if(location.protocol==='https:'){
    dbgKill('Kill blocked HTTPS Pages - use HTTP launcher :1000');
    return;
  }
  /* Re-check /processes_list. A saved PID is not enough if that PID was reused. */
  pldmgrFetch('/processes_list').then(function(data){
    var procs=(data && data.processes) ? data.processes : [];
    var pr=findRunningProc(base, procs);
    if(!pr){
      clearPayloadPid(name);
      hideKillForName(name);
      dbgKill('Kill FAIL '+name+' not loaded');
      if(currentFolder==='kill') showKillFolder();
      return;
    }
    dbgKill('Kill confirmed '+name+' path='+path+' pid='+pr.pid+' ('+(pr.name||'')+')');
    killByPid(name, pr.pid, sendBtn, path);
  }).catch(function(err){
    var msg=(err && err.message) ? String(err.message) : String(err);
    if(msg.indexOf('HTTP')===0)
      dbgKill('Kill FAIL '+name+' pldmgr list '+msg);
    else
      dbgKill('Kill FAIL '+name+' fetch/CORS/pldmgr list: '+msg);
  });
}

function localMeta(path){
  return fetch('/file_meta?path='+encodeURIComponent(path)).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);

  });
}
function needsUpdate(meta, catalog){
  /* Update only when local file already exists and differs from repo.
     Missing file = first install via Send (no Update button). */
  if(!catalog || !catalog.checksum) return false;
  if(!meta || !meta.ok || !meta.exists) return false;
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(catalog.checksum||'').toLowerCase();
  if(localSum && localSum.length===64 && catSum.length===64){
    return localSum !== catSum;
  }
  /* Size fallback when sidecar checksum is absent. */
  if(catalog.size && (meta.size|0)>0){
    return (meta.size|0) !== (catalog.size|0);
  }
  return false;
}
function runUpdate(path, catalog, btn, row, verEl){
  if(!catalog || !catalog.url || !catalog.checksum){
    setStatus(t('updMissing'));
    return;
  }
  btn.disabled=true;
  btn.setAttribute('data-state','busy');
  btn.textContent=t('updating');
  setStatus(t('updatingName',{name:catalog.name}));
  showProgress(true);
  setProgressPct(-1);
  var q='/update?path='+encodeURIComponent(path)+
    '&url='+encodeURIComponent(catalog.url)+
    '&sha256='+encodeURIComponent(catalog.checksum);
  if(catalog.size) q+='&size='+encodeURIComponent(String(catalog.size|0));
  fetch(q).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); }).then(function(res){
    showProgress(false);
    if(!res.ok || !res.j || !res.j.ok){
      var msg=(res.j && res.j.message) ? res.j.message : 'update failed';
      setStatus(t('updateFailed',{msg:msg}));
      btn.disabled=false;
      btn.setAttribute('data-state','idle');
      btn.textContent=t('update');
      return;
    }
    setProgressPct(100);
    setStatus(t('updatedName',{name:catalog.name}));
    pendingUpdates=(pendingUpdates||[]).filter(function(u){ return u.path!==path; });
    paintSideUpdate();
    if(btn.parentNode) btn.parentNode.removeChild(btn);
    if(verEl && verEl.parentNode) verEl.parentNode.removeChild(verEl);
    /* File is still local, so the main button stays Load. */
    if(row){
      var primary=primaryRun(row);
      if(primary) finishPrimary(primary, 'load');
    }
  }).catch(function(e){
    showProgress(false);
    btn.disabled=false;
    btn.setAttribute('data-state','idle');
    btn.textContent=t('update');
    setStatus(t('updateFailed',{msg:(e&&e.message)?e.message:String(e)}));
  });
}

function listLoadedPayloads(procs){
  var raw=[], i, p, base, pr, byPid, k, group, keep, j, comm, out;
  if(!procs) return [];
  for(i=0;i<PAYLOADS.length;i++){
    p=PAYLOADS[i];
    base=elfFileBase(p);
    if(!base || isProtectedKillName(base) || isProtectedKillName(p.name)) continue;
    pr=findRunningProc(base, procs);
    if(!pr) continue;
    raw.push({p:p, pr:pr, base:base});
  }
  byPid={};
  for(i=0;i<raw.length;i++){
    k=String(raw[i].pr.pid|0);
    if(!byPid[k]) byPid[k]=[];
    byPid[k].push(raw[i]);
  }
  out=[];
  for(k in byPid){
    if(!Object.prototype.hasOwnProperty.call(byPid, k)) continue;
    group=byPid[k];
    if(group.length===1){ out.push(group[0]); continue; }
    comm=normBase(group[0].pr.name||'');
    keep=null;
    for(j=0;j<group.length;j++){ if(group[j].base===comm) keep=group[j]; }
    if(keep) out.push(keep);
  }
  return out;
}

/* ---- catalog: follow the latest GitHub release for entries that ask for it ---- */
var ghDone={};
function trackLatest(){
  var all=PAYLOADS, i, repos={}, r;
  for(i=0;i<all.length;i++) if(all[i] && all[i].latest && all[i].latest.repo) (repos[all[i].latest.repo]=repos[all[i].latest.repo]||[]).push(all[i]);
  for(r in repos){
    if(!repos.hasOwnProperty(r) || ghDone[r]) continue;
    ghDone[r]=1;
    (function(repo, items){
      ghLatest(repo, function(rel){
        var i, k, a, re, sha, changed=false;
        if(!rel || !rel.assets) return;
        for(i=0;i<items.length;i++){
          try{ re=new RegExp(items[i].latest.asset); }catch(e){ continue; }
          for(k=0;k<rel.assets.length;k++){
            a=rel.assets[k];
            if(!re.test(a.name||'')) continue;
            sha=String(a.digest||'').replace(/^sha256:/,'').toLowerCase();
            if(sha.length!==64 || !a.browser_download_url) break;
            if(sha!==items[i].checksum){
              items[i].checksum=sha; items[i].url=a.browser_download_url;
              items[i].size=a.size|0; items[i].version=String(rel.tag_name||items[i].version).replace(/^v(?=\d)/,'');
              changed=true;
            }
            break;
          }
        }
        if(changed){ if(!currentFolder) showHome(); else if(currentFolder==='mine' || currentFolder==='search' || isCatalogId(currentFolder)) showFolder(currentFolder); }
      });
    })(r, repos[r]);
  }
}
function ghLatest(repo, cb){
  var key='ps5elfs-gh-'+repo, c=null;
  try{ c=JSON.parse(localStorage.getItem(key)||'null'); }catch(e){}
  if(c && c.at && Date.now()-c.at<6*3600*1000 && c.rel){ cb(c.rel); return; }
  fetchCatalogText('https://api.github.com/repos/'+repo+'/releases/latest').then(function(txt){
    var j=JSON.parse(txt), slim={tag_name:j.tag_name,assets:[]}, i;
    for(i=0;j.assets && i<j.assets.length;i++) slim.assets.push({name:j.assets[i].name,size:j.assets[i].size,digest:j.assets[i].digest,browser_download_url:j.assets[i].browser_download_url});

function moveFocus(dir){
  var cur=document.activeElement, list, cr, cx, cy, best=null, bs=1e9, i, r, x, y, dx, dy, main, side, s;
  if(tvOpen() && !modalOpen() && (dir==='ArrowUp' || dir==='ArrowDown')){ var pr=document.getElementById('tvpre'); if(pr) pr.scrollTop+=(dir==='ArrowDown'?1:-1)*Math.round(pr.clientHeight*0.6); return true; }
  list=focusables();

  cr=cur.getBoundingClientRect(); cx=cr.left+cr.width/2; cy=cr.top+cr.height/2;
  for(i=0;i<list.length;i++){
    if(list[i].el===cur) continue;
    r=list[i].r; x=r.left+r.width/2; y=r.top+r.height/2; dx=x-cx; dy=y-cy;
    if(dir==='ArrowRight'){ main=dx; side=Math.abs(dy); if(r.left<cr.right-4) continue; }
    else if(dir==='ArrowLeft'){ main=-dx; side=Math.abs(dy); if(r.right>cr.left+4) continue; }
    else if(dir==='ArrowDown'){ main=dy; side=Math.abs(dx); if(r.top<cr.bottom-4) continue; }
    else { main=-dy; side=Math.abs(dx); if(r.bottom>cr.top+4) continue; }

}

  }).then(function(res){

    cb(res);

}
function xhrUpload(file, q, tries, cb){

    if(x.status===409 && tries>0){ setTimeout(function(){ xhrUpload(file, q, tries-1, cb); }, 1500); return; }
    cb({code:x.status, j:j, t:x.responseText});
  };
  x.onerror=function(){ cb({code:0,j:null,t:''}); };

var PROF=null, profSaveT=0;

function profLoad(cb){

/* ---------- crash watch: a payload gone within a minute of loading ---------- */
var CRW={}, CRW_MS=60000;
function crwNote(name, pid){ if(name && (pid|0)>0) CRW[name]={pid:pid|0, at:Date.now()}; }
function crwForgetPid(pid){ var k; for(k in CRW) if(CRW.hasOwnProperty(k) && CRW[k].pid===(pid|0)) delete CRW[k]; }
function crwForget(name){ delete CRW[name]; }
function crwCheck(procs){
  var alive={}, k, w, i, sec;
  for(i=0;i<procs.length;i++) alive[procs[i].pid|0]=1;
  for(k in CRW){
    if(!CRW.hasOwnProperty(k)) continue;
    w=CRW[k];
    if(Date.now()-w.at>CRW_MS){ delete CRW[k]; continue; }
    if(alive[w.pid]) continue;
    delete CRW[k];
    sec=Math.max(1, Math.round((Date.now()-w.at)/1000));
    evPost('crash', t('crashMsg',{name:k,s:sec}));
    try{ clearPayloadPid(k); forgetActive(k); }catch(e){}
    toastCrash(k, sec);
  }
}
function crwWatching(){ var k; for(k in CRW) if(CRW.hasOwnProperty(k)) return true; return false; }

  o.innerHTML=html; o.className='show';

  return o;
}
function toastHide(){ var o=document.getElementById('toast'); if(o) o.className=''; }
function toastCrash(name, sec){
  var p=null, all=allPayloads(), i, o;
  for(i=0;i<all.length;i++) if(all[i].name===name){ p=all[i]; break; }
  o=toastShow('<s>\u26a0</s><span><b>'+esc(t('crashTitle',{name:name}))+'</b><small>'+esc(t('crashHint',{s:sec}))+'</small></span>'+
    (p?'<button type="button" class="run load" id="toastre">'+esc(t('reload'))+'</button>':'')+'<button type="button" id="toastlog">'+esc(t('evTitle'))+'</button><button type="button" id="toastx" aria-label="close">\u00d7</button>', 15000);

/* ---------- drop / upload into the current PS5 folder ---------- */
function fmCanUpload(){ return isConsoleHost() && !onPs5Browser() && currentFolder==='ps5' && fbWritable(fbSt.dir); }
var upBusy=false;
function fmUploadFiles(files){
  var list=[], i, idx=0, done=0, failed=[];
  if(!fmCanUpload()){ setStatus(t('fmReadOnly')); return; }
  if(upBusy) return;
  for(i=0;files && i<files.length;i++) list.push(files[i]);
  if(!list.length) return;
  upBusy=true;
  var dir=fbSt.dir;
  function next(){
    var f, x;
    if(idx>=list.length){
      upBusy=false; showProgress(false);
      setStatus(failed.length ? t('upPartial',{a:done,b:list.length,names:failed.join(', ')}) : t('upDone',{n:done}));
      if(currentFolder==='ps5' && fbSt.dir===dir) fbBrowse(dir);
      return;
    }
    f=list[idx++];
    setStatus(t('upSending',{name:f.name,i:idx,n:list.length}));
    showProgress(true); setProgressPct(0);
    x=new XMLHttpRequest();
    x.open('POST','/fs/upload?dir='+encodeURIComponent(dir)+'&name='+encodeURIComponent(f.name),true);
    x.setRequestHeader('X-ELFL','1');
    if(x.upload) x.upload.onprogress=function(e){ if(e.lengthComputable) setProgressPct(Math.round(e.loaded*100/e.total)); };
    x.onload=function(){ var j=null; try{ j=JSON.parse(x.responseText); }catch(e){} if(x.status===200 && j && j.ok) done++; else failed.push(f.name+' ('+((j&&j.message)||('HTTP '+x.status))+')'); next(); };
    x.onerror=function(){ failed.push(f.name); next(); };
    x.send(f);
  }
  next();
}
(function(){
  var depth=0;
  function has(ev){ var d=ev.dataTransfer; if(!d || !d.types) return false; for(var i=0;i<d.types.length;i++) if(d.types[i]==='Files') return true; return false; }
  function mark(on){ var m=document.getElementById('main'); if(m){ if(on) m.setAttribute('data-drop', fmCanUpload()?'ok':'no'); else m.removeAttribute('data-drop'); } }
  document.addEventListener('dragenter', function(ev){ if(currentFolder!=='ps5' || !has(ev)) return; depth++; mark(true); ev.preventDefault(); });
  document.addEventListener('dragover', function(ev){ if(currentFolder!=='ps5' || !has(ev)) return; ev.preventDefault(); try{ ev.dataTransfer.dropEffect=fmCanUpload()?'copy':'none'; }catch(e){} });
  document.addEventListener('dragleave', function(){ if(depth>0 && --depth===0) mark(false); });
  document.addEventListener('drop', function(ev){
    if(currentFolder!=='ps5' || !has(ev)) return;
    ev.preventDefault(); depth=0; mark(false);
    fmUploadFiles(ev.dataTransfer.files);
  });
})();
