.lg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-gap:var(--s3);align-items:center;padding:.5rem 0;border-bottom:1px solid var(--edge);font-size:.88rem}

.mlgoto{margin-top:var(--s3);width:100%}
/* banners and dialogs */
#selfupd,#wkupd{display:none;position:fixed;left:50%;top:5.2rem;transform:translateX(-50%);z-index:90;max-width:min(46rem,92vw);padding:.55rem .7rem .55rem 1.1rem;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--deck);border:1px solid var(--amber);border-radius:var(--r);box-shadow:0 .8rem 2rem rgba(60,45,25,.245)}

:focus-visible{outline:none}

/* multi-select: the ELF badge is the checkbox */
.elf.nom.pk:before{display:none}
.pick{grid-area:i;position:relative;display:flex;align-items:center;justify-content:center;width:2.4rem;height:2.4rem;min-height:0;padding:0;font-size:.62rem;font-weight:800;letter-spacing:.06em;color:var(--pri);background:rgba(79,70,229,.12);border:1px solid transparent;border-radius:9px;box-shadow:none}
.pick:after{content:"";position:absolute;top:-4px;right:-4px;width:.85rem;height:.85rem;border-radius:50%;background:var(--deck);border:2px solid var(--edge2)}
.pick:hover,.pick:focus{border-color:var(--pri)}
.pick.on{color:transparent;background:var(--pri);border-color:var(--pri)}
.pick.on:before{content:"";position:absolute;left:50%;top:46%;width:.5rem;height:.95rem;border:solid #fff;border-width:0 .2rem .2rem 0;transform:translate(-50%,-50%) rotate(45deg)}

body[data-sel] main{padding-bottom:6.5rem}

.selq li{display:flex;justify-content:space-between;align-items:center;padding:.35rem .6rem;background:var(--card);border-radius:9px;border-inline-start:3px solid var(--edge2);font-size:.85rem}
.selq li b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;unicode-bidi:isolate}

.selq li[data-st=fail]{border-color:var(--bad)}.selq li[data-st=fail] span{color:var(--bad)}

@media (max-width:860px){#selbar{bottom:.5rem;width:calc(100% - 1rem)}.selrow .seln{flex:1 0 100%}.selrow button{flex:1 1 0;min-width:0;padding-left:.4rem;padding-right:.4rem;white-space:normal;font-size:.84rem;line-height:1.15}.optrow{flex-wrap:wrap}}

function toastNotify(msg){
  try{
    var img=new Image();
    img.src=(isConsoleHost() ? '' : 'http://127.0.0.1:1000')+'/notify?msg='+encodeURIComponent(msg)+'&t='+Date.now();
  }catch(e){}
}

function showProgress(on){
  if(on){
    progWrap.className='show';
    progWrap.setAttribute('aria-hidden','false');
  }else{
    progWrap.className='';
    progWrap.setAttribute('aria-hidden','true');
    progBar.className='';
    progBar.style.width='0%';
  }
}

function setProgressPct(pct){
  progBar.className='';
  if(pct<0){
    progBar.className='indeterminate';
    progBar.style.width='40%';
  }else{
    if(pct>100)pct=100;
    if(pct<0)pct=0;
    progBar.style.width=pct+'%';
  }
}

function folderLabel(id){ return t('f_'+id); }
function countIn(folder){
  var n=0,i;
  for(i=0;i<PAYLOADS.length;i++){var pf=PAYLOADS[i].folder; if(FOLDER_ALIAS.hasOwnProperty(pf)) pf=FOLDER_ALIAS[pf]; if(pf===folder)n++;}
  return n;
}

    var matched=[], placeholders=[], i, pr, pname, pick;
    for(i=0;i<procs.length;i++){
      pr=procs[i];

      if((pr.pid|0)<=0) continue;
      pname=pr.name||'';
      /* Empty comm is not this ELF. Do not attach a random new PID. */
      if(!normBase(pname)) continue;
      if(isProtectedKillName(pname)) continue;
      if(processNameMatches(pname, name)) matched.push(pr);
      else if(isElfldrPlaceholder(pname)) placeholders.push(pr);

    /* Name match wins. payload.elf is only the elfldr stand-in for this send. */
    pick=matched.length ? matched : placeholders;
    if(pick.length){
      pick.sort(function(a,b){ return (b.pid|0)-(a.pid|0); });
      savePayloadPid(name, pick[0].pid);
      dbgInstall('Install OK '+name+' pid='+pick[0].pid+' ('+(pick[0].name||'')+')');

  if(/gdb|klog|shsrv|debug|pager|notify/.test(name)) return 'system';

  if(cat.indexOf('jail')>=0 || cat.indexOf('hen')>=0) return 'loader';
  if(cat.indexOf('system')>=0 || cat.indexOf('power')>=0) return 'system';
  if(cat.indexOf('network')>=0 || cat.indexOf('server')>=0 || cat.indexOf('remote')>=0) return 'files';
  if(cat.indexOf('file')>=0 || cat.indexOf('ftp')>=0) return 'files';
  if(cat.indexOf('stor')>=0 || cat.indexOf('dump')>=0 || cat.indexOf('mount')>=0 || cat.indexOf('game')>=0) return 'storage';

function killByPid(name, pid, sendBtn, path){

  if(path) q+='&path='+encodeURIComponent(path);
  dbgKill('Kill start '+name+' pid='+pid+' path='+(path||''));
  fetch(q).then(function(r){
    return r.json().catch(function(){ return {ok:false,message:'bad json'}; }).then(function(j){
      return {httpOk:r.ok, status:r.status, j:j};
    });
  }).then(function(res){
    var body=(res.j && res.j.message!=null) ? String(res.j.message) : JSON.stringify(res.j);
    if(res.j && res.j.ok){
      clearPayloadPid(name);
      forgetActive(name);
      resetSendBtn(sendBtn);
      hideKillForName(name);
      dbgKill('Kill OK '+name+' pid='+pid+' http='+res.status+' '+body);
      if(currentFolder==='kill') showKillFolder();
      setTimeout(function(){ pollProcs(true); }, 300);
    } else {
      dbgKill('Kill FAIL '+name+' pid='+pid+' http='+res.status+' '+body);
    }
  }).catch(function(err){
    var msg=(err && err.message) ? String(err.message) : String(err);
    if(msg.indexOf('HTTP')===0)
      dbgKill('Kill FAIL '+name+' pid='+pid+' pldmgr '+msg);
    else
      dbgKill('Kill FAIL '+name+' pid='+pid+' fetch/CORS/pldmgr: '+msg);
  });
}
function killPayload(name, sendBtn, path){
  var pr=lastProcs ? findRunningProc(normBase(path||''), lastProcs) : null;
  showModal(t('killConfirm',{name:name,pid:pr?pr.pid:'?'}), t('killHint'), t('killBtn'), function(){ killPayloadNow(name, sendBtn, path); });
}
function killPayloadNow(name, sendBtn, path){
  var base=normBase(path||'');
  dbgKill('Kill pressed '+name+' path='+(path||''));
  if(!path || !base){
    dbgKill('Kill blocked no path '+name);
    return;
  }
  if(isProtectedKillName(name) || isProtectedKillName(base)){
    dbgKill('Kill blocked protected '+name);
    return;
  }
  /* Send uses <img> to :9021 (OK from HTTPS Pages). Kill/PID track need HTTP :1000 same-origin. */
  if(location.protocol==='https:'){
    dbgKill('Kill blocked HTTPS Pages - use HTTP launcher :1000');
    return;
  }
  /* Re-check /processes_list. A saved PID is not enough if that PID was reused. */
  pldmgrFetch('/processes_list').then(function(data){
    var procs=(data && data.processes) ? data.processes : [];
    var pr=findRunningProc(base, procs);
    if(!pr){
      clearPayloadPid(name);
      hideKillForName(name);
      dbgKill('Kill FAIL '+name+' not loaded');
      if(currentFolder==='kill') showKillFolder();
      return;
    }
    dbgKill('Kill confirmed '+name+' path='+path+' pid='+pr.pid+' ('+(pr.name||'')+')');
    killByPid(name, pr.pid, sendBtn, path);
  }).catch(function(err){
    var msg=(err && err.message) ? String(err.message) : String(err);
    if(msg.indexOf('HTTP')===0)
      dbgKill('Kill FAIL '+name+' pldmgr list '+msg);
    else
      dbgKill('Kill FAIL '+name+' fetch/CORS/pldmgr list: '+msg);
  });
}

function isOlderVersion(nextVer, prevVer){
  var n=parseVerParts(nextVer), p=parseVerParts(prevVer);
  if(!n || !p) return false;
  return cmpVerParts(n, p)<0;
}
function knownFileCat(path){
  var m;
  try{ m=JSON.parse(localStorage.getItem('ps5elfs-filecat')||'{}'); }catch(e){ m={}; }
  return (path && m[path]) || null;
}
function rememberFileCat(path, e){
  var m, k;
  if(!path || !e) return;
  try{ m=JSON.parse(localStorage.getItem('ps5elfs-filecat')||'{}'); }catch(e0){ m={}; }
  m[path]={v:String(e.version||''), s:String(e.checksum||e.sha256||'').toLowerCase()};
  try{ localStorage.setItem('ps5elfs-filecat', JSON.stringify(m)); }catch(e1){}
}
function prevCatalogEntry(path, name){
  var i, p, list=catalogBefore && catalogBefore.length ? catalogBefore : null;
  if(!list) return null;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(p && (p.path===path || (name && p.name===name))) return p;
  }
  return null;
}
function wouldDowngrade(catalog, path){
  var kn, prev;
  if(!catalog) return false;
  kn=knownFileCat(path||catalog.path);
  if(kn && kn.v && isOlderVersion(catalog.version, kn.v)) return true;
  prev=prevCatalogEntry(path||catalog.path, catalog.name);
  if(prev && isOlderVersion(catalog.version, prev.version)) return true;
  return false;
}
function needsUpdate(meta, catalog){
  /* Update only when local file already exists, differs from the repo, and the
     repo version is not older than what we already have. */
  if(!catalog || !catalog.checksum) return false;
  if(!meta || !meta.ok || !meta.exists) return false;
  if(wouldDowngrade(catalog, catalog.path)) return false;
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(catalog.checksum||'').toLowerCase();
  if(localSum && localSum.length===64 && catSum.length===64){
    if(localSum===catSum) rememberFileCat(catalog.path, catalog);
    return localSum !== catSum;
  }
  /* Size fallback when sidecar checksum is absent. */
  if(catalog.size && (meta.size|0)>0){
    return (meta.size|0) !== (catalog.size|0);
  }
  return false;
}
function runUpdate(path, catalog, btn, row, verEl){
  if(!catalog || !catalog.url || !catalog.checksum){
    setStatus(t('updMissing'));
    return;
  }
  if(wouldDowngrade(catalog, path)){
    setStatus(t('catalogNoNew'));
    return;
  }
  btn.disabled=true;
  btn.setAttribute('data-state','busy');
  btn.textContent=t('updating');
  setStatus(t('updatingName',{name:catalog.name}));
  showProgress(true);
  setProgressPct(-1);
  var q='/update?path='+encodeURIComponent(path)+
    '&url='+encodeURIComponent(catalog.url)+
    '&sha256='+encodeURIComponent(catalog.checksum);
  if(catalog.size) q+='&size='+encodeURIComponent(String(catalog.size|0));
  fetch(q).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); }).then(function(res){
    showProgress(false);
    if(!res.ok || !res.j || !res.j.ok){
      var msg=(res.j && res.j.message) ? res.j.message : 'update failed';
      setStatus(t('updateFailed',{msg:msg}));
      btn.disabled=false;
      btn.setAttribute('data-state','idle');
      btn.textContent=t('update');
      return;
    }
    setProgressPct(100);
    setStatus(t('updatedName',{name:catalog.name}));
    rememberFileCat(path, catalog);
    pendingUpdates=(pendingUpdates||[]).filter(function(u){ return u.path!==path; });
    paintSideUpdate();
    if(btn.parentNode) btn.parentNode.removeChild(btn);
    if(verEl && verEl.parentNode) verEl.parentNode.removeChild(verEl);
    /* File is still local, so the main button stays Load. */
    if(row){
      var primary=primaryRun(row);
      if(primary) finishPrimary(primary, 'load');
    }
  }).catch(function(e){
    showProgress(false);
    btn.disabled=false;
    btn.setAttribute('data-state','idle');
    btn.textContent=t('update');
    setStatus(t('updateFailed',{msg:(e&&e.message)?e.message:String(e)}));
  });
}

function listLoadedPayloads(procs){
  var raw=[], i, p, base, pr, byPid, k, group, keep, j, comm, out;
  if(!procs) return [];
  for(i=0;i<PAYLOADS.length;i++){
    p=PAYLOADS[i];
    base=elfFileBase(p);
    if(!base || isProtectedKillName(base) || isProtectedKillName(p.name)) continue;
    pr=findRunningProc(base, procs);
    if(!pr) continue;
    raw.push({p:p, pr:pr, base:base});
  }
  byPid={};
  for(i=0;i<raw.length;i++){
    k=String(raw[i].pr.pid|0);
    if(!byPid[k]) byPid[k]=[];
    byPid[k].push(raw[i]);
  }
  out=[];
  for(k in byPid){
    if(!Object.prototype.hasOwnProperty.call(byPid, k)) continue;
    group=byPid[k];
    if(group.length===1){ out.push(group[0]); continue; }
    comm=normBase(group[0].pr.name||'');
    keep=null;
    for(j=0;j<group.length;j++){ if(group[j].base===comm) keep=group[j]; }
    if(keep) out.push(keep);
  }
  return out;
}

/* Folder tiles: the same art, recolored so every folder has its own color. Payload rows keep FOLDER_ICO. */
var FOLDER_TINT={loader:['#a855f7','#7e22ce'],hen:['#ec4899','#be185d'],storage:['#3b82f6','#1d4ed8'],mods:['#22c55e','#15803d'],files:['#f97316','#c2410c'],net:['#14b8a6','#0f766e'],media:['#ef4444','#b91c1c'],system:['#eab308','#a16207'],tools:['#84cc16','#4d7c0f']}, folderTinted={};
function folderTileIco(id){
  var t=FOLDER_TINT[id], s;
  if(!t || folderTinted[id]) return folderTinted[id] || FOLDER_ICO[id];
  try{ s=atob(FOLDER_ICO[id].split(',')[1]).replace(/(id="bg"[^>]*><stop offset="0" stop-color=")[^"]*("\/><stop offset="1" stop-color=")[^"]*/, '$1'+t[0]+'$2'+t[1]); folderTinted[id]='data:image/svg+xml;base64,'+btoa(s); }catch(e){ folderTinted[id]=FOLDER_ICO[id]; }
  return folderTinted[id];
}
function folderIco(id){ return FOLDER_ICO[id] ? '<img class="fico" alt="" src="'+folderTileIco(id)+'">' : ''; }
/* Loaded and My files: extra folder tiles, only on the console and only when not empty.
   Loaded = catalog/My files payloads that /processes_list shows running (same
   rule as the Loaded badge on rows), plus any other killable user ELF. */
function loadedPayloads(){
  var out=[], all=allPayloads(), i, p, b, seen={};
  if(!isConsoleHost() || !lastProcs) return out;
  for(i=0;i<all.length;i++){
    p=all[i]; b=elfFileBase(p);
    if(!b || seen[b] || isProtectedKillName(p.name) || isProtectedKillName(p.path)) continue;
    if(payloadIsRunning(b, lastProcs)){ seen[b]=1; out.push(p); }
  }
  return out;
}
function loadedOther(){
  var out=[], list, i, j, pr, hit, mine=loadedPayloads(), pids={};
  if(!isConsoleHost() || !lastProcs) return out;
  for(j=0;j<mine.length;j++){ pr=findRunningProc(elfFileBase(mine[j]), lastProcs); if(pr) pids[pr.pid|0]=1; }
  list=userProcs(lastProcs);
  for(i=0;i<list.length;i++){
    pr=list[i];
    if(pr.self || !killable(pr) || pids[pr.pid|0]) continue;
    hit=false;
    for(j=0;j<mine.length && !hit;j++) if(processNameMatches(pr.name, elfFileBase(mine[j]))) hit=true;
    if(!hit) out.push(pr);
  }
  return out;
}
/* Kill button for a Loaded row: the live pid from /processes_list; never the launcher or elfldr. */
function loadedKillHtml(p){
  var pr=lastProcs ? findRunningProc(elfFileBase(p), lastProcs) : null;
  if(!pr || pr.self || !killable(pr) || isProtectedKillName(p.name) || isProtectedKillName(p.path)) return '';
  return '<button type="button" class="run kill" data-pid="'+(pr.pid|0)+'" data-pname="'+esc(pr.name||p.name)+'">'+esc(t('killBtn'))+'</button>';
}
function loadedCount(){ return loadedPayloads().length+loadedOther().length; }
function loadedOtherHtml(){

}

  return '<button type="button" class="subfold hasico'+(selected===id?' active':'')+'" data-sub="'+id+'"><i class="fico">'+icon(id==='loaded'?'run':'ps5')+'</i><span>'+esc(folderLabel(id))+'</span><span class="ncount">'+n+'</span></button>';
}
/* Repaint the folder tiles (and the Loaded list) when what is loaded changes. */
var loadedSig='';
function loadedSigNow(){
  var a=loadedPayloads().map(function(p){ return p.name; }), b=loadedOther().map(function(p){ return p.pid; });
  return a.join('|')+'#'+b.join('|')+'#'+LOCAL_PAYLOADS.length;
}
function repaintFoldTiles(){
  var boxes=document.querySelectorAll('.foldgrid,.catchips'), i, el, tmp, sel, home;
  for(i=0;i<boxes.length;i++){
    el=boxes[i]; home=el.className==='catchips';
    sel=home ? '' : (currentFolder||'');
    tmp=document.createElement('div');
    tmp.innerHTML=home ? catChipsHtml() : folderChipsHtml(sel);
    tmp=tmp.firstChild;
    if(!tmp || tmp.innerHTML===el.innerHTML) continue;
    if(document.activeElement && el.contains(document.activeElement)) continue; /* never yank D-pad focus */
    el.parentNode.replaceChild(tmp, el);
    (function(box, isHome){
      var b=box.querySelectorAll('.subfold'), j;
      for(j=0;j<b.length;j++) b[j].onclick=function(){ var sid=this.getAttribute('data-sub'); if(!sid) return; if(isHome) goFolder(sid); else { setHashFolder(sid); showFolder(sid); } };
    })(tmp, home);
  }
}
function loadedChanged(){
  var sig=loadedSigNow();
  if(sig===loadedSig) return;
  loadedSig=sig;
  if(currentFolder==='loaded'){
    var f=document.activeElement, keep=f && f.getAttribute ? (f.closest && f.closest('[data-name]') ? f.closest('[data-name]').getAttribute('data-name') : '') : '';
    showFolder('loaded'); renderNav('loaded');
    if(keep){ var r=viewEl.querySelector('[data-name="'+keep.replace(/"/g,'')+'"] button.run'); if(r) try{ r.focus(); }catch(e){} }
    else { var first=viewEl.querySelector('#view .listgrid button.run, .listgrid button.run'); if(f && f!==document.body && !document.body.contains(f) && first) try{ first.focus(); }catch(e){} }
    return;
  }
  if(currentFolder==='local' && !(document.activeElement && viewEl.contains(document.activeElement) && document.activeElement.closest('.listgrid'))){ showFolder('local'); return; }
  repaintFoldTiles();
  renderNav(currentFolder||'');
}
function folderChipsHtml(selected){

  for(i=0;i<FOLDERS.length;i++){

  }

}

}
/* Saved files are whatever /file_meta says exists under /data/elf-launcher/mirror.
   Each row can Load (send to elfldr) or Delete the file from disk. */
function pendingFor(path){
  var i;
  for(i=0;i<(pendingUpdates||[]).length;i++){ if(pendingUpdates[i].path===path) return pendingUpdates[i]; }
  return null;
}
function paintDownloaded(found){
  var html, i, item, p, pend;
  noteDownloadedCount(found.length);
  if(currentFolder!=='downloaded') return;
  html='';
  if(!found.length){
    syncSideActions('');
    viewEl.innerHTML=html+'<p class="empty">'+esc(t('noSaved'))+'</p>';
    bindSubfolds();
    return;
  }
  syncSideActions('');
  setHdrActions('');
  html+=headHtml(true);
  for(i=0;i<found.length;i++){
    item=found[i];
    p=item.p;
    pend=pendingFor(p.path);
    html+='<div class="elfwrap" data-path="'+esc(p.path)+'" data-name="'+esc(p.name)+'"><div class="elf nom pk cat">'+pickBtn('cat:'+p.path,0,0,iconFor(p),FOLDER_ICO[p.folder])+pinBtnHtml(p.name);
    html+='<div class="n">'+nameHtml(p)+'</div>';
    html+='<div class="v">'+esc(p.version||'')+'</div>';
    html+='<div class="a">';
    html+='<button type="button" class="run" data-state="load">\u2026</button>';
    if(pend) html+='<button type="button" class="run update" data-state="idle" title="'+esc(t('catalogVersion')+' '+updateVerLabel(pend.entry))+'">'+esc(t('update'))+'</button>';
    html+='<button type="button" class="run del">'+esc(t('del'))+'</button>';
    html+='</div>';
    html+='</div></div>';
  }
  viewEl.innerHTML=html;
  finishListView();
  bindSubfolds();
  bindRows(viewEl, false);
  var dels=viewEl.querySelectorAll('button.run.del');
  var di;
  for(di=0;di<dels.length;di++){
    dels[di].addEventListener('click',function(ev){
      var node=ev.currentTarget;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(!node) return;
      deleteDownloaded(node.getAttribute('data-name'), node.getAttribute('data-path'), node);
    });
  }
  var ups=viewEl.querySelectorAll('button.run.update');
  for(di=0;di<ups.length;di++){
    ups[di].addEventListener('click',function(ev){
      var b=ev.currentTarget, node=b, pd;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(!node) return;
      pd=pendingFor(node.getAttribute('data-path'));
      if(pd) runUpdate(pd.path, pd.entry, b, null, null);
    });
  }
  var loadBtn=document.getElementById('loadsel');
  if(loadBtn) loadBtn.onclick=function(){
    var marks=viewEl.querySelectorAll('input.mark'), queue=[], k, node;
    for(k=0;k<marks.length;k++){
      if(!marks[k].checked) continue;
      node=marks[k].parentNode;
      while(node && (!node.getAttribute || !node.getAttribute('data-path'))) node=node.parentNode;
      if(node) queue.push({name:node.getAttribute('data-name'), path:node.getAttribute('data-path')});
    }
    if(!queue.length){ setStatus(t('markFirst')); return; }
    var n=0, ok=0;
    loadBtn.disabled=true;
    function next(){
      if(n>=queue.length){ loadBtn.disabled=false; setStatus(t('loadedN',{n:ok})); return; }
      var it=queue[n++], cat=findPayload(it.path);
      sendPayload(it.name, it.path, (cat&&cat.url)||it.path, function(res){
        if(res!==false) ok++;
        setTimeout(next, 600);
      });
    }
    next();
  };
}
function showDownloadedFolderCount(){
  var queue, n, inflight, idx;
  if(!isConsoleHost() || !PAYLOADS || !PAYLOADS.length) return;
  queue=allPayloads();
  n=0; inflight=0; idx=0;

function bindRows(box, markOnly){
  var i, onPs5=/PlayStation/i.test(navigator.userAgent);
  if(!box) return;
  var rows=box.querySelectorAll('[data-path]');
  for(i=0;i<rows.length;i++){
    (function(tr){
      var btn=primaryRun(tr);
      if(!btn) return;
      finishPrimary(btn, btn.getAttribute('data-state')||'unknown');
      btn.addEventListener('click',function(){
        var path=tr.getAttribute('data-path');
        var name=tr.getAttribute('data-name');
        var meta=findPayload(path);
        var state=btn.getAttribute('data-state')||'';
        var fileUrl=(meta&&meta.url)?meta.url:path;
        if(state==='unknown' || state==='busy') return;
        btn.disabled=true;
        startBar(btn);
        showProgress(true);
        setProgressPct(-1);
        if(!isConsoleHost()){
          if(onPs5){
            sendPayload(name, path, fileUrl, function(ok){
              setProgressPct(100);
              showProgress(false);
              endBar(btn, ok===false?'fail':'loaded', name);
            });
            return;
          }
          setStatus(t('downloadingName',{name:name}));
          fetch(fileUrl).then(function(r){
            if(!r.ok)throw new Error('HTTP '+r.status);
            return r.blob();
          }).then(function(blob){
            var u=URL.createObjectURL(blob);
            var a=document.createElement('a');
            a.href=u;
            a.download=name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function(){URL.revokeObjectURL(u);},1500);
            setProgressPct(100);
            showProgress(false);
            setStatus(t('downloadedFtp',{name:name}));
            endBar(btn, 'downloaded', null);
          }).catch(function(e){
            showProgress(false);
            finishPrimary(btn, 'download');
            setStatus(t('downloadFailed',{msg:(e&&e.message)?e.message:String(e)}));
          });
          return;
        }
        if(state==='download'){
          setStatus(t('downloadingName',{name:name}));
          downloadToFolder(path, meta).then(function(){
            setProgressPct(100);
            showProgress(false);
            finishPrimary(btn, 'load');
            if(downloadedCountKnown) downloadedCount++;
            renderNav(currentFolder);
            setStatus(t('downloadedName',{name:name}));
          }).catch(function(e){
            showProgress(false);
            finishPrimary(btn, 'download');
            setStatus(t('downloadFailed',{msg:(e&&e.message)?e.message:String(e)}));
          });
          return;
        }
        if(state!=='load' && state!=='loaded'){
          showProgress(false);
          finishPrimary(btn, state);
          return;
        }
        sendPayload(name, path, fileUrl, function(ok){
          setProgressPct(100);
          showProgress(false);
          /* File is still on disk. Stay on Load, do not flip back to Download. */
          if(ok!==false) rememberActive(name);
          finishPrimary(btn, (ok!==false)?'loaded':'load');
        });
      });
      if(isConsoleHost() && !markOnly){
        (function(tr0, path0){
          var meta0=findPayload(path0);
          var btn0=primaryRun(tr0);
          localMeta(path0).then(function(meta){
            var exists=!!(meta && meta.ok && meta.exists);
            if(!exists){
              finishPrimary(btn0, 'download');
              setAutoBox(tr0, false);
              return;
            }
            finishPrimary(btn0, (lastProcs && payloadIsRunning(rowFileBase(tr0), lastProcs)) ? 'loaded' : 'load');
            paintPayloadButton(tr0);
            setAutoBox(tr0, true);
            if(!canUseUpdateApi() || !meta0 || !meta0.checksum || !meta0.url) return;
            if(!needsUpdate(meta, meta0)) return;
            var act=tr0.querySelector('div.a');
            if(!act || tr0.querySelector('button.run.update')) return;
            var ub=document.createElement('button');
            ub.type='button';
            ub.className='run update';
            ub.setAttribute('data-state','idle');
            ub.textContent=t('update');
            var uvt=updateVerLabel(meta0);
            if(uvt) ub.title=t('catalogVersion')+' '+uvt;
            ub.addEventListener('click',function(){
              runUpdate(path0, meta0, ub, tr0, null);
            });
            act.insertBefore(ub, act.firstChild);
          }).catch(function(){
            /* Unknown disk state: do not show Download or Load. */
            finishPrimary(btn0, 'unknown');
          });
        })(tr, tr.getAttribute('data-path'));
      }
    })(rows[i]);
  }
}

  else if(/Windows NT/.test(ua)){ model='PC'; ver='Windows'; }
  else if((m=ua.match(/Mac OS X ([0-9_]+)/))){ model='Mac'; ver=m[1].replace(/_/g,'.'); }

function findLocalIp(){
  var RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection||window.mozRTCPeerConnection;
  var el=document.getElementById('deviceip');
  if(!RTC){ if(el && el.getAttribute('data-state')!=='ip'){ el.setAttribute('data-state','unavailable'); el.textContent=t('unavailable'); } return; }
  var found=false;
  function show(ip){
    if(found||!privateIp(ip)) return;
    found=true;
    showDeviceIp(ip);
  }
  function hit(text){
    if(found||!text) return;
    var re=/(\d+\.\d+\.\d+\.\d+)/g, m;
    while((m=re.exec(String(text)))) show(m[1]);
  }
  function open(opts){
    var pc;
    try{ pc=opts?new RTC(opts):new RTC(); }catch(err){ return null; }
    try{ pc.createDataChannel(''); }catch(err2){}
    pc.onicecandidate=function(e){
      if(!e||!e.candidate) return;
      hit(e.candidate.candidate||'');
      if(e.candidate.address) hit(e.candidate.address);
    };
    function offerOk(o){
      hit(o&&o.sdp);
      try{
        var p=pc.setLocalDescription(o);
        if(p&&p.then) p.then(function(){ hit(pc.localDescription&&pc.localDescription.sdp); });
      }catch(err3){
        try{ pc.setLocalDescription(o, function(){ hit(pc.localDescription&&pc.localDescription.sdp); }, function(){}); }catch(err4){}
      }
    }
    try{
      pc.createOffer(offerOk, function(){}, {offerToReceiveAudio:true});
    }catch(err5){
      try{
        var made=pc.createOffer();
        if(made&&made.then) made.then(offerOk).catch(function(){});
      }catch(err6){}
    }
    return pc;
  }
  var pcs=[];
  var a=open({iceServers:[]});
  if(a) pcs.push(a);
  setTimeout(function(){
    if(found) return;
    var b=open({iceServers:[{url:'stun:stun.l.google.com:19302'}]});
    if(b) pcs.push(b);
  }, 600);
  setTimeout(function(){
    var i;
    if(!found&&el&&el.getAttribute('data-state')==='looking'){ el.setAttribute('data-state','unavailable'); el.textContent=t('unavailable'); }
    for(i=0;i<pcs.length;i++){ try{ pcs[i].close(); }catch(err7){} }
  }, 5000);
}

function cmpSemver(a,b){
  function parts(v){
    v=String(v||'').replace(/^[vV]/,'').replace(/^\s+|\s+$/g,'');
    var m=v.match(/^(\d+)(?:\.(\d+))?(?:\.(\d+))?/);
    if(!m) return [0,0,0];
    return [parseInt(m[1],10)||0, parseInt(m[2],10)||0, parseInt(m[3],10)||0];
  }
  var A=parts(a), B=parts(b), i;
  for(i=0;i<3;i++){ if(A[i]>B[i]) return 1; if(A[i]<B[i]) return -1; }
  return 0;
}

}

function pickLauncherCatalogEntry(list){
  var i, p, fn;
  for(i=0;i<(list||[]).length;i++){
    p=list[i]||{};
    fn=String(p.filename||p.name||'').split('/').pop().toLowerCase();
    if(fn==='elf-launcher.elf') return p;
  }
  return null;
}
function betterSelfInfo(a, b){
  if(!a) return b;
  if(!b) return a;
  var c=cmpSemver(a.version, b.version);
  if(c>0) return a;
  if(c<0) return b;
  if(a.checksum && !b.checksum) return a;
  if(b.checksum && !a.checksum) return b;
  return a;
}
/* Catalog tip (repo raw first, then Pages) + GitHub Releases latest. */
function checkSelfUpdate(){
  var pending=3, best=null;
  function doneOne(){
    var dismissed='';
    pending--;
    if(pending>0) return;
    if(!best || cmpSemver(best.version, APP_VERSION)<=0){ hideSelfUpdateBanner(); return; }
    try{ dismissed=localStorage.getItem(SELFUPD_DISMISS_KEY)||''; }catch(e){}
    if(dismissed && cmpSemver(dismissed, best.version)>=0){ hideSelfUpdateBanner(); return; }
    showSelfUpdateBanner(best);
  }
  function takeCatalog(text){
    var j, list, ent, ver, sum;
    try{ j=JSON.parse(text); }catch(e){ doneOne(); return; }
    list=(j && j.payloads) ? j.payloads : (Array.isArray(j)?j:[]);
    ent=pickLauncherCatalogEntry(list);
    ver=String((ent && ent.version) || (j && (j.app_version||j.launcher_version)) || '').replace(/^\s+|\s+$/g,'');
    sum=String((ent && (ent.checksum||ent.sha256)) || '').toLowerCase();
    if(ver && cmpSemver(ver, APP_VERSION)>0){
      best=betterSelfInfo(best, {
        version:ver,
        url:SELFUPD_REPO_ELF,
        checksum:sum,
        size:(ent && ent.size)|0,
        path:'mirror/elf-launcher.elf',
        name:'elf-launcher.elf',
        source:'catalog'
      });
    }
    doneOne();
  }
  function takeGh(text){
    var j, tag, assets, i, a, url='', size=0, name='elf-launcher.elf';
    try{ j=JSON.parse(text); }catch(e){ doneOne(); return; }
    if(!j || j.draft){ doneOne(); return; }
    tag=String(j.tag_name||j.name||'').replace(/^[vV]/,'').replace(/^\s+|\s+$/g,'');
    assets=j.assets||[];
    for(i=0;i<assets.length;i++){
      a=assets[i]||{};
      if(String(a.name||'').toLowerCase()==='elf-launcher.elf'){
        url=a.browser_download_url||'';
        size=a.size|0;
        name=a.name||name;
        break;
      }
    }
    if(!url) url=SELFUPD_REPO_ELF;
    if(tag && cmpSemver(tag, APP_VERSION)>0){
      best=betterSelfInfo(best, {
        version:tag,
        url:url||SELFUPD_REPO_ELF,
        checksum:'',
        size:size,
        path:'mirror/'+name,
        name:name,
        source:'github'
      });
    }
    doneOne();
  }
  fetchCatalogText('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/payloads.json')
    .then(takeCatalog).catch(doneOne);
  fetchCatalogText('https://x-f1reball-x.github.io/elf-launcher/payloads.json')
    .then(takeCatalog).catch(doneOne);
  fetchCatalogText(SELFUPD_GH_RELEASES).then(takeGh).catch(doneOne);
}
function downloadSelfUpdate(){
  if(!selfUpdateInfo || !selfUpdateInfo.url){
    setStatus(t('selfUpdateFail',{msg:'missing url'}));
    return;
  }
  var info=selfUpdateInfo;
  var btn=document.getElementById('selfupddl');
  /* Prefer repo tip binary; keep release asset URL if that is what won. */
  if(info.source!=='github' || !info.url){
    info.url=SELFUPD_REPO_ELF;
  }
  info.path='mirror/elf-launcher.elf';
  info.name='elf-launcher.elf';
  if(btn){ btn.disabled=true; }
  setStatus(t('selfUpdating',{ver:info.version}));
  function fail(e){
    if(btn) btn.disabled=false;
    setStatus(t('selfUpdateFail',{msg:(e&&e.message)?e.message:String(e)}));
  }
  function ok(){
    setStatus(t('selfUpdated',{ver:info.version}));
    hideSelfUpdateBanner();
    try{ localStorage.setItem(SELFUPD_DISMISS_KEY, String(info.version)); }catch(e){}
    if(btn) btn.disabled=false;
  }
  if(isConsoleHost() && info.checksum && info.checksum.length===64){
    downloadToFolder(info.path, {
      url:info.url, checksum:info.checksum, size:info.size, name:info.name
    }).then(function(){
      setStatus(t('selfUpdated',{ver:info.version}));
      hideSelfUpdateBanner();
      try{ localStorage.setItem(SELFUPD_DISMISS_KEY, String(info.version)); }catch(e){}
      selfHandoff(btn);
    }).catch(fail);
    return;
  }
  if(/PlayStation/i.test(navigator.userAgent)){
    sendPayload(info.name, null, info.url, function(okSend){
      if(okSend) ok(); else fail(new Error('elfldr rejected'));
    });
    return;
  }
  try{ window.open(info.url, '_blank'); }catch(e2){}
  ok();
}

function wkInstalledVer(){

function paintWkUpd(){

  if(!wkUpdInfo) return;
  if(txt && !wkUpdInfo.busy) txt.textContent=t('wkUpd',{ver:wkUpdInfo.version});

function hideWkUpd(){ var b=document.getElementById('wkupd'); if(b) b.classList.remove('show'); }
function checkWkUpdate(){
  if(!isConsoleHost()) return;
  var cur=wkInstalledVer();
  fetchCatalogText(WKUPD_GH).then(function(text){
    var j, tag, assets, i, a, url='', sha='', size=0, dis='';
    try{ j=JSON.parse(text); }catch(e){ return; }
    if(!j || j.draft || j.prerelease) return;
    tag=String(j.tag_name||j.name||'').replace(/^[vV]/,'').replace(/^\s+|\s+$/g,'');
    if(!tag) return;
    if(cur && cmpSemver(tag, cur)<=0) return;
    try{ dis=localStorage.getItem(WKUPD_DISMISS_KEY)||''; }catch(e2){}
    if(dis && cmpSemver(dis, tag)>=0) return;
    assets=j.assets||[];

      if(String(a.name||'').toLowerCase()===WKUPD_DISK){ url=a.browser_download_url||''; sha=String(a.digest||'').replace(/^sha256:/i,'').toLowerCase(); size=a.size|0; break; }
    }
    if(!url || sha.length!==64) return;
    wkUpdInfo={version:tag,url:url,sha256:sha,size:size};

    var b=document.getElementById('wkupd'); if(b) b.classList.add('show');

function installWkUpdate(){
  var info=wkUpdInfo; if(!info || info.busy) return;
  var txt=document.getElementById('wkupdtxt'), dl=document.getElementById('wkupddl'), dx=document.getElementById('wkupdx');
  function fail(e){

    if(dl) dl.disabled=false; if(dx) dx.disabled=false;
    if(txt) txt.textContent=t('wkUpdFail',{msg:(e&&e.message)?e.message:String(e)});
  }
  info.busy=true;
  if(dl) dl.disabled=true; if(dx) dx.disabled=true;
  if(txt) txt.textContent=t('wkUpdInstalling',{ver:info.version});
  var q='/update?path='+encodeURIComponent(WKUPD_DISK)+'&url='+encodeURIComponent(info.url)+
    '&sha256='+encodeURIComponent(info.sha256)+(info.size?('&size='+(info.size|0)):'');
  fetch(q,{cache:'no-store'}).then(function(r){
    return r.json().then(function(j){ return {ok:r.ok,j:j}; });
  }).then(function(u){
    if(!u.ok || !(u.j && u.j.ok)) throw new Error((u.j && (u.j.message||u.j.error))||'download failed');

/* Server answers -> text in the page language. */
function sendErrText(code, j, txt){
  var m=(j && j.elfldr_msg) || '';
  if(!m && txt && /^elfldr rejected the file: /.test(txt)) m=txt.replace(/^elfldr rejected the file: /,'');
  if(code===409) return t('errBusy');
  if(code===503) return t('errLoader');
  if(code===502) return t('errRejected')+(m?' ('+m+')':'');
  if(code===415) return t('badMagic');
  if(code===404) return t('errMissing');
  if(code===403) return t('errBlocked');
  if(code===413) return t('tooBig');
  if(code===-1) return t('errTimeout');
  if(code===0) return t('errNetwork');
  return (j && j.message) || txt || ('HTTP '+code);
}

/* Files kept from uploads live in mirror/ but are not in the catalog. */
function refreshLocalFiles(cb){
  var fin=function(){ if(cb){ var c=cb; cb=null; try{ c(); }catch(e){} } };
  if(!isConsoleHost()){ fin(); return; }
  fetch('/browse?dir='+encodeURIComponent('/data/elf-launcher/mirror')).then(function(r){ return r.json(); }).then(function(j){
    var known={}, i, f, list=[], q, k;
    /* A file that is a copy of a catalog payload (same name in any case, same
       product id or title, same sha256) belongs to that tile, not its own. */
    for(i=0;i<PAYLOADS.length;i++){
      q=PAYLOADS[i];
      known['n:'+String(q.path||'').split('/').pop().toLowerCase()]=1;
      known['n:'+String(q.name||'').toLowerCase()]=1;
      k=prodKey(q.path||q.name); if(k) known['p:'+k]=1;
      k=prodKey(displayName(q)); if(k) known['p:'+k]=1;
      if(q.checksum) known['s:'+String(q.checksum).toLowerCase()]=1;
    }
    for(i=0;j && j.files && i<j.files.length;i++){
      f=j.files[i];
      if(f.ok===false || isProtectedKillName(f.name)) continue;
      if(known['n:'+String(f.name).toLowerCase()] || known['p:'+prodKey(f.name)] || (f.sha256 && known['s:'+String(f.sha256).toLowerCase()])) continue;
      list.push({name:f.name,path:'mirror/'+f.name,version:'',folder:'local',info:'',local:true,size:f.size});
    }
    LOCAL_PAYLOADS=list;
    loadedChanged();
    fin();
  }).catch(fin);
  setTimeout(fin, 4000);
}

    seen[pins[i]]=1; out.push(byName[pins[i]]);
  }
  dl=[];
  for(n in DL_SET){ /* then every downloaded payload, sorted by name, no cap */
    if(!DL_SET.hasOwnProperty(n) || seen[n] || !byName[n] || isProtectedKillName(n)) continue;
    seen[n]=1; dl.push(byName[n]);
  }
  dl.sort(function(a,b){ var an=String(a.name||'').toLowerCase(), bn=String(b.name||'').toLowerCase(); return an<bn?-1:(an>bn?1:0); });
  for(i=0;i<dl.length;i++) out.push(dl[i]);
  return out;
}

var GH_LATEST_WAIT_MS=9000;
function applyLatest(list, done, force){
  var i, repos={}, r, keys=[], pending=1, finished=false, timer;
  function settle(){ if(finished) return; finished=true; if(timer) clearTimeout(timer); if(done) done(list); }
  function one(){ pending--; if(pending<=0) settle(); }
  for(i=0;list && i<list.length;i++) if(list[i] && list[i].latest && list[i].latest.repo) (repos[list[i].latest.repo]=repos[list[i].latest.repo]||[]).push(list[i]);
  /* Oldest-cached repos first, so the per-load budget rotates through the catalog. */
  for(r in repos) if(repos.hasOwnProperty(r)) keys.push(r);
  keys.sort(function(a,b){ var x=ghCached(a), y=ghCached(b); return ((x&&x.at)||0)-((y&&y.at)||0); });
  for(i=0;i<keys.length;i++){
    pending++;
    (function(items){
      ghLatest(items[0].latest.repo, function(rel){ if(!finished){ applyBestReleases(items, rel); applyRepoStars(items, items[0].latest.repo); } one(); }, force);
    })(repos[keys[i]]);
  }
  timer=setTimeout(settle, force ? 60000 : GH_LATEST_WAIT_MS);
  one();
}
function applyRelease(items, rel){
  var i, k, a, re, sha;
  if(!rel || !rel.assets) return;
  for(i=0;i<items.length;i++){
    try{ re=new RegExp(items[i].latest.asset); }catch(e){ continue; }
    for(k=0;k<rel.assets.length;k++){
      a=rel.assets[k];
      if(!re.test(a.name||'')) continue;
      sha=String(a.digest||'').replace(/^sha256:/,'').toLowerCase();
      items[i].download_count=a.download_count|0;
      if(sha.length!==64 || !a.browser_download_url) break;
      if(!releaseIsNewer(rel.tag_name, items[i].version)) break;
      if(sha!==String(items[i].checksum||'').toLowerCase()){
        items[i].checksum=sha; items[i].sha256=sha; items[i].url=a.browser_download_url;
        items[i].size=a.size|0; items[i].version=String(rel.tag_name||items[i].version).replace(/^v(?=\d)/,'');
      }
      break;
    }
  }
}
var GH_TTL_MS=6*3600*1000, GH_FORCE_NEXT=false;
function resetGhForUpdate(){
  GH_FORCE_NEXT=true;
  GH_LOAD_BUDGET=40;
  try{ localStorage.removeItem(GH_BACKOFF_KEY); }catch(e){}
}
function releaseIsNewer(relTag, curVer){
  return cmpVerParts(parseVerParts(relTag), parseVerParts(curVer))>0;
}
function ghRelList(rel){
  if(!rel) return [];
  if(Object.prototype.toString.call(rel)==='[object Array]') return rel;
  if(rel.tag_name) return [rel];
  return [];
}
function pickNewerRelease(rels, item){
  var i, k, a, re, best=null, cur;
  if(!rels || !rels.length || !item || !item.latest) return null;
  try{ re=new RegExp(item.latest.asset); }catch(e){ return null; }
  cur=item.version;
  for(i=0;i<rels.length;i++){
    var rel=rels[i];
    if(!rel || rel.draft || !rel.tag_name || !rel.assets) continue;
    if(!releaseIsNewer(rel.tag_name, cur)) continue;
    for(k=0;k<rel.assets.length;k++){
      a=rel.assets[k];
      if(!re.test(a.name||'')) continue;
      if(!best || cmpVerParts(parseVerParts(rel.tag_name), parseVerParts(best.tag_name))>0) best=rel;
      break;
    }
  }
  return best;
}
function applyDownloadCounts(item, rels){
  var i, k, a, re, best=null;
  if(!item || !item.latest || !rels) return;
  try{ re=new RegExp(item.latest.asset); }catch(e){ return; }
  for(i=0;i<rels.length;i++){
    var rel=rels[i];
    if(!rel || !rel.assets) continue;
    for(k=0;k<rel.assets.length;k++){
      a=rel.assets[k];
      if(!re.test(a.name||'')) continue;
      if(!best || (a.download_count|0)>=(best.download_count|0)) best=a;
      break;
    }
  }
  if(best) item.download_count=best.download_count|0;
}
function applyBestReleases(items, rels){
  var i, rel;
  rels=ghRelList(rels);
  for(i=0;i<(items||[]).length;i++){
    rel=pickNewerRelease(rels, items[i]);
    if(rel) applyRelease([items[i]], rel);
    applyDownloadCounts(items[i], rels);
  }
}

/* The catalog is kept fresh by the daily catalog-sync action, so the app only tops up:
   at most GH_LOAD_BUDGET API calls per page load, none for 6 h after a 403/429. */
var GH_LOAD_BUDGET=20, GH_BACKOFF_KEY='ps5elfs-gh-backoff', ghActive=0, ghQueue=[];
/* At most 3 requests at once, so a 403/429 stops the rest of the queue. */
function ghPump(){ while(ghActive<3 && ghQueue.length){ ghActive++; ghQueue.shift()(function(){ ghActive--; ghPump(); }); } }
function ghBackedOff(){ var u=0; try{ u=+localStorage.getItem(GH_BACKOFF_KEY)||0; }catch(e){} return u>Date.now() && u-Date.now()<=GH_TTL_MS; }
function ghCached(repo){ var c=null; try{ c=JSON.parse(localStorage.getItem('ps5elfs-gh-'+repo)||'null'); }catch(e){} return (c && (c.list || c.rel)) ? c : null; }
function ghCachedList(c){
  if(!c) return [];
  if(c.list && c.list.length) return c.list;
  if(Object.prototype.toString.call(c.rel)==='[object Array]') return c.rel;
  if(c.rel && c.rel.tag_name) return [c.rel];
  return [];
}
function ghLatest(repo, cb, force){
  var key='ps5elfs-gh-'+repo, c=ghCached(repo);
  if(!force && c && c.at && Date.now()-c.at>=0 && Date.now()-c.at<GH_TTL_MS){ cb(force?ghCachedList(c):(c.rel||ghCachedList(c)[0]||null)); return; }
  if(ghInflight[repo]){ ghInflight[repo].push(cb); return; }
  if(!force && (GH_LOAD_BUDGET<=0 || ghBackedOff())){ cb(c ? (c.rel||ghCachedList(c)[0]||null) : null); return; }
  if(!force) GH_LOAD_BUDGET--;
  ghInflight[repo]=[cb];
  function finish(rel){ var w=ghInflight[repo]||[], i; delete ghInflight[repo]; for(i=0;i<w.length;i++) try{ w[i](rel); }catch(e){} }
  var api=force
    ? 'https://api.github.com/repos/'+repo+'/releases?per_page=15'
    : 'https://api.github.com/repos/'+repo+'/releases/latest';
  ghQueue.push(function(release){
    if(!force && ghBackedOff()){ release(); finish(c ? (c.rel||ghCachedList(c)[0]||null) : null); return; }
    fetchCatalogText(api).then(function(txt){
      var data=JSON.parse(txt), list, slim=[], i, j, jrel, one;
      list=Object.prototype.toString.call(data)==='[object Array]' ? data : (data && data.tag_name ? [data] : []);
      for(i=0;i<list.length;i++){
        jrel=list[i];
        if(!jrel || !jrel.tag_name || !jrel.assets || jrel.draft) continue;
        one={tag_name:jrel.tag_name, prerelease:!!jrel.prerelease, assets:[]};
        for(j=0;j<jrel.assets.length;j++){
          one.assets.push({name:jrel.assets[j].name,size:jrel.assets[j].size,digest:jrel.assets[j].digest,browser_download_url:jrel.assets[j].browser_download_url,download_count:jrel.assets[j].download_count|0});
        }
        slim.push(one);
      }
      function saveStars(stars){ try{ localStorage.setItem(key, JSON.stringify({at:Date.now(),rel:slim[0]||null,list:slim,stars:stars|0})); }catch(e){} release(); finish(force ? slim : (slim[0]||null)); }
      var prevStars=c && (c.stars|0);
      fetchCatalogText('https://api.github.com/repos/'+repo).then(function(rt){ var rj=JSON.parse(rt); saveStars(rj && rj.stargazers_count); }).catch(function(){ saveStars(prevStars); });
    }).catch(function(e){
      if(/\b(403|429)\b|rate limit/i.test(String(e && e.message))) try{ localStorage.setItem(GH_BACKOFF_KEY, String(Date.now()+GH_TTL_MS)); }catch(x){}
      var k=ghCached(repo); release(); finish(force ? ghCachedList(k) : (k && (k.rel||ghCachedList(k)[0]) || null));
    });
  });
  ghPump();
}
function latestRepos(list){ var r={}, i; for(i=0;list && i<list.length;i++) if(list[i] && list[i].latest && list[i].latest.repo) (r[list[i].latest.repo]=r[list[i].latest.repo]||[]).push(list[i]); return r; }
/* Last known releases, applied right away (no network). */
function applyRepoStars(items, repo){
  var c=ghCached(repo), s=(c && (c.stars|0)) || 0, i;
  if(!s) return;
  for(i=0;i<(items||[]).length;i++) items[i].stars=s;
}
function applyCachedReleases(list){ var r=latestRepos(list), k, c; for(k in r){ if(!r.hasOwnProperty(k)) continue; c=ghCached(k); if(c){ applyBestReleases(r[k], ghCachedList(c)); applyRepoStars(r[k], k); } } }
function releasesStale(list){ var r=latestRepos(list), k, c; for(k in r){ if(!r.hasOwnProperty(k)) continue; c=ghCached(k); if(!c || !c.at || Date.now()-c.at<0 || Date.now()-c.at>=GH_TTL_MS) return true; } return false; }
/* Background check (at most every 6 hours): never holds up the page. */
function bgReleaseCheck(list){
  var before=catalogFingerprint(list);
  applyLatest(list, function(){
    if(catalogFingerprint(list)===before || PAYLOADS!==list) return;
    writeCatalogCache(PAYLOADS);
    rerenderCatalogViews();
    checkDownloadedUpdates(PAYLOADS);
  });
}

var focusMode=false, padCrossAt=0;
function focusables(){
  var all=document.querySelectorAll('button,input,a[href],[tabindex]'), out=[], i, el, r, box=modalOpen()?document.getElementById('modal'):(tvOpen()?document.getElementById('tvov'):(qkOpen()?document.getElementById('qkov'):null));
  for(i=0;i<all.length;i++){
    el=all[i];
    if(el.disabled || el.tabIndex<0) continue;
    if(box && !box.contains(el)) continue;
    r=el.getBoundingClientRect();
    if(r.width<2 || r.height<2) continue;
    if(el.offsetParent===null && getComputedStyle(el).position!=='fixed') continue;
    out.push({el:el, r:r});
  }
  return out;
}
function moveFocus(dir){
  var cur=document.activeElement, list, cr, cx, cy, best=null, bs=1e9, i, r, x, y, dx, dy, main, side, s;
  if(tvOpen() && !modalOpen() && (dir==='ArrowUp' || dir==='ArrowDown')){ var pr=document.getElementById('tvpre'); if(pr) pr.scrollTop+=(dir==='ArrowDown'?1:-1)*Math.round(pr.clientHeight*0.6); return true; }
  list=focusables();
  if(!list.length) return false;
  if(!cur || cur===document.body){ list[0].el.focus(); return true; }
  cr=cur.getBoundingClientRect(); cx=cr.left+cr.width/2; cy=cr.top+cr.height/2;
  for(i=0;i<list.length;i++){
    if(list[i].el===cur) continue;
    r=list[i].r; x=r.left+r.width/2; y=r.top+r.height/2; dx=x-cx; dy=y-cy;
    if(dir==='ArrowRight'){ main=dx; side=Math.abs(dy); if(r.left<cr.right-4) continue; }
    else if(dir==='ArrowLeft'){ main=-dx; side=Math.abs(dy); if(r.right>cr.left+4) continue; }
    else if(dir==='ArrowDown'){ main=dy; side=Math.abs(dx); if(r.top<cr.bottom-4) continue; }
    else { main=-dy; side=Math.abs(dx); if(r.bottom>cr.top+4) continue; }
    s=main+side*2.2;
    if(s<bs){ bs=s; best=list[i].el; }
  }
  if(!best) return false;
  best.focus();
  try{ best.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(e){ best.scrollIntoView(false); }
  return true;
}
document.addEventListener('keydown', function(ev){

var padRep={};
function padNav(p){
  var map={12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight'}, k, b=p.buttons, now=Date.now(), d;
  for(k in map){
    d=!!(b[k] && b[k].pressed);

    } else padRep[k]=0;

  d=!!(b[3] && b[3].pressed);

  }

/* POST with JSON result; a 409 means another send holds the lock: wait and retry. */
function postJson(url, tries, cb){
  fetch(url,{method:'POST'}).then(function(r){
    return r.text().then(function(tx){ var j=null; try{ j=JSON.parse(tx); }catch(e){} return {code:r.status,j:j,t:tx}; });
  }).then(function(res){
    if(res.code===409 && tries>0){ setTimeout(function(){ postJson(url, tries-1, cb); }, 1500); return; }
    cb(res);
  }).catch(function(e){ cb({code:(e && e.name==='TimeoutError')?-1:0, j:null, t:''}); });
}
function xhrUpload(file, q, tries, cb){
  var x=new XMLHttpRequest();
  x.open('POST', q, true);
  x.setRequestHeader('X-ELFL','1');
  x.setRequestHeader('Content-Type','application/octet-stream');
  x.timeout=600000;
  x.onload=function(){
    var j=null; try{ j=JSON.parse(x.responseText); }catch(e){}
    if(x.status===409 && tries>0){ setTimeout(function(){ xhrUpload(file, q, tries-1, cb); }, 1500); return; }
    cb({code:x.status, j:j, t:x.responseText});
  };
  x.onerror=function(){ cb({code:0,j:null,t:''}); };
  x.ontimeout=function(){ cb({code:-1,j:null,t:''}); };
  x.send(file);
}
function ensureDownloaded(it, cb){

  localMeta(it.path).then(function(m){
    if(m && m.ok && m.exists){ cb(true); return; }
    if(!meta){ cb(false, t('errMissing')); return; }
    downloadToFolder(it.path, meta).then(function(){ DL_SET[it.name]=1; if(downloadedCountKnown) downloadedCount++; cb(true); },
      function(e){ cb(false, (e && e.message) || 'download failed'); });
  }, function(){ cb(false, t('errNetwork')); });
}
function selDoOne(it, mode, cb){

  (function next(){
    var e;

function selfHandoff(btn){
  var start=Date.now(), oldPid=0, done=false;
  function fail(msg){
    if(done) return; done=true;
    if(btn) btn.disabled=false;
    setStatus(t('selfUpdateFail',{msg:msg}));
    updOverlay(t('selfUpdateFail',{msg:msg}), true);
  }
  function poll(){
    if(done) return;
    if(Date.now()-start>60000){ fail(t('selfTimeout')); return; }
    setTimeout(function(){
      fetch('/version').then(function(r){ return r.json(); }).then(function(j){
        if(j && j.pid && oldPid && j.pid!==oldPid){
          done=true; updOverlay(t('selfReloading'));
          setTimeout(function(){ location.reload(); }, 700);
        } else poll();
      }, poll);
    }, 1000);
  }
  updOverlay(t('selfSwitching'));
  setStatus(t('selfSwitching'));
  fetch('/version').then(function(r){ return r.json(); }).then(function(j){ oldPid=(j && j.pid)||0; }, function(){}).then(function(){
    fetch('/self_update',{method:'POST'}).then(function(r){
      return r.json().catch(function(){ return null; }).then(function(j){ return {code:r.status, j:j}; });
    }).then(function(res){
      if(res.code!==200 || !res.j || !res.j.ok){ fail((res.j && res.j.message) || ('HTTP '+res.code)); return; }
      if(res.j.old_pid) oldPid=res.j.old_pid;
      poll();
    }, function(){ poll(); }); /* the old server may be gone before it answers */
  });
}

function iconSrc(u){ if(!/^https:\/\//.test(u)) return u; return isConsoleHost() ? '/icon?url='+encodeURIComponent(u) : u; }
var icoQ=[], icoBusy=0, icoFail={}, icoIO=null;
function iconDrop(img){
  var b=img.parentNode;
  if(!b) return;
  b.removeChild(img);
  b.className=b.className.replace(/\s*\b(hasicon|iconok)\b/g,'');
}
function iconPump(){
  var it;
  while(icoBusy<2 && icoQ.length){
    it=icoQ.shift();
    if(!document.body.contains(it.el)) continue;
    if(icoFail[it.src]){ iconDrop(it.el); continue; }
    icoBusy++;
    (function(it){
      it.el.onload=function(){ icoBusy--; var b=it.el.parentNode; if(b && !/\biconok\b/.test(b.className)) b.className+=' iconok'; iconPump(); };
      it.el.onerror=function(){ icoBusy--; icoFail[it.src]=1; iconDrop(it.el); iconPump(); };
      it.el.src=it.src;
    })(it);
  }
}
function iconQueue(img){
  var s=img.getAttribute('data-src');
  if(!s) return;
  img.removeAttribute('data-src');
  icoQ.push({el:img, src:s});
  iconPump();
}
function iconScan(){
  var im=document.querySelectorAll('img.picon[data-src]'), i;
  for(i=0;i<im.length;i++){
    if(im[i].getAttribute('data-obs')) continue;
    if(icoIO){ im[i].setAttribute('data-obs','1'); icoIO.observe(im[i]); }

}
(function(){
  var tm=0, MO=window.MutationObserver||window.WebKitMutationObserver;

    try{ icoIO=new IntersectionObserver(function(es){ var i; for(i=0;i<es.length;i++) if(es[i].isIntersecting || es[i].intersectionRatio>0){ icoIO.unobserve(es[i].target); iconQueue(es[i].target); } }, {rootMargin:'200px'}); }catch(e){ icoIO=null; }
  }
  if(MO) new MO(function(){ clearTimeout(tm); tm=setTimeout(iconScan, 60); }).observe(document.body, {childList:true, subtree:true});
  else setInterval(iconScan, 1000);
})();

/* ---------- crash watch: a payload gone within a minute of loading ---------- */
var CRW={}, CRW_MS=60000;
function crwNote(name, pid){ if(name && (pid|0)>0) CRW[name]={pid:pid|0, at:Date.now()}; }
function crwForgetPid(pid){ var k; for(k in CRW) if(CRW.hasOwnProperty(k) && CRW[k].pid===(pid|0)) delete CRW[k]; }
function crwForget(name){ delete CRW[name]; }
function crwCheck(procs){
  var alive={}, k, w, i, sec;
  for(i=0;i<procs.length;i++) alive[procs[i].pid|0]=1;
  for(k in CRW){
    if(!CRW.hasOwnProperty(k)) continue;
    w=CRW[k];
    if(Date.now()-w.at>CRW_MS){ delete CRW[k]; continue; }
    if(alive[w.pid]) continue;
    delete CRW[k];
    sec=Math.max(1, Math.round((Date.now()-w.at)/1000));
    evPost('crash', t('crashMsg',{name:k,s:sec}));
    try{ clearPayloadPid(k); forgetActive(k); }catch(e){}
    toastCrash(k, sec);
  }
}

/* ---------- drop / upload into the current PS5 folder ---------- */
function fmCanUpload(){ return isConsoleHost() && !onPs5Browser() && currentFolder==='ps5' && fbWritable(fbSt.dir); }
var upBusy=false;
function fmUploadFiles(files){
  var list=[], i, idx=0, done=0, failed=[];
  if(!fmCanUpload()){ setStatus(t('fmReadOnly')); return; }
  if(upBusy) return;
  for(i=0;files && i<files.length;i++) list.push(files[i]);
  if(!list.length) return;
  upBusy=true;
  var dir=fbSt.dir;
  function next(){
    var f, x;
    if(idx>=list.length){
      upBusy=false; showProgress(false);
      setStatus(failed.length ? t('upPartial',{a:done,b:list.length,names:failed.join(', ')}) : t('upDone',{n:done}));
      if(currentFolder==='ps5' && fbSt.dir===dir) fbBrowse(dir);
      return;
    }
    f=list[idx++];
    setStatus(t('upSending',{name:f.name,i:idx,n:list.length}));
    showProgress(true); setProgressPct(0);
    x=new XMLHttpRequest();
    x.open('POST','/fs/upload?dir='+encodeURIComponent(dir)+'&name='+encodeURIComponent(f.name),true);
    x.setRequestHeader('X-ELFL','1');
    if(x.upload) x.upload.onprogress=function(e){ if(e.lengthComputable) setProgressPct(Math.round(e.loaded*100/e.total)); };
    x.onload=function(){ var j=null; try{ j=JSON.parse(x.responseText); }catch(e){} if(x.status===200 && j && j.ok) done++; else failed.push(f.name+' ('+((j&&j.message)||('HTTP '+x.status))+')'); next(); };
    x.onerror=function(){ failed.push(f.name); next(); };
    x.send(f);
  }
  next();
}
(function(){
  var depth=0;
  function has(ev){ var d=ev.dataTransfer; if(!d || !d.types) return false; for(var i=0;i<d.types.length;i++) if(d.types[i]==='Files') return true; return false; }
  function mark(on){ var m=document.getElementById('main'); if(m){ if(on) m.setAttribute('data-drop', fmCanUpload()?'ok':'no'); else m.removeAttribute('data-drop'); } }
  document.addEventListener('dragenter', function(ev){ if(currentFolder!=='ps5' || !has(ev)) return; depth++; mark(true); ev.preventDefault(); });
  document.addEventListener('dragover', function(ev){ if(currentFolder!=='ps5' || !has(ev)) return; ev.preventDefault(); try{ ev.dataTransfer.dropEffect=fmCanUpload()?'copy':'none'; }catch(e){} });
  document.addEventListener('dragleave', function(){ if(depth>0 && --depth===0) mark(false); });
  document.addEventListener('drop', function(ev){
    if(currentFolder!=='ps5' || !has(ev)) return;
    ev.preventDefault(); depth=0; mark(false);
    fmUploadFiles(ev.dataTransfer.files);
  });
})();

function bkCatalogByName(){ var m={}, i, p; for(i=0;i<PAYLOADS.length;i++){ p=PAYLOADS[i]; m[baseName(p.path)]=p; } return m; }

function bkBuild(inv){
  var cat=bkCatalogByName(), items=[], local=[], i, f, c, totalLocal=0;
  for(i=0;i<inv.length;i++){
    f=inv[i];
    if(isProtectedKillName(f.name)) continue;
    c=cat[f.name];
    if(c && c.url){
      items.push({name:f.name, kind:'catalog', path:c.path, version:c.version||'', sha256:f.sha256, size:f.size, url:c.url, catalogSha:c.checksum||''});
    }else{
      items.push({name:f.name, kind:'local', path:'mirror/'+f.name, sha256:f.sha256, size:f.size, file:'files/'+f.name});
      local.push(f.name); totalLocal+=f.size;
    }
  }
  return {doc:{type:'elf-launcher-backup', v:1, created:new Date().toISOString(), from:location.host, settings:bkSettings(), payloads:items}, local:local, localBytes:totalLocal};
}

function bkParse(txt){

  try{ d=JSON.parse(txt); }catch(e){ return null; }
  if(!d || d.type!=='elf-launcher-backup' || !d.settings || !(d.payloads && d.payloads.length!=null)) return null;
  return d;
}
/* Summary first: what changes, what downloads, what is already there. */
function bkOpenDoc(txt, dir){
  var d=bkParse(txt), items=[], i, p, left;
  if(!d){ bkMsg(t('bkBad'), true); return; }
  for(i=0;i<d.payloads.length;i++){
    p=d.payloads[i];
    if(!p || !p.name || !/^[A-Za-z0-9._+\-]+$/.test(p.name)) continue;
    items.push({p:p, st:'check', note:''});
  }
  BK.plan={doc:d, dir:dir, items:items, done:false};
  setStatus(t('bkSummary'));
  left=items.length;
  bkPaint();
  if(!left || !isConsoleHost()){ bkPaintPlan(); return; }
  for(i=0;i<items.length;i++){
    (function(it){
      localMeta('mirror/'+it.p.name).then(function(meta){
        var sum=String(meta && (meta.checksum||meta.sha256) || '').toLowerCase();
        if(meta && meta.exists && sum && sum===String(it.p.sha256||'').toLowerCase()) it.st='have';
        else if(it.p.kind==='local') it.st=dir ? 'copy' : 'nofile';
        else it.st=it.p.url ? 'get' : 'nofile';
      }).catch(function(){ it.st=it.p.kind==='local' ? (dir?'copy':'nofile') : 'get'; }).then(function(){ if(--left===0) bkPaintPlan(); });
    })(items[i]);
  }
}

function bkApply(){
  var pl=BK.plan, i=0, todo=pl.items, ok=0, bad=0, cat=bkCatalogByName();
  if(BK.running) return;
  BK.running=true;
  bkPaintPlan();
  showProgress(true);
  evPost('info', t('bkStarted'));
  function step(){
    var it, p, c;
    if(i>=todo.length){ fin(); return; }
    it=todo[i++]; p=it.p;
    setProgressPct(Math.round((i-1)*100/Math.max(1,todo.length)));
    if(it.st==='have' || it.st==='nofile'){ step(); return; }
    it.st='busy'; bkPaintPlan();
    setStatus(t('bkItem',{name:p.name,i:i,n:todo.length}));
    if(p.kind==='local'){
      fetch('/save_path?path='+encodeURIComponent(pl.dir+'/'+(p.file||('files/'+p.name))),{method:'POST'}).then(jres).then(function(res){
        if(!res.ok || !res.j || !res.j.ok) throw new Error(resErr(res));
        return localMeta('mirror/'+p.name);
      }).then(function(meta){
        var sum=String(meta && meta.checksum || '').toLowerCase();
        if(p.sha256 && sum && sum!==String(p.sha256).toLowerCase()) throw new Error(t('bkShaBad'));
        it.st='ok'; ok++;
      }).catch(function(e){ it.st='fail'; it.note=e.message||String(e); bad++; }).then(function(){ bkPaintPlan(); step(); });
      return;
    }
    downloadToFolder('mirror/'+p.name, {url:p.url, checksum:p.sha256, size:p.size}).then(function(){ it.st='ok'; ok++; }, function(e){
      /* the repo moved on since the backup: take the catalog's current file */
      c=cat[p.name];
      if(c && c.url && c.checksum && String(c.checksum).toLowerCase()!==String(p.sha256).toLowerCase()){
        return downloadToFolder(c.path||('mirror/'+p.name), c).then(function(){ it.st='ok'; it.note=t('bkNewer',{v:updateVerLabel(c)}); ok++; });
      }
      throw e;
    }).catch(function(e){ it.st='fail'; it.note=e.message||String(e); bad++; }).then(function(){ bkPaintPlan(); step(); });
  }
  function fin(){
    var s=pl.doc.settings||{}, m={}, k;
    if(s.autoPayload){ for(k=0;k<s.autoPayload.length;k++) m[s.autoPayload[k]]=1; writeStore('ps5elfs-auto', m); syncAutoDisk(); }
    if(s.autoDelay!=null) setAutoDelay(normDelay(s.autoDelay));
    setTheme();
    if(s.openAfterJb!=null) setBrowserStayOpen(!!s.openAfterJb);
    if(s.recent && s.recent.length){ try{ localStorage.setItem(RECENT_KEY, JSON.stringify(s.recent.slice(0,12))); }catch(e){} }
    if(s.pins && s.pins.length!=null) writePins(s.pins.filter(function(x){ return typeof x==='string' && x; }));
    if(profValid(s.profiles)){ PROF=s.profiles; PROF.list[PROF.active]=autoNamesNow(); profSave(); }
    showProgress(false);
    BK.running=false;
    pl.done=true;
    evPost(bad?'error':'info', t('bkFinished',{a:ok,b:bad}));
    refreshLocalFiles(function(){ renderNav('backup'); });
    if(s.lang && s.lang!==LANG && I18N[s.lang]){ LANG=s.lang; saveLang(s.lang); applyStaticI18n(); }
    bkPaintPlan();
    bkMsg(t('bkFinished',{a:ok,b:bad}), bad>0);
  }
  step();
}

/* Lighter open: no network on launch. Cached list shows right away; automatic
   remote checks (catalog, github_latest, self/WK updates) run at most every 6 h.
   The Update/Upload buttons still check on demand. */
var AUTO_NET_KEY='elf-auto-net-at', AUTO_NET_MS=6*3600*1000;
function autoNetDue(){ var a=0; try{ a=+localStorage.getItem(AUTO_NET_KEY)||0; }catch(e){} var d=Date.now()-a; return !a || d<0 || d>=AUTO_NET_MS; }
function markAutoNet(){ try{ localStorage.setItem(AUTO_NET_KEY, String(Date.now())); }catch(e){} }
function bootAfterCatalog(){
  (function(){ var q=document.getElementById('qkbtn'); if(q){ q.onclick=qkToggle; q.title=t('qkTitle'); q.setAttribute('aria-label', t('qkTitle')); } })();
  profLoad(function(){ if(!currentFolder) showHome(); else if(currentFolder==='auto') showAutoPayloadFolder(); });
  bindSearch();
  if(isConsoleHost()){ watchRunning(); pollProcs(true); }
  var start=getHashFolder();
  if(start)showFolder(start); else showHome();
  applyRemembered();
  setStatus(t('ready'));
  if(isConsoleHost() && currentFolder!=='downloaded') showDownloadedFolderCount();
  /* Once after jailbreak/elfldr only: disk flag blocks later page/app opens. */
  syncBrowserPrefFromDisk();
  /* Uploaded files marked Auto are not in the catalog: load the list first,
     otherwise syncAutoDisk would drop them from auto.list. */
  refreshLocalFiles(function(){
    syncAutoDisk();
    renderNav(currentFolder);
    watchElfldrThenAuto();
  });
  if(autoNetDue()){
    setTimeout(checkSelfUpdate, 900);
    setTimeout(checkWkUpdate, 1400);
  }
}
/* Every open: show the cached list right away, then always fetch the repos,
   swap in the fresh list, and compare saved files (Update badge). */
function backgroundCatalogRefresh(tries){
  fetchRemoteCatalog(function(list, live){
    if(!list || !list.length){
      if(tries>0) setTimeout(function(){ backgroundCatalogRefresh(tries-1); }, 8000);
      else scheduleCatalogRecheck();
      return;
    }
    function apply(){
      if(uiBusy() || autoArmed()){ setTimeout(apply, 1500); return; }
      var before=PAYLOADS ? PAYLOADS.slice() : [];
      catalogBefore=before;
      var same=catalogFingerprint(before)===catalogFingerprint(list) && before.map(function(m){ return m.icon||''; }).join('|')===list.map(function(m){ return m.icon||''; }).join('|');
      PAYLOADS=list;
      writeCatalogCache(PAYLOADS);
      if(!same) rerenderCatalogViews();
      statusAfterCatalogRefresh(before, PAYLOADS, live, []);
      checkDownloadedUpdates(PAYLOADS);
    }
    apply();
  });
}
(function bootCatalog(){
  var cached=readCatalogCache();
  if(cached){
    PAYLOADS=cached;
    var due=autoNetDue();
    bootAfterCatalog();
    if(due){ markAutoNet(); setTimeout(function(){ backgroundCatalogRefresh(2); }, 400); }
    else scheduleCatalogRecheck();
    return;
  }
  refreshCatalog(function(ok){
    if(ok && PAYLOADS && PAYLOADS.length){ writeCatalogCache(PAYLOADS); markAutoNet(); }
    bootAfterCatalog();
    if(ok) setTimeout(function(){ checkDownloadedUpdates(PAYLOADS); }, 1500);
    else setTimeout(function(){ backgroundCatalogRefresh(2); }, 8000);
  });
})();

(function(){

    if(!note) return;
    var show=!isConsoleHost() && !onPs5Browser();
    try{ if(localStorage.getItem(NOTE_KEY)) show=false; }catch(e){}
    note.classList.toggle('show', show);
    if(show){
      var parts=t('offNote').split('{url}'), p=document.getElementById('offnotetxt');
      p.textContent=parts[0]; if(parts.length>1){ var b=document.createElement('b'); b.textContent='http://<PS5 IP>:1000'; p.appendChild(b); p.appendChild(document.createTextNode(parts[1])); }
    }
  }
  var x=document.getElementById('offnotex');
  if(x) x.addEventListener('click', function(){ try{ localStorage.setItem(NOTE_KEY,'1'); }catch(e){} note.classList.remove('show'); });
  paintNote();
  if(typeof setLang==='function'){ var orig=setLang; setLang=function(){ var r=orig.apply(this, arguments); paintNote(); return r; }; }
})();
})();
</script>
