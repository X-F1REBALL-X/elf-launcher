    url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));
    a=document.createElement('a'); a.href=url; a.download='elf-launcher-backup-'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    bkMsg(b.local.length ? t('bkDlLocal',{n:b.local.length}) : t('bkDlDone'));
  }catch(e){ bkMsg(t('bkSaveFail',{msg:String(e)}), true); }
}
function bkOpenDir(dir){
  bkMsg(t('tvLoading'));
  fetch('/fs/read?path='+encodeURIComponent(dir+'/backup.json')).then(function(r){ return r.text().then(function(tx){ return {ok:r.ok, t:tx, code:r.status}; }); }).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.code);
    bkOpenDoc(res.t, dir);
  }).catch(function(e){ bkMsg(t('bkBad')+' ('+(e.message||e)+')', true); });
}
function bkParse(txt){
  var d=null;
  try{ d=JSON.parse(txt); }catch(e){ return null; }
  if(!d || d.type!=='elf-launcher-backup' || !d.settings || !(d.payloads && d.payloads.length!=null)) return null;
  return d;
}
/* Summary first: what changes, what downloads, what is already there. */
function bkOpenDoc(txt, dir){
  var d=bkParse(txt), items=[], i, p, left;
  if(!d){ bkMsg(t('bkBad'), true); return; }
  for(i=0;i<d.payloads.length;i++){
    p=d.payloads[i];
    if(!p || !p.name || !/^[A-Za-z0-9._+\-]+$/.test(p.name)) continue;
    items.push({p:p, st:'check', note:''});
  }
  BK.plan={doc:d, dir:dir, items:items, done:false};
  setStatus(t('bkSummary'));
  left=items.length;
  bkPaint();
  if(!left || !isConsoleHost()){ bkPaintPlan(); return; }
  for(i=0;i<items.length;i++){
    (function(it){
      localMeta('mirror/'+it.p.name).then(function(meta){
        var sum=String(meta && (meta.checksum||meta.sha256) || '').toLowerCase();
        if(meta && meta.exists && sum && sum===String(it.p.sha256||'').toLowerCase()) it.st='have';
        else if(it.p.kind==='local') it.st=dir ? 'copy' : 'nofile';
        else it.st=it.p.url ? 'get' : 'nofile';
      }).catch(function(){ it.st=it.p.kind==='local' ? (dir?'copy':'nofile') : 'get'; }).then(function(){ if(--left===0) bkPaintPlan(); });
    })(items[i]);
  }
}
function bkStLabel(st){ return t('bkSt_'+st); }
function bkPaintPlan(){
  var pl=BK.plan, d=pl.doc, s=d.settings||{}, html='', i, it, n={get:0,copy:0,have:0,nofile:0,check:0}, cur=bkSettings(), chg=[];
  if(currentFolder!=='backup') return;
  for(i=0;i<pl.items.length;i++) n[pl.items[i].st]=(n[pl.items[i].st]||0)+1;
  if(s.lang && s.lang!==LANG) chg.push(t('bkChLang',{a:LANG.toUpperCase(),b:String(s.lang).toUpperCase()}));
  if(s.autoPayload) chg.push(t('bkChAuto',{n:s.autoPayload.length, names:s.autoPayload.slice(0,6).join(', ')+(s.autoPayload.length>6?'\u2026':'')}));
  if(s.openAfterJb!=null && !!s.openAfterJb!==cur.openAfterJb) chg.push(t('bkChOpen',{v:t(s.openAfterJb?'yes':'no')}));
  if(s.autoDelay!=null && (s.autoDelay|0)!==cur.autoDelay) chg.push(t('bkChDelay',{n:s.autoDelay|0}));
  if(s.profiles && s.profiles.order) chg.push(t('bkChProf',{n:s.profiles.order.length, name:s.profiles.active||''}));
  if(s.recent && s.recent.length) chg.push(t('bkChRecent',{n:s.recent.length}));
  html+='<section class="panel bkplan"><p class="label">'+esc(pl.done?t('bkResult'):t('bkSummary'))+'</p>';
  html+='<p class="mlnote">'+esc(t('bkFrom',{t:d.created?String(d.created).replace('T',' ').slice(0,16):'?', where:pl.dir||t('bkUploaded')}))+'</p>';
  if(!pl.done){
    html+='<div class="bkstats"><span><b>'+n.get+'</b>'+esc(t('bkNGet'))+'</span><span><b>'+n.copy+'</b>'+esc(t('bkNCopy'))+'</span><span><b>'+n.have+'</b>'+esc(t('bkNHave'))+'</span>'+(n.nofile?'<span class="bad"><b>'+n.nofile+'</b>'+esc(t('bkNMiss'))+'</span>':'')+'</div>';
    html+='<p class="mlf">'+esc(t('bkSettingsL'))+'</p><ul class="bkwhat">';
    for(i=0;i<chg.length;i++) html+='<li><span>'+esc(chg[i])+'</span></li>';
    if(!chg.length) html+='<li><span>'+esc(t('bkNoChange'))+'</span></li>';
    html+='</ul>';
  }
  html+='<div class="bkitems">';
  for(i=0;i<pl.items.length;i++){
    it=pl.items[i];
    html+='<div class="bkit st-'+it.st+'"><b>'+esc(it.p.name)+'</b><small>'+esc((it.p.kind==='local'?t('bkLocal'):(it.p.version?(/^\d/.test(it.p.version)?'v':'')+it.p.version:t('srcCatalog')))+(it.p.size?' \u00b7 '+fmtSize(it.p.size):''))+'</small><span class="bkst">'+esc(bkStLabel(it.st))+(it.note?' \u00b7 '+esc(it.note):'')+'</span></div>';
  }
  if(!pl.items.length) html+='<p class="empty">'+esc(t('bkNoFiles'))+'</p>';
  html+='</div>';
  if(!pl.done) html+='<div class="mlgo"><button type="button" class="run load" id="bkapply"'+(n.check||BK.running||!isConsoleHost()?' disabled':'')+'>'+esc(BK.running?t('bkApplying'):t('bkApply'))+'</button><button type="button" class="run" id="bkcancel"'+(BK.running?' disabled':'')+'>'+esc(t('cancel'))+'</button></div>';
  else html+='<div class="mlgo"><button type="button" class="run" id="bkcancel">'+esc(t('selDone'))+'</button></div>';
  if(!isConsoleHost()) html+='<p class="mlnote">'+esc(t('savedOnConsole'))+'</p>';
  html+='<p class="mlnote" id="bkmsg"></p></section>';
  viewEl.innerHTML=html;
  var a=document.getElementById('bkapply'), c=document.getElementById('bkcancel');
  if(a) a.onclick=bkApply;
  if(c) c.onclick=function(){ BK.plan=null; bkPaint(); };
}
function bkApply(){
  var pl=BK.plan, i=0, todo=pl.items, ok=0, bad=0, cat=bkCatalogByName();
  if(BK.running) return;
  BK.running=true;
  bkPaintPlan();
  showProgress(true);
  evPost('info', t('bkStarted'));
  function step(){
    var it, p, c;
    if(i>=todo.length){ fin(); return; }
    it=todo[i++]; p=it.p;
    setProgressPct(Math.round((i-1)*100/Math.max(1,todo.length)));
    if(it.st==='have' || it.st==='nofile'){ step(); return; }
    it.st='busy'; bkPaintPlan();
    setStatus(t('bkItem',{name:p.name,i:i,n:todo.length}));
    if(p.kind==='local'){
      fetch('/save_path?path='+encodeURIComponent(pl.dir+'/'+(p.file||('files/'+p.name))),{method:'POST'}).then(jres).then(function(res){
        if(!res.ok || !res.j || !res.j.ok) throw new Error(resErr(res));
        return localMeta('mirror/'+p.name);
      }).then(function(meta){
        var sum=String(meta && meta.checksum || '').toLowerCase();
        if(p.sha256 && sum && sum!==String(p.sha256).toLowerCase()) throw new Error(t('bkShaBad'));
        it.st='ok'; ok++;
      }).catch(function(e){ it.st='fail'; it.note=e.message||String(e); bad++; }).then(function(){ bkPaintPlan(); step(); });
      return;
    }
    downloadToFolder('mirror/'+p.name, {url:p.url, checksum:p.sha256, size:p.size}).then(function(){ it.st='ok'; ok++; }, function(e){
      /* the repo moved on since the backup: take the catalog's current file */
      c=cat[p.name];
      if(c && c.url && c.checksum && String(c.checksum).toLowerCase()!==String(p.sha256).toLowerCase()){
        return downloadToFolder(c.path||('mirror/'+p.name), c).then(function(){ it.st='ok'; it.note=t('bkNewer',{v:updateVerLabel(c)}); ok++; });
      }
      throw e;
    }).catch(function(e){ it.st='fail'; it.note=e.message||String(e); bad++; }).then(function(){ bkPaintPlan(); step(); });
  }
  function fin(){
    var s=pl.doc.settings||{}, m={}, k;
    if(s.autoPayload){ for(k=0;k<s.autoPayload.length;k++) m[s.autoPayload[k]]=1; writeStore('ps5elfs-auto', m); syncAutoDisk(); }
    if(s.autoDelay!=null) setAutoDelay((s.autoDelay|0)===0?0:3);
    if(s.openAfterJb!=null) setBrowserStayOpen(!!s.openAfterJb);
    if(s.recent && s.recent.length){ try{ localStorage.setItem(RECENT_KEY, JSON.stringify(s.recent.slice(0,12))); }catch(e){} }
    if(profValid(s.profiles)){ PROF=s.profiles; PROF.list[PROF.active]=autoNamesNow(); profSave(); }
    showProgress(false);
    BK.running=false;
    pl.done=true;
    evPost(bad?'error':'info', t('bkFinished',{a:ok,b:bad}));
    refreshLocalFiles(function(){ renderNav('backup'); });
    if(s.lang && s.lang!==LANG && I18N[s.lang]){ LANG=s.lang; saveLang(s.lang); applyStaticI18n(); }
    bkPaintPlan();
    bkMsg(t('bkFinished',{a:ok,b:bad}), bad>0);
  }
  step();
}
/* test hook for the e2e suite only (?e2e=1): reach page internals */
if(window.__E2E===true) window.__e2e=function(src){ return eval(src); };
function bootAfterCatalog(){
  (function(){ var q=document.getElementById('qkbtn'); if(q){ q.onclick=qkToggle; q.title=t('qkTitle'); q.setAttribute('aria-label', t('qkTitle')); } })();
  profLoad(function(){ if(!currentFolder) showHome(); else if(currentFolder==='auto') showAutoPayloadFolder(); });
  bindSearch();
  setTimeout(trackLatest, 2500);
  if(isConsoleHost()){ watchRunning(); pollProcs(true); }
  var start=getHashFolder();
  if(start)showFolder(start); else showHome();
  applyRemembered();
  setStatus(t('ready'));
  if(isConsoleHost() && currentFolder!=='downloaded') showDownloadedFolderCount();
  /* Once after jailbreak/elfldr only — disk flag blocks later page/app opens. */
  syncBrowserPrefFromDisk();
  /* Uploaded files marked Auto are not in the catalog: load the list first,
     otherwise syncAutoDisk would drop them from auto.list. */
  refreshLocalFiles(function(){
    syncAutoDisk();
    renderNav(currentFolder);
    watchElfldrThenAuto();
  });
  setTimeout(checkSelfUpdate, 900);
  setTimeout(checkWkUpdate, 1400);
}
/* Every open: show the cached list right away, then always fetch the repos,
   swap in the fresh list, and compare saved files (Update badge). */
function backgroundCatalogRefresh(tries){
  fetchRemoteCatalog(function(list, live){
    if(!list || !list.length){
      if(tries>0) setTimeout(function(){ backgroundCatalogRefresh(tries-1); }, 8000);
      else scheduleCatalogRecheck();
      return;
    }
    function apply(){
      if(uiBusy() || autoArmed()){ setTimeout(apply, 1500); return; }
      var before=PAYLOADS ? PAYLOADS.slice() : [];
      var same=catalogFingerprint(before)===catalogFingerprint(list);
      PAYLOADS=list;
      writeCatalogCache(PAYLOADS);
      if(!same) rerenderCatalogViews();
      statusAfterCatalogRefresh(before, PAYLOADS, live, []);
      checkDownloadedUpdates(PAYLOADS);
    }
    apply();
  });
}
(function bootCatalog(){
  var cached=readCatalogCache();
  if(cached){
    PAYLOADS=cached;
    bootAfterCatalog();
    setTimeout(function(){ backgroundCatalogRefresh(2); }, 400);
    return;
  }
  refreshCatalog(function(ok){
    if(ok && PAYLOADS && PAYLOADS.length) writeCatalogCache(PAYLOADS);
    bootAfterCatalog();
    if(ok) setTimeout(function(){ checkDownloadedUpdates(PAYLOADS); }, 1500);
    else setTimeout(function(){ backgroundCatalogRefresh(2); }, 8000);
  });
})();
})();
