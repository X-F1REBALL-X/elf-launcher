function refreshCatalog(done){

  var jobs=[];
  var si;
  for(si=0;si<sources.length;si++){
    (function(src){
      jobs.push(fetchCatalogText(src.url).then(function(text){
        return {ok:true, src:src, arr:parseCatalogBody(text)};
      }).catch(function(){
        return {ok:false, src:src, arr:[]};
      }));
    })(sources[si]);
  }
  Promise.all(jobs).then(function(results){
    var out=[], i, m, p, r, live=0, names=[];
    for(i=0;i<PINNED_PAYLOADS.length;i++){
      p=PINNED_PAYLOADS[i];

      var j;

      if(done) done(true);

function watchElfldrThenAuto(){

  if(!bootAutoAllowed()) return;
  var tries=0;
  function tick(){
    if(!bootAutoAllowed()) return;
    probeElfldr(function(ready){
      if(!bootAutoAllowed()) return;
      if(ready){
        beginAutoAfterPause();
        return;
      }
      tries++;

      if(tries<45) setTimeout(tick, 1000);

function runAuto(done){
  var queue=[], i, p, btn;
  for(i=0;i<PAYLOADS.length;i++){
    p=PAYLOADS[i];
    if(!p || !isAutoName(p.name)) continue;
    if(isProtectedKillName(p.name) || isProtectedKillName(p.path)) continue;
    queue.push(p);
  }
  btn=document.getElementById('autocancel');
  if(!queue.length){
    if(btn) btn.disabled=true;
    if(done) done(0);
    return;
  }
  if(autoStop){
    if(btn) btn.disabled=true;
    hideAutoBanner();
    if(done) done(0);
    return;
  }
  autoStop=false;
  if(btn) btn.disabled=false;
  var n=0;
  function step(){
    var item;
    if(autoStop){
      if(btn) btn.disabled=true;
      hideAutoBanner();
      setStatus('Auto cancelled');
      return;
    }
    if(n>=queue.length){
      if(btn) btn.disabled=true;
      setStatus('AutoPayload done');
      if(done) done(n);
      return;
    }
    item=queue[n++];
    if(!isConsoleHost()){
      setStatus('Skip '+item.name+' (not on console)');
      setTimeout(step, 150);
      return;
    }
    localMeta(item.path).then(function(meta){
      if(!(meta && meta.ok && meta.exists)){
        setStatus('Skip '+item.name+' (file missing)');
        setTimeout(step, 200);
        return;
      }
      setStatus('AutoPayload '+item.name);
      sendPayload(item.name, item.path, (item.url||item.path), function(){
        setTimeout(step, 400);
      });
    }).catch(function(){
      setStatus('Skip '+item.name+' (file missing)');
      setTimeout(step, 200);
    });
  }
  step();
}

function normBase(s){

/* elfldr labels the child payload.elf until the ELF sets its own name. */

function processNameMatches(procName, payloadName){
  var p=normBase(procName);
  var base=normBase(payloadName);
  /* Empty/whitespace names match everything via indexOf('') — never treat them as loaded. */
  if(!p || !base) return false;
  if(p==='payload.elf') return base==='payload.elf';
  if(p===base) return true;
  /* Orbis ki_comm is COMMLEN 19. Only an exact 19-char truncation, never a shorter prefix. */
  if(p.length===19 && base.length>19 && base.substring(0,19)===p) return true;

  saved=getPayloadPid(name)|0;
  nameHit=null;
  pidHit=null;
  for(i=0;i<procs.length;i++){
    pr=procs[i];
    if(!pr) continue;
    ppid=pr.pid|0;
    pname=pr.name||'';
    if(ppid<=0) continue;
    if(!normBase(pname)) continue;
    if(isProtectedKillName(pname)) continue;
    if(processNameMatches(pname, name)) nameHit=pr;
    /* A saved PID stays Loaded until that PID leaves the list. The live name is often not the file name. */
    if(saved>0 && ppid===saved) pidHit=pr;

function needsUpdate(meta, catalog){
  /* Update only when local file already exists and differs from repo.
     Missing file = first install via Send (no Update button). */
  if(!catalog || !catalog.checksum) return false;
  if(!meta || !meta.ok || !meta.exists) return false;
  var localSum=String(meta.checksum||meta.sha256||'').toLowerCase();
  var catSum=String(catalog.checksum||'').toLowerCase();
  if(localSum && localSum.length===64 && catSum.length===64){
    return localSum !== catSum;
  }
  /* Size fallback when sidecar checksum is absent. */
  if(catalog.size && (meta.size|0)>0){

  }
  return false;

function showDownloadedFolderCount(){
  var queue, n, inflight, idx;
  if(!isConsoleHost() || !PAYLOADS || !PAYLOADS.length) return;
  queue=PAYLOADS.slice();
  n=0; inflight=0; idx=0;
  function pump(){
    var item;
    if(idx>=queue.length && inflight===0){ noteDownloadedCount(n); return; }
    while(inflight<4 && idx<queue.length){
      item=queue[idx++];
      inflight++;
      (function(it){
        localMeta(it.path).then(function(meta){
          if(meta && meta.ok && meta.exists) n++;
        }).catch(function(){}).then(function(){ inflight--; pump(); });
      })(item);
    }
  }
  pump();
}
function showDownloadedFolder(){

  bindSubfolds();
  queue=PAYLOADS.slice();
  found=[];
  inflight=0;
  idx=0;
  function pump(){
    var p;
    if(currentFolder!=='downloaded') return;
    if(idx>=queue.length && inflight===0){
      paintDownloaded(found);
      return;
    }
    while(inflight<4 && idx<queue.length){
      p=queue[idx++];
      inflight++;
      (function(item){
        localMeta(item.path).then(function(meta){
          if(meta && meta.ok && meta.exists) found.push({p:item, size:(meta.size|0)});
        }).catch(function(){}).then(function(){
          inflight--;
          pump();
        });
      })(p);
    }
  }
  pump();
}

function filterAutoToDownloaded(){
  var rows=viewEl.querySelectorAll ? viewEl.querySelectorAll('[data-path]') : [];
  var left=rows.length, i;
  if(!left) return;
  for(i=0;i<rows.length;i++){
    (function(tr){
      localMeta(tr.getAttribute('data-path')).then(function(meta){
        var exists=!!(meta && meta.ok && meta.exists);
        left--;
        if(!exists){
          setAuto(tr.getAttribute('data-name'), false);
          if(tr.parentNode) tr.parentNode.removeChild(tr);
        }
        if(left===0 && currentFolder==='auto' && !viewEl.querySelector('[data-path]')){
          viewEl.innerHTML='<p class="empty">No downloaded payloads in AutoPayload.</p>';
          renderNav('auto');

      }).catch(function(){ left--; });
    })(rows[i]);
  }

function padTick(){
  var list=navigator.getGamepads?navigator.getGamepads():[];
  var i,p,b,down;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(!p||!p.buttons) continue;
    b=p.buttons;
    down=[!!(b[0]&&b[0].pressed),!!(b[1]&&b[1].pressed),!!(b[2]&&b[2].pressed),!!(b[3]&&b[3].pressed)];
    if(down[1]&&!padHeld[1]) padBack();
    if(down[3]&&!padHeld[3]) padRefresh();
    if(down[0]&&!padHeld[0]) padConfirm();
    if(down[2]&&!padHeld[2]) padCancelAuto();
    padHeld=down;
    break;
  }
  if(window.requestAnimationFrame) requestAnimationFrame(padTick);
  else setTimeout(padTick, 50);
}

}

function askIpImage(){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      var g,d,ip;
      c.width=4;
      c.height=1;
      g=c.getContext('2d');
      g.drawImage(img,0,0);
      d=g.getImageData(0,0,4,1).data;
      ip=d[0]+'.'+d[4]+'.'+d[8]+'.'+d[12];
      if(privateIp(ip)) showDeviceIp(ip);
    }catch(e){}
  };
  img.onerror=function(){
    if(window.ipElfSent || !/PlayStation/i.test(navigator.userAgent)) return;
    window.ipElfSent=true;
    askLauncher('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/loader/elfldr-ps5.elf');
  };
  img.src='http://127.0.0.1:9021/ip.bmp?t='+Date.now();
}
function askIp(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','http://127.0.0.1:9021/ip',true);
    x.timeout=1500;
    x.onload=function(){
      var m=String(x.responseText||'').match(/(\d+\.\d+\.\d+\.\d+)/);
      if(m) showDeviceIp(m[1]);
    };
    x.send();
  }catch(e){}
  var s=document.createElement('script');
  s.src='http://127.0.0.1:9021/ip.js?t='+Date.now();
  document.documentElement.appendChild(s);
}
function watchIp(){
  var n=0;
  var t=setInterval(function(){
    var el=document.getElementById('deviceip');
    n++;
    if(el && el.textContent.indexOf('looking')<0 && el.textContent.indexOf('unavailable')<0){
      clearInterval(t);
      return;
    }
    askIp();
    askIpImage();
    if(n>8) clearInterval(t);
  }, 1000);
}
function showDeviceInfo(){
  var ua=navigator.userAgent||'';
  var model='Unknown';
  var ver='';
  var m;
  if((m=ua.match(/PlayStation 5\/([0-9.]+)/))){ model='PS5'; ver=m[1]; }
  else if((m=ua.match(/PlayStation 4\/([0-9.]+)/))){ model='PS4'; ver=m[1]; }
  else if(/iPhone/.test(ua)){ model='iPhone'; m=ua.match(/OS ([0-9_]+)/); if(m) ver=m[1].replace(/_/g,'.'); }
  else if(/iPad/.test(ua)){ model='iPad'; m=ua.match(/OS ([0-9_]+)/); if(m) ver=m[1].replace(/_/g,'.'); }
  else if((m=ua.match(/Android ([0-9.]+);\s*([^;)]+)/))){ ver=m[1]; model=(m[2]||'Android').replace(/\s*Build.*$/,'').trim()||'Android'; }
  else if(/Windows NT/.test(ua)){ model='PC'; ver='Windows'; }
  else if((m=ua.match(/Mac OS X ([0-9_]+)/))){ model='Mac'; ver=m[1].replace(/_/g,'.'); }
  else if(/Linux/.test(ua)){ model='Linux'; }
  var el=document.getElementById('deviceinfo');
  if(!el) return;
  if(model==='PS5' || model==='PS4') el.className='ps5mark';
  else el.className='';
  el.textContent=model+(ver?'  '+ver:'');
}
function privateIp(ip){
  return /^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[0-1])\./.test(ip);
}
function findLocalIp(){
  var RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection||window.mozRTCPeerConnection;
  var el=document.getElementById('deviceip');
  if(!RTC){ if(el) el.textContent='unavailable'; return; }
  var found=false;
  function show(ip){
    if(found||!privateIp(ip)) return;
    found=true;
    showDeviceIp(ip);
  }
  function hit(text){
    if(found||!text) return;
    var re=/(\d+\.\d+\.\d+\.\d+)/g, m;
    while((m=re.exec(String(text)))) show(m[1]);
  }
  function open(opts){
    var pc;
    try{ pc=opts?new RTC(opts):new RTC(); }catch(err){ return null; }
    try{ pc.createDataChannel(''); }catch(err2){}
    pc.onicecandidate=function(e){
      if(!e||!e.candidate) return;
      hit(e.candidate.candidate||'');
      if(e.candidate.address) hit(e.candidate.address);
    };
    function offerOk(o){
      hit(o&&o.sdp);
      try{
        var p=pc.setLocalDescription(o);
        if(p&&p.then) p.then(function(){ hit(pc.localDescription&&pc.localDescription.sdp); });
      }catch(err3){
        try{ pc.setLocalDescription(o, function(){ hit(pc.localDescription&&pc.localDescription.sdp); }, function(){}); }catch(err4){}
      }
    }
    try{
      pc.createOffer(offerOk, function(){}, {offerToReceiveAudio:true});
    }catch(err5){
      try{
        var made=pc.createOffer();
        if(made&&made.then) made.then(offerOk).catch(function(){});
      }catch(err6){}
    }
    return pc;
  }
  var pcs=[];
  var a=open({iceServers:[]});
  if(a) pcs.push(a);
  setTimeout(function(){
    if(found) return;
    var b=open({iceServers:[{url:'stun:stun.l.google.com:19302'}]});
    if(b) pcs.push(b);
  }, 600);
  setTimeout(function(){
    var i;
    if(!found&&el&&el.textContent.indexOf('looking')>=0) el.textContent='unavailable';
    for(i=0;i<pcs.length;i++){ try{ pcs[i].close(); }catch(err7){} }
  }, 5000);
}
function tickClock(){
  var d=new Date();
  var p=function(n){ return (n<10?'0':'')+n; };
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var t=document.getElementById('clk-time');
  var dt=document.getElementById('clk-date');
  if(t) t.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  if(dt) dt.textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}
tickClock();
setInterval(tickClock, 1000);
findLocalIp();
showDeviceInfo();
/* On :1000 never probe :9021 for IP; that GET burns raw elfldr. */
if(/PlayStation/i.test(navigator.userAgent) && !isConsoleHost()) watchIp();
var firstEntry=freshBoot();
if(firstEntry) clearActive();
var autoTimer=null;
var autoStop=false;
var autoRunning=false;
var autoCancelBtn=document.getElementById('autocancel');
if(autoCancelBtn) autoCancelBtn.onclick=function(){
  padCancelAuto();
  return false;
};
var autoBannerBtn=document.getElementById('autobannercancel');
if(autoBannerBtn) autoBannerBtn.onclick=function(){
  padCancelAuto();
  return false;
};
function bootAfterCatalog(){
  var start=getHashFolder();
  if(start)showFolder(start); else showHome();
  applyRemembered();
  setStatus('Ready');
  if(isConsoleHost() && currentFolder!=='downloaded') showDownloadedFolderCount();
  /* Not on every open. Only the first time elfldr is already listening, after a 3s pause. */
  syncAutoDisk();
  watchElfldrThenAuto();
}
(function bootCatalog(){
  var cached=readCatalogCache();
  if(cached){
    PAYLOADS=cached;
    bootAfterCatalog();
    return;
  }
  refreshCatalog(function(ok){
    if(ok && PAYLOADS && PAYLOADS.length) writeCatalogCache(PAYLOADS);
    bootAfterCatalog();
  });
})();
})();
