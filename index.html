var statusEl=document.getElementById('status');
var homeEl=document.getElementById('home');
var viewEl=document.getElementById('view');
var hdrEl=document.getElementById('hdr');
var titleEl=document.getElementById('ftitle');
var progWrap=document.getElementById('progwrap');
var progBar=document.getElementById('progbar');
var currentFolder=null;
var pollTimer=null;

function setStatus(t){statusEl.textContent=t;}

function showProgress(on){
  if(on){
    progWrap.className='show';
    progWrap.setAttribute('aria-hidden','false');
  }else{
    progWrap.className='';
    progWrap.setAttribute('aria-hidden','true');
    progBar.className='';
    progBar.style.width='0%';
  }
}

function setProgressPct(pct){
  progBar.className='';
  if(pct<0){
    progBar.className='indeterminate';
    progBar.style.width='40%';
  }else{
    if(pct>100)pct=100;
    if(pct<0)pct=0;
    progBar.style.width=pct+'%';
  }
}

function stopPoll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
}

var apiBase='';
function startPoll(){
  stopPoll();
  pollTimer=setInterval(function(){
    fetch(apiBase+'/progress').then(function(r){return r.json();}).then(function(j){
      if(!j)return;
      if(j.phase==='idle'){
        if(typeof j.pct==='number' && j.pct>=100)setProgressPct(100);
        return;
      }
      if(typeof j.pct==='number')setProgressPct(j.pct);
    }).catch(function(){});
  },250);
}

function countIn(folder){
  var n=0,i;
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].folder===folder)n++;}
  return n;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getHashFolder(){
  var h=location.hash||'';
  var m=h.match(/folder=([a-z0-9\-]+)/i);
  return m?m[1]:null;
}

function setHashFolder(id){
  if(id){location.hash='folder='+id;}
  else if(location.hash){location.hash='';}
}

function loadActive(){
  var raw='';
  try{ raw=localStorage.getItem('ps5elfs-active')||''; }catch(e){}
  if(!raw){ try{ raw=sessionStorage.getItem('ps5elfs-active')||''; }catch(e2){} }
  if(!raw){
    var parts=document.cookie?document.cookie.split(';'):[];
    var i,p;
    for(i=0;i<parts.length;i++){
      p=parts[i].replace(/^\s+/,'');
      if(p.indexOf('ps5elfs-active=')===0){
        try{ raw=decodeURIComponent(p.substring(16)); }catch(e3){ raw=''; }
      }
    }
  }
  if(!raw) return {};
  try{ return JSON.parse(raw); }catch(e4){ return {}; }
}
function rememberActive(name){
  var m=loadActive();
  var s;
  m[name]=1;
  s=JSON.stringify(m);
  try{ localStorage.setItem('ps5elfs-active', s); }catch(e){}
  try{ sessionStorage.setItem('ps5elfs-active', s); }catch(e2){}
  document.cookie='ps5elfs-active='+encodeURIComponent(s)+'; path=/; max-age=31536000';
}
function clearActive(){
  try{ localStorage.removeItem('ps5elfs-active'); }catch(e){}
  try{ sessionStorage.removeItem('ps5elfs-active'); }catch(e2){}
  document.cookie='ps5elfs-active=; path=/; max-age=0';
}
function freshBoot(){
  try{
    if(sessionStorage.getItem('ps5elfs-boot')==='1') return false;
    sessionStorage.setItem('ps5elfs-boot','1');
    return true;
  }catch(e){
    return false;
  }
}
function isActiveName(name){
  return !!loadActive()[name];
}
function readStore(key){
  var raw='', parts, i, p, pref;
  try{ raw=localStorage.getItem(key)||''; }catch(e){}
  if(!raw){ try{ raw=sessionStorage.getItem(key)||''; }catch(e2){} }
  if(!raw && document.cookie){
    parts=document.cookie.split(';');
    pref=key+'=';
    for(i=0;i<parts.length;i++){
      p=parts[i].replace(/^\s+/,'');
      if(p.indexOf(pref)===0){
        try{ raw=decodeURIComponent(p.substring(pref.length)); }catch(e3){ raw=''; }
      }
    }
  }
  if(!raw) return {};
  try{ return JSON.parse(raw); }catch(e4){ return {}; }
}
function writeStore(key, obj){
  var s=JSON.stringify(obj);
  try{ localStorage.setItem(key, s); }catch(e){}
  try{ sessionStorage.setItem(key, s); }catch(e2){}
  document.cookie=key+'='+encodeURIComponent(s)+'; path=/; max-age=31536000';
}
function loadAuto(){ return readStore('ps5elfs-auto'); }
function isAutoName(name){ return !!loadAuto()[name]; }
function setAuto(name, on){
  var m=loadAuto();
  if(on) m[name]=1;
  else delete m[name];
  writeStore('ps5elfs-auto', m);
}
function autoCount(){
  var n=0, i;
  for(i=0;i<PAYLOADS.length;i++){ if(isAutoName(PAYLOADS[i].name)) n++; }
  return n;
}
function runAuto(){
  if(!/PlayStation/i.test(navigator.userAgent)) return;
  var list=[], i, p, n=0, cancel;
  for(i=0;i<PAYLOADS.length;i++){
    p=PAYLOADS[i];
    if(isAutoName(p.name) && !isActiveName(p.name) && p.name!=='elfldr-ps5.elf') list.push(p);
  }
  if(!list.length) return;
  autoStop=false;
  cancel=document.getElementById('autocancel');
  if(cancel) cancel.style.display='inline-block';
  setStatus('Auto in 3s');
  autoTimer=setTimeout(function(){
    function next(){
      var item, fileUrl;
      if(autoStop){
        if(cancel) cancel.style.display='none';
        setStatus('Auto cancelled');
        return;
      }
      if(n>=list.length){
        if(cancel) cancel.style.display='none';
        setStatus('Auto loaded '+list.length);
        return;
      }
      item=list[n];
      n++;
      fileUrl=(item.url)?item.url:('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/'+item.path);
      setStatus('Auto '+item.name);
      askLauncher(fileUrl);
      rememberActive(item.name);
      setTimeout(next, 900);
    }
    next();
  }, 3000);
}
function applyRemembered(){
  var rows=document.querySelectorAll ? document.querySelectorAll('[data-name]') : [];
  var i,btn,name;
  for(i=0;i<rows.length;i++){
    name=rows[i].getAttribute('data-name');
    if(!isActiveName(name)) continue;
    btn=rows[i].querySelector('button.run');
    if(!btn) continue;
    btn.className='run sent';
    btn.textContent='Active';
  }
}

function showHome(){
  currentFolder=null;
  titleEl.className='';
  hdrEl.className='';
  viewEl.className='';
  viewEl.innerHTML='';
  homeEl.className='show';
  var html='<div id="folders">';
  var i,f,n;
  for(i=0;i<FOLDERS.length;i++){
    f=FOLDERS[i];
    n=countIn(f.id);
    html+='<button type="button" class="folder" data-folder="'+esc(f.id)+'">';
    html+='<span class="ico"><img alt="" src="icons/'+esc(f.id)+'.jpg?v=3"></span>';
    html+='<span class="fname">'+esc(f.label)+'</span>';
    html+='<span class="fcount">'+n+'</span>';
    html+='</button>';
  }
  if(/PlayStation/i.test(navigator.userAgent)){
    html+='<button type="button" class="folder" data-folder="auto">';
    html+='<span class="ico"><img alt="" src="icons/auto.jpg"></span>';
    html+='<span class="fname">Auto</span>';
    html+='<span class="fcount">'+autoCount()+'</span>';
    html+='</button>';
  }
  html+='</div>';
  homeEl.innerHTML=html;
  var cards=homeEl.querySelectorAll('.folder');
  for(i=0;i<cards.length;i++){
    cards[i].addEventListener('click',function(ev){
      var id=ev.currentTarget.getAttribute('data-folder');
      setHashFolder(id);
      showFolder(id);
    });
  }
}

function findPayload(path){
  var i;
  for(i=0;i<PAYLOADS.length;i++){if(PAYLOADS[i].path===path)return PAYLOADS[i];}
  return null;
}

function startBar(btn){
  btn.className='run busy';
  btn.style.transition='background-size 8s linear';
  btn.style.backgroundSize='0% 100%';
  setTimeout(function(){ if(btn.className.indexOf('busy')>=0) btn.style.backgroundSize='85% 100%'; }, 40);
}
function endBar(btn, text, name){
  btn.style.transition='background-size .35s ease';
  btn.style.backgroundSize='100% 100%';
  setTimeout(function(){
    btn.className='run sent';
    btn.style.backgroundSize='';
    btn.style.transition='';
    btn.textContent=text;
    if(name) rememberActive(name);
    btn.disabled=false;
  }, 380);
}

        var name=tr.getAttribute('data-name');
        var meta=findPayload(path);
        var onConsole=(location.hostname==='127.0.0.1'||location.hostname==='localhost');
        var elfldrRunning=document.getElementById('status').textContent.indexOf('Elfldr Ready')>=0 || document.getElementById('status').textContent.indexOf('Already active')>=0;
        if(btn.textContent==='Sent' || btn.textContent==='Active' || btn.textContent==='Downloaded' || (name==='elfldr-ps5.elf' && elfldrRunning)){
          btn.className='run sent';
          btn.textContent='Active';
          btn.disabled=false;
          setStatus('Already active');
          if(/PlayStation/i.test(navigator.userAgent)){
            askLauncher('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/loader/already-active.elf');
          }
          return;
        }
        btn.disabled=true;
        startBar(btn);
        if(!onConsole){
          var fileUrl=(meta&&meta.url)?meta.url:path;
          var onPs5=/PlayStation/i.test(navigator.userAgent);
          showProgress(true);
          setProgressPct(-1);
          if(onPs5){
            setStatus('Sending '+name+' to the launcher...');
            askLauncher(fileUrl);
            setProgressPct(100);
            showProgress(false);
            setStatus('Sent '+name+' to the launcher.');
            endBar(btn, 'Sent', name);
            setTimeout(function(){ setStatus('Elfldr Ready'); }, 1200);
            return;
          }
          setStatus('Downloading '+name+'...');
          fetch(fileUrl).then(function(r){
            if(!r.ok)throw new Error('HTTP '+r.status);
            return r.blob();
          }).then(function(blob){
            var u=URL.createObjectURL(blob);
            var a=document.createElement('a');
            a.href=u;
            a.download=name;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function(){URL.revokeObjectURL(u);},1500);
            setProgressPct(100);
            showProgress(false);
            setStatus('Downloaded '+name+'. Upload it by FTP to /data');
            endBar(btn, 'Downloaded', name);
          }).catch(function(e){
            showProgress(false);
            btn.className='run';
            btn.style.backgroundSize='';
            setStatus('Download failed: '+e);
          }).then(function(){btn.disabled=false;});
          return;
        }
        var fileUrl=(meta&&meta.url)?meta.url:path;
        setStatus('Sending '+name+' to the launcher...');
        askLauncher(fileUrl);
        setStatus('Sent '+name+' to the launcher.');
        endBar(btn, 'Sent', name);
        setTimeout(function(){ setStatus('Elfldr Ready'); }, 1200);
        btn.disabled=false;
        return;
      });
    })(rows[i]);
  }
  var autoBoxes=viewEl.getElementsByTagName('input');
  for(i=0;i<autoBoxes.length;i++){
    if(!autoBoxes[i].className || autoBoxes[i].className.indexOf('auto')<0) continue;
    autoBoxes[i].onchange=function(){
      var node=this.parentNode;
      while(node && (!node.getAttribute || !node.getAttribute('data-name'))) node=node.parentNode;
      if(!node) return;
      setAuto(node.getAttribute('data-name'), !!this.checked);
      if(currentFolder==='auto' && !this.checked && node.parentNode) node.parentNode.removeChild(node);
    };
  }
  var loadBtn=document.getElementById('loadsel');
  if(loadBtn) loadBtn.onclick=function(){
    var marks=viewEl.getElementsByTagName('input');
    var queue=[];
    var k,box,node,btn,text;
    for(k=0;k<marks.length;k++){
      box=marks[k];
      if(!box.checked || !box.className || box.className.indexOf('mark')<0) continue;
      node=box.parentNode;
      while(node && (!node.getAttribute || !node.getAttribute('data-name'))) node=node.parentNode;
      if(!node) continue;
      btn=node.querySelector('button.run');
      if(!btn) continue;
      text=btn.textContent;
      if(text==='Active' || text==='Sent' || text==='Downloaded') continue;
      queue.push(btn);
    }
    if(!queue.length){ setStatus(onPs5?'Mark payloads first':'Mark files first'); return; }
    var n=0;
    function next(){
      if(n>=queue.length){ setStatus((onPs5?'Loaded ':'Downloaded ')+queue.length); return; }
      queue[n].click();
      n++;
      setTimeout(next, 900);
    }
    next();
  };
}

var padTarget=null;
function isItem(el){
  if(!el||!el.className) return false;
  return el.className.indexOf('folder')>=0 || el.className.indexOf('run')>=0;
}
document.addEventListener('focus',function(ev){
  if(isItem(ev.target)) padTarget=ev.target;

function padBack(){
  if(currentFolder){ setHashFolder(null); showHome(); return; }
  history.back();
}
function padRefresh(){
  var hash=location.hash||'';
  location.href=location.pathname+'?v='+Date.now()+hash;
}
function padConfirm(){
  var el=padTarget;
  if(!el || !el.parentNode){
    var found=document.querySelector?document.querySelector('button.folder, button.run'):null;
    el=found;
  }
  if(el && el.click) el.click();
}
function padClose(){
  try{ window.close(); }catch(err){}
  location.replace('about:blank');
}
function padAct(act){
  if(act==='back') padBack();
  else if(act==='refresh') padRefresh();
  else if(act==='confirm') padConfirm();
  else if(act==='close') padClose();
}
var padKeys=document.getElementById('pad').getElementsByTagName('button');
var pi;
for(pi=0;pi<padKeys.length;pi++){
  padKeys[pi].onclick=function(){ padAct(this.getAttribute('data-act')); return false; };
}
var padHeld=[false,false,false,false];
function padTick(){
  var list=navigator.getGamepads?navigator.getGamepads():[];
  var i,p,b,down;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(!p||!p.buttons) continue;
    b=p.buttons;
    down=[!!(b[0]&&b[0].pressed),!!(b[1]&&b[1].pressed),!!(b[2]&&b[2].pressed),!!(b[3]&&b[3].pressed)];
    if(down[1]&&!padHeld[1]) padBack();
    if(down[3]&&!padHeld[3]) padRefresh();
    if(down[0]&&!padHeld[0]) padConfirm();
    if(down[2]&&!padHeld[2]) padClose();
    padHeld=down;
    break;
  }
  if(window.requestAnimationFrame) requestAnimationFrame(padTick);
  else setTimeout(padTick, 50);
}

function askLauncher(fileUrl, done){
  var img=new Image();
  var once=false;
  function fin(){ if(once) return; once=true; if(done) done(); }
  img.onload=fin;
  img.onerror=fin;
  img.src='http://127.0.0.1:9021/?uri='+encodeURIComponent(fileUrl);
  setTimeout(fin, 1200);
}
function showDeviceIp(ip){
  var el=document.getElementById('deviceip');
  if(el && ip && privateIp(ip)) el.textContent=ip;
}
window.showDeviceIp=showDeviceIp;
function askIpImage(){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');
      var g,d,ip;
      c.width=4;
      c.height=1;
      g=c.getContext('2d');
      g.drawImage(img,0,0);
      d=g.getImageData(0,0,4,1).data;
      ip=d[0]+'.'+d[4]+'.'+d[8]+'.'+d[12];
      if(privateIp(ip)) showDeviceIp(ip);
    }catch(e){}
  };
  img.onerror=function(){
    if(window.ipElfSent || !/PlayStation/i.test(navigator.userAgent)) return;
    window.ipElfSent=true;
    askLauncher('https://raw.githubusercontent.com/X-F1REBALL-X/elf-launcher/main/loader/elfldr-ps5.elf');
  };
  img.src='http://127.0.0.1:9021/ip.bmp?t='+Date.now();
}
function askIp(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','http://127.0.0.1:9021/ip',true);
    x.timeout=1500;
    x.onload=function(){
      var m=String(x.responseText||'').match(/(\d+\.\d+\.\d+\.\d+)/);
      if(m) showDeviceIp(m[1]);
    };
    x.send();
  }catch(e){}
  var s=document.createElement('script');
  s.src='http://127.0.0.1:9021/ip.js?t='+Date.now();
  document.documentElement.appendChild(s);
}
function watchIp(){
  var n=0;
  var t=setInterval(function(){
    var el=document.getElementById('deviceip');
    n++;
    if(el && el.textContent.indexOf('looking')<0 && el.textContent.indexOf('unavailable')<0){
      clearInterval(t);
      return;
    }
    askIp();
    askIpImage();
    if(n>8) clearInterval(t);
  }, 1000);
}
function showDeviceInfo(){
  var ua=navigator.userAgent||'';
  var model='Unknown';
  var ver='';
  var m;
  if((m=ua.match(/PlayStation 5\/([0-9.]+)/))){ model='PS5'; ver=m[1]; }
  else if((m=ua.match(/PlayStation 4\/([0-9.]+)/))){ model='PS4'; ver=m[1]; }
  else if(/iPhone/.test(ua)){ model='iPhone'; m=ua.match(/OS ([0-9_]+)/); if(m) ver=m[1].replace(/_/g,'.'); }
  else if(/iPad/.test(ua)){ model='iPad'; m=ua.match(/OS ([0-9_]+)/); if(m) ver=m[1].replace(/_/g,'.'); }
  else if((m=ua.match(/Android ([0-9.]+);\s*([^;)]+)/))){ ver=m[1]; model=(m[2]||'Android').replace(/\s*Build.*$/,'').trim()||'Android'; }
  else if(/Windows NT/.test(ua)){ model='PC'; ver='Windows'; }
  else if((m=ua.match(/Mac OS X ([0-9_]+)/))){ model='Mac'; ver=m[1].replace(/_/g,'.'); }
  else if(/Linux/.test(ua)){ model='Linux'; }
  var el=document.getElementById('deviceinfo');
  if(!el) return;
  if(model==='PS5' || model==='PS4') el.className='ps5mark';
  else el.className='';
  el.textContent=model+(ver?'  '+ver:'');
}
function privateIp(ip){
  return /^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[0-1])\./.test(ip);
}
function findLocalIp(){
  var RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection||window.mozRTCPeerConnection;
  var el=document.getElementById('deviceip');
  if(!RTC){ if(el) el.textContent='unavailable'; return; }
  var found=false;
  function show(ip){
    if(found||!privateIp(ip)) return;
    found=true;
    showDeviceIp(ip);
  }
  function hit(text){
    if(found||!text) return;
    var re=/(\d+\.\d+\.\d+\.\d+)/g, m;
    while((m=re.exec(String(text)))) show(m[1]);
  }
  function open(opts){
    var pc;
    try{ pc=opts?new RTC(opts):new RTC(); }catch(err){ return null; }
    try{ pc.createDataChannel(''); }catch(err2){}
    pc.onicecandidate=function(e){
      if(!e||!e.candidate) return;
      hit(e.candidate.candidate||'');
      if(e.candidate.address) hit(e.candidate.address);
    };
    function offerOk(o){
      hit(o&&o.sdp);
      try{
        var p=pc.setLocalDescription(o);
        if(p&&p.then) p.then(function(){ hit(pc.localDescription&&pc.localDescription.sdp); });
      }catch(err3){
        try{ pc.setLocalDescription(o, function(){ hit(pc.localDescription&&pc.localDescription.sdp); }, function(){}); }catch(err4){}
      }
    }
    try{
      pc.createOffer(offerOk, function(){}, {offerToReceiveAudio:true});
    }catch(err5){
      try{
        var made=pc.createOffer();
        if(made&&made.then) made.then(offerOk).catch(function(){});
      }catch(err6){}
    }
    return pc;
  }
  var pcs=[];
  var a=open({iceServers:[]});
  if(a) pcs.push(a);
  setTimeout(function(){
    if(found) return;
    var b=open({iceServers:[{url:'stun:stun.l.google.com:19302'}]});
    if(b) pcs.push(b);
  }, 600);
  setTimeout(function(){
    var i;
    if(!found&&el&&el.textContent.indexOf('looking')>=0) el.textContent='unavailable';
    for(i=0;i<pcs.length;i++){ try{ pcs[i].close(); }catch(err7){} }
  }, 5000);
}
function tickClock(){
  var d=new Date();
  var p=function(n){ return (n<10?'0':'')+n; };
  var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var t=document.getElementById('clk-time');
  var dt=document.getElementById('clk-date');
  if(t) t.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  if(dt) dt.textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

      setTimeout(function(){
        setStatus('Elfldr Ready');
        rememberActive('elfldr-ps5.elf');

  }
}

if(start)showFolder(start); else showHome();
